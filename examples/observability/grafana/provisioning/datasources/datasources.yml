apiVersion: 1

# Auto-wire Loki + Tempo on Grafana startup. Both endpoints reference the
# in-network Compose service hostnames, not localhost — Grafana runs inside
# the same Docker network as loki and tempo.

datasources:
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    jsonData:
      # Allow Grafana to dereference traceId fields on log lines into Tempo
      # links. Matches the structured-metadata key Xenon emits via PR #85.
      derivedFields:
        - datasourceUid: tempo
          matcherRegex: '"traceId":"([a-f0-9]+)"'
          name: traceId
          url: '$${__value.raw}'

  - name: Tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    uid: tempo
    isDefault: true
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: '-1h'
        spanEndTimeShift: '1h'
        filterByTraceID: true
        filterBySpanID: false
      serviceMap:
        datasourceUid: tempo
      # nodeGraph enables the trace topology view.
      nodeGraph:
        enabled: true
