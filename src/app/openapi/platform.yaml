paths:
  # ---------------------------------------------------------------- Health & Ops
  /api/health:
    get:
      operationId: getServerHealth
      summary: Check that the server is up
      description: |
        Liveness probe. Public: no credential, no rate limit. Answers `{ "ok": true }` as soon as
        the API is serving requests. It checks nothing else (not the database, not the devices),
        so use it for load-balancer and Kubernetes liveness checks, not readiness.
      tags:
        - Health & Ops
      security: []
      responses:
        '200':
          description: The server is up.
          content:
            application/json:
              schema:
                type: object
                required:
                  - ok
                properties:
                  ok:
                    type: boolean
                    example: true
              example:
                ok: true
  /api/ping:
    get:
      operationId: pingServer
      summary: Check a credential and read the server version
      description: |
        Answers `{ pong, version }` for any valid credential. Use it to confirm that a key pair,
        bearer token or dashboard session is accepted, and to read the running Xenon version.
        Counts against the `read` rate-limit budget.
      tags:
        - Health & Ops
      responses:
        '200':
          description: The credential is valid.
          content:
            application/json:
              schema:
                type: object
                required:
                  - pong
                  - version
                properties:
                  pong:
                    type: boolean
                    example: true
                  version:
                    type: string
                    description: The running Xenon version.
                    example: 2.12.0
              example:
                pong: true
                version: 2.12.0
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/metrics:
    get:
      operationId: getPrometheusMetrics
      summary: Read server metrics in Prometheus format
      description: |
        Prometheus text exposition of the server's counters and gauges. Any valid credential may
        read it (no role or scope beyond being signed in); point a scraper at it with a key pair
        or bearer token.

        Series:
        - `xenon_sessions_total{status="started"|"success"|"failure"}`: persisted session counters.
        - `xenon_sessions_active`: sessions this server tracks right now.
        - `xenon_devices_total`, `xenon_devices_busy`, `xenon_devices_offline`.
        - `xenon_healing_total{status="attempt"|"success"}`: persisted self-healing counters.
        - Per-tier healing series (`xenon_heal_tier_attempts_total`, `..._successes_total`,
          `..._failures_total`, `xenon_heal_tier_duration_seconds_sum`, labelled `tier` and
          `name`), `xenon_heal_all_tiers_failed_total` and
          `xenon_heal_tier_skipped_remaining_total`. These are kept in memory and start again
          from zero when the server restarts.
      tags:
        - Health & Ops
      responses:
        '200':
          description: The metrics, as Prometheus text.
          content:
            text/plain:
              schema:
                type: string
              example: |
                # HELP xenon_sessions_total Total number of sessions across all time
                # TYPE xenon_sessions_total counter
                xenon_sessions_total{status="started"} 1284
                xenon_sessions_total{status="success"} 1190
                xenon_sessions_total{status="failure"} 94
                # HELP xenon_sessions_active Current active sessions in the hub
                # TYPE xenon_sessions_active gauge
                xenon_sessions_active 3
                # HELP xenon_devices_total Total managed devices in the fleet
                # TYPE xenon_devices_total gauge
                xenon_devices_total 12
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  # ----------------------------------------------------------------------- Admin
  /api/cliArgs:
    get:
      operationId: listStoredCliArgs
      summary: Read the Appium arguments the server stored
      description: |
        The plugin arguments this lab has stored, one object per stored entry, oldest first. They
        include the database URL, AI and cloud provider settings and the hub URL, so this needs
        the `ADMIN` role and the `admin` scope. Values are redacted the way the server log
        redacts them: a value under a key that looks secret (password, token, API key, auth,
        database URL, and similar) and any string shaped like a provider key reads
        `***REDACTED***`.
      tags:
        - Admin
      responses:
        '200':
          description: The stored arguments, redacted.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
              example:
                - platform: both
                  hub: http://192.168.1.10:4723
                  bindHostOrIp: 192.168.1.20
                  databaseUrl: '***REDACTED***'
                  aiProvider: gemini
                  geminiApiKey: '***REDACTED***'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/processes:
    get:
      operationId: listSupervisedProcesses
      summary: List the child processes Xenon supervises
      description: |
        A snapshot of the long-lived child processes this server has started and tracks:
        WebDriverAgent, ffmpeg recorders, `adb reverse` forwards, iOS MJPEG forwarders, log
        tailers and others. Useful when a host runs hot or a device seems wedged. `sessionId` and
        `udid` are present only when the process belongs to one. Needs the `ADMIN` role and the
        `admin` scope.
      tags:
        - Admin
      responses:
        '200':
          description: The supervised processes.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlatformProcess'
              example:
                - id: 6f1d2c3b-4a5e-4f60-8a7b-9c0d1e2f3a4b
                  udid: 00008110-00084CE80E51401E
                  kind: wda
                  pid: 48213
                  uptimeMs: 734120
                - id: 0b9a8c7d-6e5f-4a3b-8c2d-1e0f9a8b7c6d
                  sessionId: 8f14e45f-ceea-467a-9b36-2f1c5d0e7a11
                  udid: R5CT32ABCDE
                  kind: ffmpeg
                  pid: 48977
                  uptimeMs: 61500
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  # ---------------------------------------------------------------- Configuration
  /api/config:
    get:
      operationId: getLabSettings
      summary: Read the lab's settings and AI provider
      description: |
        The lab-wide settings stored in the database (health checks and build cleanup), merged
        with the AI settings currently in effect. API keys are never returned: `geminiSet`,
        `openaiSet` and `anthropicSet` say only whether one is configured. A setting never saved
        is absent. Needs the `ADMIN` role or above, as the dashboard's settings pages do; through
        2.12 any signed-in user could read it.
      tags:
        - Configuration
      responses:
        '200':
          description: The settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformSettings'
              example:
                healthCheckIntervalMs: 300000
                buildCleanupDays: 30
                aiProvider: gemini
                aiModel: gemini-3-flash-preview
                geminiModel: gemini-3-flash-preview
                openaiModel: gpt-4o
                anthropicModel: claude-sonnet-4-6
                ollamaModel: llama3
                geminiSet: true
                openaiSet: false
                anthropicSet: false
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          description: The settings could not be read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: true
                message: Can't reach database server
    post:
      operationId: updateLabSettings
      summary: Change the lab's settings and AI provider
      description: |
        Saves the lab-wide settings and changes the AI provider settings. Every field is
        optional; fields not sent are left as they are, and unknown fields are ignored.

        - Health-check and build-cleanup fields are stored in the database.
        - AI fields (`aiProvider`, `aiModel`, `aiBaseUrl` and the per-provider models) change the
          running server only. They are not stored, so a restart returns to the values the
          server was started with. API keys can't be set here; they come from the server's
          environment.

        Needs the `SUPER_ADMIN` role and the `admin` scope; an `ADMIN` gets `403` with a message
        saying so (through 2.12 an `ADMIN` could). With the dashboard cookie the request must
        come from the same host (`Origin` or `Referer`).
      tags:
        - Configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformSettingsUpdate'
            example:
              healthCheckIntervalMs: 300000
              buildCleanupDays: 14
              deleteBuildAssets: true
              aiProvider: anthropic
              anthropicModel: claude-sonnet-4-6
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
              example:
                success: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PlatformSettingsRefused'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          description: The settings could not be saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: true
                message: Unique constraint failed on the fields (`id`)
  /api/config/reset-metrics:
    post:
      operationId: resetDeviceHealCounts
      summary: Reset every device's healed-selector count
      description: |
        Sets every device's healed-selector count (`totalHealedCount`) back to zero. Nothing else
        is reset: the session and healing counters on `/api/metrics` are unchanged. Takes no
        body. Needs the `SUPER_ADMIN` role and the `admin` scope, as every change under
        `/api/config` does. With the dashboard cookie the request must come from the same host.
      tags:
        - Configuration
      responses:
        '200':
          description: Reset.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
              example:
                success: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PlatformSettingsRefused'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          description: The counts could not be reset.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: true
                message: Can't reach database server
  /api/config/test-ai:
    post:
      operationId: testAiProviderConnection
      summary: Test a connection to an AI provider
      description: |
        Sends a one-line prompt to an AI provider and says whether it answered. The provider,
        model and base URL are taken from the body, falling back to the server's current
        settings. The API key is the server's own (from its environment); a key in the body is
        used only when the server has none for that provider. Nothing is saved.

        The answer is `200` whether or not the connection worked: read `success`. A provider that
        answers but is out of quota still counts as a success, with a note in `message`.

        Needs the `SUPER_ADMIN` role and the `admin` scope. Counts against the `heavy` rate-limit
        budget. With the dashboard cookie the request must come from the same host.
      tags:
        - Configuration
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformAiTestRequest'
            example:
              aiProvider: ollama
              aiModel: llama3
              aiBaseUrl: http://localhost:11434
      responses:
        '200':
          description: The result of the test.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformAiTestResult'
              examples:
                connected:
                  value:
                    success: true
                    message: Successfully connected to gemini!
                failed:
                  value:
                    success: false
                    message: >-
                      Connection failed: OpenAI API Key missing. Please set XENON_OPENAI_API_KEY
                      environment variable.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  # --------------------------------------------------------------------- Webhooks
  /api/webhook:
    get:
      operationId: listWebhooks
      summary: List the webhooks Xenon sends events to
      description: |
        Every configured webhook. `events` is stored and returned as a JSON-encoded string, not
        an array. Needs the `ADMIN` role and the `admin` scope: the URLs are often secrets
        (Slack's are).
      tags:
        - Webhooks
      responses:
        '200':
          description: The webhooks.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlatformWebhook'
              example:
                - id: 2d6f4a8e-1b3c-4d5e-9f60-7a8b9c0d1e2f
                  url: https://hooks.slack.com/services/T000/B000/XXXXXXXX
                  type: slack
                  events: '["device_offline","session_failed"]'
                  active: true
                  payloadTemplate: null
                  createdAt: '2026-09-12T08:14:03.000Z'
                  updatedAt: '2026-09-12T08:14:03.000Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          description: The webhooks could not be read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Failed to fetch configurations
    post:
      operationId: createWebhook
      summary: Add a webhook
      description: |
        Adds a webhook, active at once. When one of its `events` happens Xenon POSTs to `url`:

        - with `payloadTemplate`: the template, with each `{{key}}` (or `{{a.b}}`) replaced from
          the event (`eventType` plus the event's fields), sent as JSON if the result parses as
          JSON, otherwise as `{ "text": "<result>" }`;
        - otherwise, `type: slack`: a Slack message with an attachment;
        - otherwise: `{ "event": "<event>", "payload": { ... } }`.

        Each delivery is one POST, never retried. A template whose result isn't JSON is sent
        once, as text. A webhook that refuses an event or can't be reached doesn't fail the
        event: the failure is logged on the server and the other webhooks still get it. Use
        `POST /api/webhook/test` to see whether a webhook accepts deliveries.

        Events are `device_offline`, `session_failed`, `device_new` and
        `selector_health_digest`. Neither `url` nor the event names are checked. Needs the
        `ADMIN` role and the `admin` scope. With the dashboard cookie the request must come from
        the same host.
      tags:
        - Webhooks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformWebhookCreate'
            example:
              url: https://hooks.slack.com/services/T000/B000/XXXXXXXX
              events:
                - device_offline
                - session_failed
              type: slack
      responses:
        '200':
          description: The webhook as stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformWebhook'
              example:
                id: 2d6f4a8e-1b3c-4d5e-9f60-7a8b9c0d1e2f
                url: https://hooks.slack.com/services/T000/B000/XXXXXXXX
                type: slack
                events: '["device_offline","session_failed"]'
                active: true
                payloadTemplate: null
                createdAt: '2026-10-04T09:30:12.000Z'
                updatedAt: '2026-10-04T09:30:12.000Z'
        '400':
          description: '`url` or the `events` array is missing.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: 'Invalid parameters: url and events array required'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          description: The webhook could not be saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Failed to save configuration
  /api/webhook/{id}:
    delete:
      operationId: deleteWebhook
      summary: Remove a webhook
      description: |
        Removes a webhook. Needs the `ADMIN` role and the `admin` scope. With the dashboard
        cookie the request must come from the same host. An unknown id answers `404`.
      tags:
        - Webhooks
      parameters:
        - in: path
          name: id
          required: true
          description: The webhook's id.
          schema:
            type: string
            example: 2d6f4a8e-1b3c-4d5e-9f60-7a8b9c0d1e2f
      responses:
        '200':
          description: Removed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
              example:
                success: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No webhook has this id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: not_found
                message: Webhook not found
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          description: Not removed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Failed to delete configuration
  /api/webhook/test:
    post:
      operationId: testWebhook
      summary: Send a test message to a URL
      description: |
        Sends a sample `device_new` event (a device named `Test Device`, udid
        `test-device-udid`, host `127.0.0.1`) to `url` the way a webhook with this `type` and
        `payloadTemplate` gets its real events (see `POST /api/webhook`): the filled-in
        template if there is one, else a Slack message for `type: slack` (the default), else
        `{ "event": "device_new", "payload": { ... } }`. No stored webhook is involved.

        Answers `200` when `url` accepted the delivery (a 2xx), and `502 delivery_failed`, with
        the reason, when it refused it or couldn't be reached. Needs the `ADMIN` role and the
        `admin` scope. With the dashboard cookie the request must come from the same host.
      tags:
        - Webhooks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - url
              properties:
                url:
                  type: string
                  format: uri
                  description: Where to send the test message.
                  example: https://hooks.slack.com/services/T000/B000/XXXXXXXX
                type:
                  type: string
                  default: slack
                  description: >-
                    The webhook's type: `slack` for a Slack message, anything else for the
                    generic `{ event, payload }` body. Ignored when `payloadTemplate` is given.
                  example: slack
                payloadTemplate:
                  type: string
                  nullable: true
                  description: >-
                    The webhook's template, filled in from the sample event as a real event's
                    would be.
                  example: '{"text": "{{eventType}}: {{name}} ({{udid}})"}'
            example:
              url: https://hooks.slack.com/services/T000/B000/XXXXXXXX
              type: slack
      responses:
        '200':
          description: Delivered; `url` answered with a 2xx.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
              example:
                success: true
        '400':
          description: '`url` is missing or not a string.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: url is required
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          description: "`url` refused the delivery (a non-2xx answer) or couldn't be reached."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                refused:
                  summary: The webhook refused it
                  value:
                    error: delivery_failed
                    message: Request failed with status code 404
                unreachable:
                  summary: The webhook couldn't be reached
                  value:
                    error: delivery_failed
                    message: getaddrinfo ENOTFOUND hooks.example.invalid
  # ----------------------------------------------------------------- Applications
  /api/apps:
    get:
      operationId: listApps
      summary: List the uploaded apps you can see
      description: |
        The uploaded app builds visible to the caller, newest first, each with its team. Admins
        see every app; members see shared apps (`teamId` null) and their teams' apps. Any
        signed-in user may call it.
      tags:
        - Applications
      responses:
        '200':
          description: The apps.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlatformAppWithTeam'
              example:
                - id: 9adc3f2e-7b1a-4c6d-8e9f-0a1b2c3d4e5f
                  name: checkout-2.4.1.apk
                  filename: checkout-2.4.1.apk
                  filepath: /home/lab/.cache/xenon/apps/9adc3f2e-7b1a-4c6d-8e9f-0a1b2c3d4e5f.apk
                  mimetype: application/vnd.android.package-archive
                  size: 48213377
                  packageName: com.example.checkout
                  version: 2.4.1
                  platform: android
                  md5: 5f4dcc3b5aa765d61d8327deb882cf99
                  teamId: 7e1c2a90-3b4d-4f5e-8a6b-1c2d3e4f5a6b
                  team:
                    id: 7e1c2a90-3b4d-4f5e-8a6b-1c2d3e4f5a6b
                    name: Payments
                  createdAt: '2026-09-30T14:02:11.000Z'
                  updatedAt: '2026-09-30T14:02:11.000Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/apps/upload:
    post:
      operationId: uploadApp
      summary: Upload an app build
      description: |
        Stores an app build (multipart field `app`), in a team's library or the shared pool.
        `.apk` files are read for their package name and version, and marked `android`; `.ipa`
        files are marked `ios`; any other file is stored with no platform.

        Uploading bytes that are already stored (same MD5) stores nothing new and returns the
        existing app as it is, in whatever team it is already in. Move it with
        `PUT /api/apps/{id}/team`.

        Needs the `ADMIN` role and the `devices` scope (or `admin`). With the dashboard cookie the
        request must come from the same host.
      tags:
        - Applications
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - app
              properties:
                app:
                  type: string
                  format: binary
                  description: The app file (`.apk` or `.ipa`).
                teamId:
                  type: string
                  description: The team whose members may see it. Empty or absent means the shared pool.
                  example: 7e1c2a90-3b4d-4f5e-8a6b-1c2d3e4f5a6b
      responses:
        '200':
          description: The stored app (new, or the existing one with the same bytes).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformApp'
              example:
                id: 9adc3f2e-7b1a-4c6d-8e9f-0a1b2c3d4e5f
                name: checkout-2.4.1.apk
                filename: checkout-2.4.1.apk
                filepath: /home/lab/.cache/xenon/apps/9adc3f2e-7b1a-4c6d-8e9f-0a1b2c3d4e5f.apk
                mimetype: application/vnd.android.package-archive
                size: 48213377
                packageName: com.example.checkout
                version: 2.4.1
                platform: android
                md5: 5f4dcc3b5aa765d61d8327deb882cf99
                teamId: 7e1c2a90-3b4d-4f5e-8a6b-1c2d3e4f5a6b
                createdAt: '2026-10-04T09:12:44.000Z'
                updatedAt: '2026-10-04T09:12:44.000Z'
        '400':
          description: No file, no `app` field, a `teamId` that isn't a string, or an unknown team.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                noFile:
                  value:
                    error: No files were uploaded.
                noAppField:
                  value:
                    error: Field "app" is required.
                unknownTeam:
                  value:
                    error: team not found
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/apps/{id}:
    delete:
      operationId: deleteApp
      summary: Delete an uploaded app
      description: |
        Deletes the app's file and its record. Needs the `ADMIN` role and the `devices` scope (or
        `admin`). With the dashboard cookie the request must come from the same host.
      tags:
        - Applications
      parameters:
        - $ref: '#/components/parameters/PlatformAppId'
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/PlatformAppNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/apps/{id}/download:
    get:
      operationId: downloadApp
      summary: Download an uploaded app
      description: |
        The app file, as an attachment under its original file name. An app outside the caller's
        teams answers `404`, exactly like an unknown id.

        Besides the usual credentials, this accepts `?ticket=`: a single-use ticket bound to this
        one app, valid for 10 minutes, which Xenon puts in the app URL it hands an Appium driver
        (the driver downloads the app with no credentials). A ticket that is invalid, expired,
        already used or for another app answers `401 invalid ticket`. Tickets can't be minted
        through the API.
      tags:
        - Applications
      parameters:
        - $ref: '#/components/parameters/PlatformAppId'
        - in: query
          name: ticket
          required: false
          description: A single-use app download ticket, in place of a credential.
          schema:
            type: string
            example: eyJhbGciOiJSUzI1NiIsImtpZCI6Inhlbm9uLTEifQ.eyJhdWQiOiJ4ZW5vbi1hcHAtZG93bmxvYWQifQ.c2ln
      responses:
        '200':
          description: The app file.
          headers:
            Content-Disposition:
              description: '`attachment; filename="<original name>"`.'
              schema:
                type: string
                example: attachment; filename="checkout-2.4.1.apk"
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          description: No valid credential, or an invalid ticket.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                unauthenticated:
                  value:
                    error: unauthenticated
                invalidTicket:
                  value:
                    error: invalid ticket
        '404':
          $ref: '#/components/responses/PlatformAppNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/apps/{id}/team:
    put:
      operationId: setAppTeam
      summary: Move an app to a team or the shared pool
      description: |
        Sets which team's members may see the app. `teamId: null` (or an empty string, or no
        `teamId`) moves it to the shared pool, which everyone sees. Needs the `ADMIN` role and the
        `admin` scope. With the dashboard cookie the request must come from the same host.
      tags:
        - Applications
      parameters:
        - $ref: '#/components/parameters/PlatformAppId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                teamId:
                  type: string
                  nullable: true
                  description: The team's id, or null for the shared pool.
                  example: 7e1c2a90-3b4d-4f5e-8a6b-1c2d3e4f5a6b
            example:
              teamId: 7e1c2a90-3b4d-4f5e-8a6b-1c2d3e4f5a6b
      responses:
        '200':
          description: Moved.
          content:
            application/json:
              schema:
                type: object
                required:
                  - ok
                  - updated
                properties:
                  ok:
                    type: boolean
                    example: true
                  updated:
                    type: integer
                    description: Apps changed (always 1 here).
                    example: 1
              example:
                ok: true
                updated: 1
        '400':
          description: '`teamId` is neither a string nor null.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: teamId must be a string or null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No such app, or no such team.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                unknownApp:
                  value:
                    error: App not found
                unknownTeam:
                  value:
                    error: team not found
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  # ------------------------------------------------------------------- Recordings
  /api/recordings:
    get:
      operationId: listRecordings
      summary: List recordings, newest first
      description: |
        The recordings library: one summary per recording (a group of one or more phones
        recorded together), newest first, filtered and paged, with facets for the filter menus.

        Visibility: admins see every recording. Others see the phones they can see (their teams'
        and the shared pool), so a recording that mixes teams shows only those phones, and a
        recording with none of them is left out. The person who started a recording also keeps
        seeing their own phones that have since been unplugged.

        `facets` count every recording the caller can see, before the filters. `total` counts
        those that match the filters. Pass `nextCursor` back as `cursor` for the next page.
        Any signed-in user may call it.
      tags:
        - Recordings
      parameters:
        - in: query
          name: limit
          required: false
          description: Recordings per page, at most 200.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - in: query
          name: cursor
          required: false
          description: '`nextCursor` from the previous page.'
          schema:
            type: string
            example: 1759568400000_c3b2a1f0-5e4d-4c3b-9a8f-7e6d5c4b3a21
        - in: query
          name: udid
          required: false
          description: Only recordings that include this phone.
          schema:
            type: string
            example: R5CT32ABCDE
        - in: query
          name: startedBy
          required: false
          description: Only recordings started by this user id, or `unknown` for those with no recorded starter.
          schema:
            type: string
            example: 3f2a1b0c-9d8e-4f7a-b6c5-d4e3f2a1b0c9
        - in: query
          name: since
          required: false
          description: Only recordings that started at or after this time (ISO 8601).
          schema:
            type: string
            format: date-time
            example: '2026-09-27T00:00:00Z'
        - in: query
          name: q
          required: false
          description: Case-insensitive text matched against phone names, udids and bookmark labels.
          schema:
            type: string
            example: login
      responses:
        '200':
          description: A page of recordings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingLibraryPage'
              example:
                recordings:
                  - groupId: c3b2a1f0-5e4d-4c3b-9a8f-7e6d5c4b3a21
                    startedAt: '2026-10-04T08:20:00.000Z'
                    endedAt: '2026-10-04T08:23:41.000Z'
                    durationMs: 221400
                    status: done
                    phones:
                      - recordingId: 8f14e45f-ceea-467a-9b36-2f1c5d0e7a11
                        udid: R5CT32ABCDE
                        name: Galaxy S23
                        platform: android
                        status: STOPPED
                        offsetMs: -320
                        durationMs: 221080
                        failReason: null
                        annotationCount: 2
                    startedBy:
                      id: 3f2a1b0c-9d8e-4f7a-b6c5-d4e3f2a1b0c9
                      name: Priya Raman
                    bookmarkCount: 1
                    annotationCount: 2
                    keptUntil: '2026-11-03T08:20:00.000Z'
                    sizeBytes: 18342011
                    hasComposite: false
                nextCursor: null
                total: 1
                facets:
                  phones:
                    - udid: R5CT32ABCDE
                      name: Galaxy S23
                      count: 1
                  people:
                    - id: 3f2a1b0c-9d8e-4f7a-b6c5-d4e3f2a1b0c9
                      name: Priya Raman
                      count: 1
                  unknownCount: 0
                  when:
                    any: 1
                    24h: 1
                    7d: 1
                    30d: 1
                retention:
                  days: 30
                  maxCount: 100
        '400':
          description: A query parameter is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                limit:
                  value:
                    error: limit must be a whole number from 1
                since:
                  value:
                    error: since must be an ISO time
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/RecordingInternalError'
    post:
      operationId: startRecording
      summary: Start recording one or more phones
      description: |
        Starts one recording group: one video per phone and, for two or more phones, a
        side-by-side composite video. The phone's live stream is started if it isn't running.
        Each phone is held for the caller (as a live preview is) until the recording ends.

        All or nothing up front: if any phone is busy, or the server's cap on simultaneous
        recordings would be exceeded, nothing starts (`409`). A phone is busy when it is already
        being recorded, held by another user, or running an Appium session. Your own preview hold
        doesn't count. After that, a phone whose capture fails to start is left out of
        `recordings` and the rest record on.

        Members may record only phones they can see: if any is outside their teams, or unknown,
        the answer is `404` and nothing starts. Any signed-in user whose credential has the `devices` scope (or `admin`) may call it.
        With the dashboard cookie the request must come from the same host.
      tags:
        - Recordings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - udids
              properties:
                udids:
                  type: array
                  minItems: 1
                  items:
                    type: string
                  description: The phones to record.
                  example:
                    - R5CT32ABCDE
                    - 00008110-00084CE80E51401E
                sessionId:
                  type: string
                  description: An Appium session to link the recordings to. It must be an existing session's id.
                  example: 5b2e9c1a-0f3d-4e6a-8b7c-2d1e0f9a8b7c
                note:
                  type: string
                  description: Accepted, but not stored.
            example:
              udids:
                - R5CT32ABCDE
                - 00008110-00084CE80E51401E
      responses:
        '202':
          description: Recording started.
          content:
            application/json:
              schema:
                type: object
                required:
                  - groupId
                  - recordings
                  - startedAt
                  - compositeEnabled
                properties:
                  groupId:
                    type: string
                    example: c3b2a1f0-5e4d-4c3b-9a8f-7e6d5c4b3a21
                  recordings:
                    type: array
                    description: The phones now recording. A phone whose capture failed to start is not listed.
                    items:
                      $ref: '#/components/schemas/RecordingStarted'
                  startedAt:
                    type: string
                    format: date-time
                  compositeEnabled:
                    type: boolean
                    description: Whether a side-by-side composite is being recorded.
              example:
                groupId: c3b2a1f0-5e4d-4c3b-9a8f-7e6d5c4b3a21
                recordings:
                  - id: 8f14e45f-ceea-467a-9b36-2f1c5d0e7a11
                    udid: R5CT32ABCDE
                    status: RECORDING
                  - id: 1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
                    udid: 00008110-00084CE80E51401E
                    status: RECORDING
                startedAt: '2026-10-04T08:20:00.000Z'
                compositeEnabled: true
        '400':
          description: '`udids` is missing, empty, or holds something other than non-empty strings.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: udids must be a non-empty array
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/RecordingNotFound'
        '409':
          $ref: '#/components/responses/RecordingStartConflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/RecordingInternalError'
  /api/recordings/active:
