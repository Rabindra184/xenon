    delete:
      operationId: deleteRecording
      summary: Delete a recording
      description: |
        Deletes the recording's videos, bookmarks and marks, for the phones the caller can see.
        A phone on another team stays, with the composite video, until no phone of the recording
        is left; an admin sees every phone, so deletes the whole recording. Irreversible.

        Only the person who started the recording, or an admin, may delete it (`403 not_owner`).
        A recording any of whose phones is still recording can't be deleted (`409`). An API key
        needs the `devices` scope (or `admin`). With the dashboard cookie the request must come
        from the same host. The checks run in the order `404`, `409`, `403`.
      tags:
        - Recordings
      parameters:
        - $ref: '#/components/parameters/RecordingGroupId'
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            Not the person who started it, or the credential lacks the `devices` scope, or a
            browser request failed the same-origin check.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notOwner:
                  value:
                    error: not_owner
                    message: Only the person who recorded it, or an admin, can delete it.
                scope:
                  value:
                    error: insufficient scope
        '404':
          $ref: '#/components/responses/RecordingNotFound'
        '409':
          description: A phone of this recording is still recording.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: recording_in_progress
                message: Stop the recording on Live devices before deleting it.
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/RecordingInternalError'
  /api/recordings/{groupId}/add-device:
    post:
      operationId: addPhoneToRecording
      summary: Add a phone to a running recording
      description: |
        Starts recording one more phone in an existing group. Its marks are placed on the group's
        timeline by how late it joined. It doesn't join the side-by-side composite, which keeps
        the phones it started with.

        Like starting a recording, it is refused with `409` if the phone is busy or the server's
        recording cap is reached, and nothing starts. A member gets `404` for a group they can't
        see any phone of, or a phone outside their teams. Any signed-in user whose credential has the `devices` scope (or `admin`) may call it.
        With the dashboard cookie the request must come from the same host.
      tags:
        - Recordings
      parameters:
        - $ref: '#/components/parameters/RecordingGroupId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - udid
              properties:
                udid:
                  type: string
                  description: The phone to add.
                  example: R5CT32ABCDE
            example:
              udid: R5CT32ABCDE
      responses:
        '201':
          description: The phone is recording.
          content:
            application/json:
              schema:
                type: object
                required:
                  - recording
                properties:
                  recording:
                    $ref: '#/components/schemas/RecordingStarted'
              example:
                recording:
                  id: 6e7f8a9b-0c1d-4e2f-8a3b-4c5d6e7f8a9b
                  udid: R5CT32ABCDE
                  status: RECORDING
        '400':
          description: '`udid` is missing or empty.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: udid must be a non-empty string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/RecordingNotFound'
        '409':
          $ref: '#/components/responses/RecordingStartConflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/RecordingInternalError'
  /api/recordings/{groupId}/stop:
    post:
      operationId: stopRecording
      summary: Stop a recording
      description: |
        Stops every phone of the group, the side-by-side composite first, and finishes each video
        separately: a phone whose video fails doesn't stop the others. Each phone is then let go
        (its preview hold released once nobody watches it).

        Stopping is group-wide even for a caller who sees only some of its phones; the answer
        lists only the phones they can see. Each video's `status` is `STOPPED`, or `FAILED` when
        its file is missing or too small to play. `durationMs` is the video's own length.

        A phone whose recording had already ended (its stream ended earlier, or the group was
        already stopped) is left as it is: its end, length and failure reason are kept, and the
        phone isn't let go a second time. It is reported with its stored `status`, `durationMs`
        and `sizeBytes`, so stopping a group again changes none of its videos. A phone whose
        stream is ending at that very moment is reported as it stands, and may still say
        `RECORDING`.

        A member gets `404` for a group they can't see any phone of. Any signed-in user whose credential has the `devices` scope (or `admin`) may call it.
        With the dashboard cookie the request must come from the same host.
      tags:
        - Recordings
      parameters:
        - $ref: '#/components/parameters/RecordingGroupId'
      responses:
        '200':
          description: Stopped.
          content:
            application/json:
              schema:
                type: object
                required:
                  - groupId
                  - recordings
                properties:
                  groupId:
                    type: string
                    example: c3b2a1f0-5e4d-4c3b-9a8f-7e6d5c4b3a21
                  recordings:
                    type: array
                    items:
                      $ref: '#/components/schemas/RecordingStopped'
              example:
                groupId: c3b2a1f0-5e4d-4c3b-9a8f-7e6d5c4b3a21
                recordings:
                  - id: 8f14e45f-ceea-467a-9b36-2f1c5d0e7a11
                    udid: R5CT32ABCDE
                    status: STOPPED
                    durationMs: 221080
                    sizeBytes: 18342011
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/RecordingNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/RecordingInternalError'
  /api/recordings/{groupId}/bookmark:
    post:
      operationId: addRecordingBookmark
      summary: Add a bookmark to a phone's recording
      description: |
        Adds a labelled bookmark at a point on the group's timeline, on one phone's recording.
        The recording must belong to this group and be on a phone the caller can see, otherwise
        `404`. Dashboards watching the recording are told at once. Any signed-in user whose credential has the `devices` scope (or `admin`) may call it.
        With the dashboard cookie the request must come from the same host.
      tags:
        - Recordings
      parameters:
        - $ref: '#/components/parameters/RecordingGroupId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - recordingId
                - timecodeMs
                - label
              properties:
                recordingId:
                  type: string
                  description: The phone's recording (`recordings[].id`).
                  example: 8f14e45f-ceea-467a-9b36-2f1c5d0e7a11
                timecodeMs:
                  type: integer
                  description: Milliseconds from the group's t=0.
                  example: 38000
                label:
                  type: string
                  example: Login failed
                note:
                  type: string
                  example: Spinner never stops
      responses:
        '201':
          description: The bookmark as stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingBookmarkRow'
              example:
                id: 4c5d6e7f-8a9b-4c0d-9e1f-2a3b4c5d6e7f
                recording_id: 8f14e45f-ceea-467a-9b36-2f1c5d0e7a11
                timecode_ms: 38000
                label: Login failed
                note: Spinner never stops
                created_at: '2026-10-04T08:20:38.000Z'
        '400':
          description: A required field is missing or has the wrong type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: recordingId (string), timecodeMs (number) and label (string) are required
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/RecordingNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/RecordingInternalError'
  /api/recordings/{groupId}/annotation:
    post:
      operationId: addRecordingAnnotation
      summary: Draw a mark on a phone's recording
      description: |
        Adds a mark (a box, circle, arrow, text or freehand stroke) at a point on the group's
        timeline, on one phone's recording. It stays on screen until the marks are cleared
        (`annotations/clear`), and is burned into the downloaded videos.

        `geometry` is a JSON string with the mark's box in coordinates from 0 to 1 of the frame:
        `{"x":…,"y":…,"w":…,"h":…}`. `image` is optional: the mark as the browser drew it, a PNG
        data URL of at most 2 MiB decoded, burned in as drawn instead of the server's own drawing.

        The recording must belong to this group and be on a phone the caller can see, otherwise
        `404`. Dashboards watching the recording are told at once. Any signed-in user whose credential has the `devices` scope (or `admin`) may call it.
        With the dashboard cookie the request must come from the same host.
      tags:
        - Recordings
      parameters:
        - $ref: '#/components/parameters/RecordingGroupId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - recordingId
                - timecodeMs
                - shape
                - geometry
                - color
              properties:
                recordingId:
                  type: string
                  example: 8f14e45f-ceea-467a-9b36-2f1c5d0e7a11
                timecodeMs:
                  type: integer
                  description: Milliseconds from the group's t=0.
                  example: 41250
                shape:
                  type: string
                  description: Any other value is drawn as a box.
                  enum:
                    - RECT
                    - CIRCLE
                    - ARROW
                    - TEXT
                    - FREEHAND
                  example: RECT
                geometry:
                  type: string
                  description: JSON with `x`, `y`, `w`, `h`, each from 0 to 1 of the frame.
                  example: '{"x":0.12,"y":0.4,"w":0.3,"h":0.08}'
                color:
                  type: string
                  example: red
                text:
                  type: string
                  description: The text of a `TEXT` mark.
                  example: Wrong total
                author:
                  type: string
                  description: Stored with the mark.
                image:
                  type: string
                  description: The mark as drawn, `data:image/png;base64,…`, at most 2 MiB decoded.
                  example: data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==
      responses:
        '201':
          description: The mark as stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingAnnotationRow'
              example:
                id: 9b8a7c6d-5e4f-4a3b-9c2d-1e0f9a8b7c6d
                recording_id: 8f14e45f-ceea-467a-9b36-2f1c5d0e7a11
                timecode_ms: 41250
                end_timecode_ms: null
                shape: RECT
                geometry: '{"x":0.12,"y":0.4,"w":0.3,"h":0.08}'
                color: red
                text: null
                author: null
                created_at: '2026-10-04T08:20:41.000Z'
        '400':
          description: A required field is missing or has the wrong type, or `image` is refused.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                fields:
                  value:
                    error: recordingId, timecodeMs, shape, geometry, color are required
                notPng:
                  value:
                    error: image is not a PNG
                tooLarge:
                  value:
                    error: image exceeds 2097152 bytes
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/RecordingNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/RecordingInternalError'
  /api/recordings/{groupId}/annotations/clear:
    post:
      operationId: clearRecordingAnnotations
      summary: Clear the marks on screen at a point in time
      description: |
        Ends, at `timecodeMs`, every mark of the group still on screen that started at or before
        it. Marks are kept (they show up to that point in the video), not deleted. Marks that
        started later, or were already cleared, are left alone, so repeating a clear changes
        nothing. Only the marks on phones the caller can see are cleared; an admin's clear covers
        the whole group.

        A member gets `404` for a group they can't see any phone of. Any signed-in user whose credential has the `devices` scope (or `admin`) may call it.
        With the dashboard cookie the request must come from the same host.
      tags:
        - Recordings
      parameters:
        - $ref: '#/components/parameters/RecordingGroupId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - timecodeMs
              properties:
                timecodeMs:
                  type: number
                  minimum: 0
                  description: Milliseconds from the group's t=0. Rounded to a whole millisecond.
                  example: 52000
            example:
              timecodeMs: 52000
      responses:
        '200':
          description: How many marks were ended.
          content:
            application/json:
              schema:
                type: object
                required:
                  - cleared
                properties:
                  cleared:
                    type: integer
                    example: 3
              example:
                cleared: 3
        '400':
          description: '`timecodeMs` is missing, negative or not a number.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: timecodeMs must be a finite number >= 0
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/RecordingNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/RecordingInternalError'
  /api/recordings/{groupId}/composite.mp4:
    get:
      operationId: getRecordingCompositeVideo
      summary: Download the side-by-side video of a recording
      description: |
        The composite video of a recording of two or more phones, all phones side by side, with
        the marks burned in when that rendering works (otherwise without them).

        `404 composite_not_found` when the recording has no composite (one phone, or the
        composite didn't start) and for a caller who can't see every phone in it, since it shows
        them all. Composites recorded before layouts were kept are served to admins only.

        Supports `Range` requests so a player can seek (`206`, or `416` with `Content-Range:
        bytes */<size>`), and sends `ETag` and `Last-Modified`. Any signed-in user may call it.
      tags:
        - Recordings
      parameters:
        - $ref: '#/components/parameters/RecordingGroupId'
        - $ref: '#/components/parameters/RecordingRange'
      responses:
        '200':
          description: The composite video.
          headers:
            Accept-Ranges:
              schema:
                type: string
                example: bytes
            ETag:
              schema:
                type: string
                example: W/"117c3b7-19a8f2c4e10"
            Last-Modified:
              schema:
                type: string
                example: Sun, 04 Oct 2026 08:24:31 GMT
          content:
            video/mp4:
              schema:
                type: string
                format: binary
        '206':
          $ref: '#/components/responses/RecordingVideoPartial'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: >-
            No composite the caller may have, or its file went missing before it could be sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notFound:
                  value:
                    error: composite_not_found
                noFile:
                  value:
                    error: video_not_found
        '416':
          $ref: '#/components/responses/RecordingRangeNotSatisfiable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          description: The file could not be sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: internal
  /api/recordings/{groupId}/video.mp4:
    get:
      operationId: downloadRecordingVideo
      summary: Download one phone's video, with marks
      description: |
        One phone's video as an attachment (`<udid>.mp4`), with its marks burned in when that
        rendering works. Pick the phone with `udid`; without it, this works only when the caller
        can see exactly one phone with a video in the group (otherwise use `videos.zip`).

        Supports `Range` requests (`206`, or `416` with `Content-Range: bytes */<size>`). Only
        phones the caller can see are served. Any signed-in user may call it.
      tags:
        - Recordings
      parameters:
        - $ref: '#/components/parameters/RecordingGroupId'
        - in: query
          name: udid
          required: false
          description: The phone whose video to download.
          schema:
            type: string
            example: R5CT32ABCDE
        - $ref: '#/components/parameters/RecordingRange'
      responses:
        '200':
          $ref: '#/components/responses/RecordingVideoAttachment'
        '206':
          $ref: '#/components/responses/RecordingVideoPartial'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No phone of the group the caller can see, or no video for the phone asked for.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notFound:
                  value:
                    error: not_found
                noVideoForPhone:
                  value:
                    error: video_not_found
                    message: No playable video for that device
                severalVideos:
                  value:
                    error: video_not_found
                    message: Use videos.zip when the group has multiple recordings
        '416':
          $ref: '#/components/responses/RecordingRangeNotSatisfiable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/RecordingInternalError'
  /api/recordings/{groupId}/source.mp4:
    get:
      operationId: streamRecordingSourceVideo
      summary: Stream one phone's video, without marks
      description: |
        One phone's video as recorded, with no marks burned in: what the recording page's player
        plays (it draws the marks itself). Supports `Range` requests so the player can seek
        (`206`, or `416` with `Content-Range: bytes */<size>`). With `download=1` it is sent as an
        attachment named `<udid>.mp4`.

        The recording must belong to this group and be on a phone the caller can see, otherwise
        `404`. Any signed-in user may call it.
      tags:
        - Recordings
      parameters:
        - $ref: '#/components/parameters/RecordingGroupId'
        - in: query
          name: recordingId
          required: true
          description: The phone's recording (`recordings[].id`).
          schema:
            type: string
            example: 8f14e45f-ceea-467a-9b36-2f1c5d0e7a11
        - in: query
          name: download
          required: false
          description: '`1` to send it as an attachment.'
          schema:
            type: string
            enum:
              - '1'
        - $ref: '#/components/parameters/RecordingRange'
      responses:
        '200':
          description: The video.
          headers:
            Accept-Ranges:
              schema:
                type: string
                example: bytes
          content:
            video/mp4:
              schema:
                type: string
                format: binary
        '206':
          $ref: '#/components/responses/RecordingVideoPartial'
        '400':
          description: '`recordingId` is missing.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: recordingId query param is required
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Not a recording of this group the caller can see, or its file is gone.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notFound:
                  value:
                    error: not_found
                noFile:
                  value:
                    error: video_not_found
        '416':
          $ref: '#/components/responses/RecordingRangeNotSatisfiable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/RecordingInternalError'
  /api/recordings/{groupId}/exports/annotated.mp4:
    get:
      operationId: exportAnnotatedRecordingVideo
      summary: Download one phone's video with marks burned in
      description: |
        One phone's video with its marks burned into the picture. Rendered on first request and
        then kept, so the first download of a recording with marks can take a while (it is
        usually prepared when the recording stops). A recording with no marks is served as
        recorded. Streamed whole: no `Range` support.

        The recording must belong to this group and be on a phone the caller can see, otherwise
        `404`. Any signed-in user may call it.
      tags:
        - Recordings
      parameters:
        - $ref: '#/components/parameters/RecordingGroupId'
        - in: query
          name: recordingId
          required: true
          description: The phone's recording (`recordings[].id`).
          schema:
            type: string
            example: 8f14e45f-ceea-467a-9b36-2f1c5d0e7a11
      responses:
        '200':
          description: The video with marks.
          content:
            video/mp4:
              schema:
                type: string
                format: binary
        '400':
          description: '`recordingId` is missing.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: recordingId query param is required
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/RecordingNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          description: The video could not be rendered or read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: render_failed
                message: ffmpeg exited with code 1
  /api/recordings/{groupId}/videos.zip:
    get:
      operationId: downloadRecordingVideosZip
      summary: Download a recording's videos as a zip
      description: |
        A zip of the recording's videos: `<udid>.mp4` for each phone the caller can see that has
        a video, with its marks burned in when that rendering works, and `composite.mp4` when
        there is a composite the caller may have (see `composite.mp4`). Nothing else. Any
        signed-in user may call it.
      tags:
        - Recordings
      parameters:
        - $ref: '#/components/parameters/RecordingGroupId'
      responses:
        '200':
          description: The zip, streamed.
          headers:
            Content-Disposition:
              schema:
                type: string
                example: attachment; filename="videos-c3b2a1f0-5e4d-4c3b-9a8f-7e6d5c4b3a21.zip"
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No phone of the group the caller can see, or none of them has a video.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notFound:
                  value:
                    error: not_found
                noVideos:
                  value:
                    error: no_videos
                    message: No playable videos in this group
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/RecordingInternalError'
  /api/recordings/{groupId}/bundle.zip:
    get:
      operationId: downloadRecordingProofBundle
      summary: Download a recording's proof bundle
      description: |
        A self-contained zip of the recording, for the phones the caller can see:

        - `manifest.json`: the group and each phone's recording (id, status, times, size);
        - `README.md`: a readable summary;
        - `composite.mp4`, when there is a composite the caller may have (marks burned in when
          that rendering works);
        - per phone, under `devices/<udid>/`: `video.mp4` (as recorded, no marks),
          `bookmarks.json`, `annotations.json` and `device.json`.

        Streamed as it is built: an error after it has started cuts the download short. Any
        signed-in user may call it.
      tags:
        - Recordings
      parameters:
        - $ref: '#/components/parameters/RecordingGroupId'
      responses:
        '200':
          description: The proof bundle, streamed.
          headers:
            Content-Disposition:
              schema:
                type: string
                example: attachment; filename="proof-c3b2a1f0-5e4d-4c3b-9a8f-7e6d5c4b3a21.zip"
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/RecordingNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/RecordingInternalError'

components:
  parameters:
    PlatformAppId:
      in: path
      name: id
      required: true
      description: The app's id.
      schema:
        type: string
        example: 9adc3f2e-7b1a-4c6d-8e9f-0a1b2c3d4e5f
    RecordingGroupId:
      in: path
      name: groupId
      required: true
      description: The recording's group id.
      schema:
        type: string
        example: c3b2a1f0-5e4d-4c3b-9a8f-7e6d5c4b3a21
    RecordingRange:
      in: header
      name: Range
      required: false
      description: A byte range, for seeking or resuming.
      schema:
        type: string
        example: bytes=0-1048575
  responses:
    PlatformSettingsRefused:
      description: The caller isn't a `SUPER_ADMIN`, or the credential lacks the `admin` scope.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            notSuperAdmin:
              summary: Not a super admin
              value:
                error: Only a super admin can change the lab's settings.
                message: Only a super admin can change the lab's settings.
            scope:
              summary: The admin scope is missing
              value:
                error: insufficient scope
    PlatformAppNotFound:
      description: No such app, or one outside the caller's teams (the two answer the same).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: App not found
    RecordingNotFound:
      description: |
        No such recording or phone, or none the caller can see (the two answer the same).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: not_found
    RecordingInternalError:
      description: An unexpected server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: internal
            message: Can't reach database server
    RecordingStartConflict:
      description: |
        Nothing was started: a phone is busy, or the server's cap on simultaneous recordings
        (`maxConcurrentRecordings`, 4 by default) would be exceeded.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            busy:
              value:
                error: device_busy
                busyDevices:
                  - udid: R5CT32ABCDE
                    reason: manual_other
                    blockId: manual_3f2a1b0c-9d8e-4f7a-b6c5-d4e3f2a1b0c9_R5CT32ABCDE
                message: 1 of 2 selected devices are busy. Recording was not started.
            cap:
              value:
                error: concurrency_cap
                limit: 4
                active: 4
                message: Server-wide recording cap reached (4/4).
    RecordingVideoAttachment:
      description: The video, as an attachment.
      headers:
        Content-Disposition:
          schema:
            type: string
            example: attachment; filename="R5CT32ABCDE.mp4"
        Accept-Ranges:
          schema:
            type: string
            example: bytes
      content:
        video/mp4:
          schema:
            type: string
            format: binary
    RecordingVideoPartial:
      description: The requested byte range.
      headers:
        Content-Range:
          schema:
            type: string
            example: bytes 0-1048575/18342011
      content:
        video/mp4:
          schema:
            type: string
            format: binary
    RecordingRangeNotSatisfiable:
      description: The `Range` lies outside the file.
      headers:
        Content-Range:
          description: '`bytes */<size>`: the length to ask within.'
          schema:
            type: string
            example: bytes */18342011
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: range_not_satisfiable
  schemas:
    PlatformProcess:
      type: object
      required:
        - id
        - kind
        - uptimeMs
      properties:
        id:
          type: string
          example: 6f1d2c3b-4a5e-4f60-8a7b-9c0d1e2f3a4b
        sessionId:
          type: string
          description: The session it belongs to, if any.
          example: 8f14e45f-ceea-467a-9b36-2f1c5d0e7a11
        udid:
          type: string
          description: The device it belongs to, if any.
          example: R5CT32ABCDE
        kind:
          type: string
          enum:
            - wda
            - ffmpeg
            - adb-reverse
            - ios-mjpeg
            - log-tailer
            - other
        pid:
          type: integer
          example: 48213
        uptimeMs:
          type: integer
          example: 734120
    PlatformSettings:
      type: object
      description: The lab's stored settings, merged with the AI settings in effect. A setting never saved is absent.
      properties:
        healthCheckIntervalMs:
          type: integer
          example: 300000
        healthCheckSchedule:
          type: string
          example: '*/5 * * * *'
        buildCleanupDays:
          type: integer
          example: 30
        buildCleanupMaxCount:
          type: integer
          example: 500
        buildCleanupSchedule:
          type: string
          example: 0 3 * * *
        deleteBuildAssets:
          type: boolean
        aiProvider:
          type: string
          example: gemini
        aiModel:
          type: string
        aiBaseUrl:
          type: string
        geminiModel:
          type: string
        openaiModel:
          type: string
        anthropicModel:
          type: string
        ollamaModel:
          type: string
        geminiSet:
          type: boolean
          description: Whether a Gemini API key is configured.
        openaiSet:
          type: boolean
          description: Whether an OpenAI API key is configured.
        anthropicSet:
          type: boolean
          description: Whether an Anthropic API key is configured.
    PlatformSettingsUpdate:
      type: object
      description: Any subset. Unknown fields are ignored.
      properties:
        healthCheckIntervalMs:
          type: integer
          example: 300000
        healthCheckSchedule:
          type: string
          description: A cron expression.
          example: '*/5 * * * *'
        buildCleanupDays:
          type: integer
          example: 30
        buildCleanupMaxCount:
          type: integer
          example: 500
        buildCleanupSchedule:
          type: string
          description: A cron expression.
          example: 0 3 * * *
        deleteBuildAssets:
          type: boolean
        aiProvider:
          type: string
          description: Not stored; until the server restarts.
          enum:
            - gemini
            - openai
            - anthropic
            - ollama
        aiModel:
          type: string
          description: Not stored; until the server restarts.
        aiBaseUrl:
          type: string
          description: Not stored; until the server restarts.
        geminiModel:
          type: string
          description: Not stored; until the server restarts.
        openaiModel:
          type: string
          description: Not stored; until the server restarts.
        anthropicModel:
          type: string
          description: Not stored; until the server restarts.
        ollamaModel:
          type: string
          description: Not stored; until the server restarts.
    PlatformAiTestRequest:
      type: object
      description: Every field is optional and falls back to the server's current setting.
      properties:
        aiProvider:
          type: string
          enum:
            - gemini
            - openai
            - anthropic
            - ollama
        aiModel:
          type: string
          example: gpt-4o
        aiBaseUrl:
          type: string
          description: For OpenAI-compatible endpoints and Ollama.
          example: http://localhost:11434
        geminiApiKey:
          type: string
          description: Used only when the server has no Gemini key of its own.
        openaiApiKey:
          type: string
          description: Used only when the server has no OpenAI key of its own.
        anthropicApiKey:
          type: string
          description: Used only when the server has no Anthropic key of its own.
    PlatformAiTestResult:
      type: object
      required:
        - success
        - message
      properties:
        success:
          type: boolean
        message:
          type: string
    PlatformWebhook:
      type: object
      properties:
        id:
          type: string
          example: 2d6f4a8e-1b3c-4d5e-9f60-7a8b9c0d1e2f
        url:
          type: string
          example: https://hooks.slack.com/services/T000/B000/XXXXXXXX
        type:
          type: string
          description: '`slack` sends a Slack message; anything else a generic JSON body.'
          example: slack
        events:
          type: string
          description: The subscribed events, as a JSON-encoded array.
          example: '["device_offline","session_failed"]'
        active:
          type: boolean
        payloadTemplate:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PlatformWebhookCreate:
      type: object
      required:
        - url
        - events
      properties:
        url:
          type: string
          format: uri
          description: Where to POST events.
        events:
          type: array
          description: The events to send.
          items:
            type: string
            enum:
              - device_offline
              - session_failed
              - device_new
              - selector_health_digest
        type:
          type: string
          description: '`slack` for a Slack message, anything else for `{ event, payload }`.'
          default: slack
          example: slack
        payloadTemplate:
          type: string
          description: A body template with `{{key}}` placeholders, used in place of the default body.
          example: '{"text":"{{eventType}} on {{udid}}"}'
    PlatformApp:
      type: object
      description: An uploaded app build.
      properties:
        id:
          type: string
          example: 9adc3f2e-7b1a-4c6d-8e9f-0a1b2c3d4e5f
        name:
          type: string
          example: checkout-2.4.1.apk
        filename:
          type: string
          example: checkout-2.4.1.apk
        filepath:
          type: string
          description: Where the file is stored on the server.
        mimetype:
          type: string
          example: application/vnd.android.package-archive
        size:
          type: integer
          description: Bytes.
          example: 48213377
        packageName:
          type: string
          nullable: true
          description: Read from an `.apk`; null for other files.
          example: com.example.checkout
        version:
          type: string
          nullable: true
          example: 2.4.1
        platform:
          type: string
          nullable: true
          enum:
            - android
            - ios
        md5:
          type: string
          nullable: true
          example: 5f4dcc3b5aa765d61d8327deb882cf99
        teamId:
          type: string
          nullable: true
          description: The team whose members see it; null is the shared pool.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PlatformAppWithTeam:
      allOf:
        - $ref: '#/components/schemas/PlatformApp'
        - type: object
          properties:
            team:
              type: object
              nullable: true
              properties:
                id:
                  type: string
                name:
                  type: string
    RecordingStarted:
      type: object
      required:
        - id
        - udid
        - status
      properties:
        id:
          type: string
          description: The phone's recording id.
          example: 8f14e45f-ceea-467a-9b36-2f1c5d0e7a11
        udid:
          type: string
          example: R5CT32ABCDE
        status:
          type: string
          enum:
            - RECORDING
    RecordingStopped:
      type: object
      required:
        - id
        - udid
        - status
      properties:
        id:
          type: string
        udid:
          type: string
        status:
          type: string
          description: >-
            `RECORDING` only for a phone whose stream was ending at the moment of the stop (its
            video is being finished separately).
          enum:
            - STOPPED
            - FAILED
            - RECORDING
        durationMs:
          type: integer
          description: The video's length.
        sizeBytes:
          type: integer
          description: Absent when there is no file.
    RecordingPhone:
      type: object
      description: One phone of a recording, as the library shows it.
      properties:
        recordingId:
          type: string
        udid:
          type: string
        name:
          type: string
          description: The phone's name, or its udid when unknown.
        platform:
          type: string
          nullable: true
        status:
          type: string
          enum:
            - RECORDING
            - STOPPED
            - FAILED
            - DISCARDED
        offsetMs:
          type: integer
          description: Where this phone's video starts on the group's timeline; negative if before t=0.
        durationMs:
          type: integer
          nullable: true
        failReason:
          type: string
          nullable: true
          example: source_ended
        annotationCount:
          type: integer
    RecordingSummary:
      type: object
      description: A recording group, summarized over the phones the caller can see.
      properties:
        groupId:
          type: string
        startedAt:
          type: string
          format: date-time
          description: The group's t=0, which marks and bookmarks count from.
        endedAt:
          type: string
          format: date-time
          nullable: true
        durationMs:
          type: integer
          nullable: true
          description: The timeline's length; null while recording.
        status:
          type: string
          description: '`recording` while any phone records, `failed` when every phone failed, else `done`.'
          enum:
            - recording
            - done
            - failed
        phones:
          type: array
          items:
            $ref: '#/components/schemas/RecordingPhone'
        startedBy:
          type: object
          nullable: true
          properties:
            id:
              type: string
            name:
              type: string
        bookmarkCount:
          type: integer
        annotationCount:
          type: integer
        keptUntil:
          type: string
          format: date-time
          description: When the retention sweep removes it.
        sizeBytes:
          type: integer
        hasComposite:
          type: boolean
          description: Whether `composite.mp4` would serve this caller.
    RecordingLibraryPage:
      type: object
      properties:
        recordings:
          type: array
          items:
            $ref: '#/components/schemas/RecordingSummary'
        nextCursor:
          type: string
          nullable: true
          description: Pass as `cursor` for the next page; null on the last.
        total:
          type: integer
          description: Recordings matching the filters, across all pages.
        facets:
          type: object
          description: Counts over every recording the caller can see, before the filters.
          properties:
            phones:
              type: array
              items:
                type: object
                properties:
                  udid:
                    type: string
                  name:
                    type: string
                  count:
                    type: integer
            people:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  count:
                    type: integer
            unknownCount:
              type: integer
              description: Recordings with no recorded starter.
            when:
              type: object
              properties:
                any:
                  type: integer
                24h:
                  type: integer
                7d:
                  type: integer
                30d:
                  type: integer
        retention:
          type: object
          properties:
            days:
              type: integer
              description: Days a recording is kept.
            maxCount:
              type: integer
              description: Recordings kept at most.
    RecordingBookmarkRow:
      type: object
      description: A bookmark as stored.
      properties:
        id:
          type: string
        recording_id:
          type: string
        timecode_ms:
          type: integer
        label:
          type: string
        note:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
    RecordingAnnotationRow:
      type: object
      description: A mark as stored.
      properties:
        id:
          type: string
        recording_id:
          type: string
        timecode_ms:
          type: integer
        end_timecode_ms:
          type: integer
          nullable: true
          description: When it was cleared; null while on screen.
        shape:
          type: string
        geometry:
          type: string
        color:
          type: string
        text:
          type: string
          nullable: true
        author:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
    RecordingRow:
      type: object
      description: One phone's recording as stored.
      properties:
        id:
          type: string
        group_id:
          type: string
        device_udid:
          type: string
        device_host:
          type: string
        session_id:
          type: string
          nullable: true
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum:
            - RECORDING
            - STOPPED
            - FAILED
            - DISCARDED
        file_path:
          type: string
          description: Where the video is stored on the server.
        duration_ms:
          type: integer
          nullable: true
        size_bytes:
          type: integer
          nullable: true
        device_snapshot:
          type: string
          nullable: true
        fail_reason:
          type: string
          nullable: true
        started_by:
          type: string
          nullable: true
          description: The user who started it.
        bookmarks:
          type: array
          items:
            $ref: '#/components/schemas/RecordingBookmarkRow'
        annotations:
          type: array
          items:
            $ref: '#/components/schemas/RecordingAnnotationRow'
    RecordingBookmarkView:
      type: object
      properties:
        id:
          type: string
        recordingId:
          type: string
        timecodeMs:
          type: integer
        label:
          type: string
        note:
          type: string
          nullable: true
    RecordingAnnotationView:
      type: object
      properties:
        id:
          type: string
        recordingId:
          type: string
        timecodeMs:
          type: integer
        endTimecodeMs:
          type: integer
          nullable: true
        shape:
          type: string
        geometry:
          type: string
        color:
          type: string
        text:
          type: string
          nullable: true
    RecordingActiveGroup:
      type: object
      properties:
        groupId:
          type: string
        startedAt:
          type: string
          format: date-time
          description: The group's t=0.
        recordings:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              udid:
                type: string
        annotations:
          type: array
          description: Marks still on screen.
          items:
            type: object
            properties:
              recordingId:
                type: string
              shape:
                type: string
              geometry:
                type: string
              color:
                type: string
              text:
                type: string
                nullable: true
              timecodeMs:
                type: integer
        compositeEnabled:
          type: boolean
          description: Whether `composite.mp4` would serve this caller.
