# Control: drive one device.
# Every route here sits behind the /control guards, in this order: role MEMBER,
# the devices scope on mutations, the team guard (a hidden device answers as
# unknown), the ownership guard (409), and on a hub the node-phone gate.
paths:
  /api/control/{udid}/tap:
    post:
      tags:
        - Control
      parameters:
        - $ref: '#/components/parameters/ControlUdid'
      operationId: tapDevice
      summary: Tap the screen
      description: >-
        Taps the device screen once at (`x`, `y`), in the device's screen points (the `screenWidth`
        × `screenHeight` the device list reports). Android taps through `adb shell input tap`; iOS
        through WebDriverAgent.


        Needs the `MEMBER` role and the `devices` scope. Refused with `409` while another user holds
        the device (their live preview or recording) or runs an Appium session on it; admins are
        exempt, and your own Appium session on it stays controllable.


        On a hub, for a node's phone, the request is sent on to that node once (never retried),
        signed for you, and the node's answer is relayed unchanged. A cloud provider's phone answers
        `501`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ControlPoint'
            example:
              x: 196
              'y': 420
      responses:
        '200':
          description: Tapped.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
              example:
                success: true
        '400':
          description: This server can't do this on the device's platform, or the udid is malformed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidUdid:
                  summary: The udid segment is not valid percent-encoding
                  value:
                    success: false
                    error: invalid_udid
                notSupported:
                  summary: No device manager for the platform, or it can't do this
                  value:
                    error: not_supported
                    message: Manager not found or tap not supported
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ControlForbiddenMutation'
        '404':
          $ref: '#/components/responses/ControlDeviceNotFound'
        '409':
          $ref: '#/components/responses/ControlHeld'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          description: The tap failed on the device.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: 'Command failed: adb -s R5CT32ABCDE shell input tap 196 420'
        '501':
          $ref: '#/components/responses/ControlCloudPhone'
        '502':
          $ref: '#/components/responses/ControlNodeUnreachable'
        '503':
          $ref: '#/components/responses/ControlOwnershipUnavailable'
        '504':
          $ref: '#/components/responses/ControlNodeTimeout'
  /api/control/{udid}/swipe:
    post:
      tags:
        - Control
      parameters:
        - $ref: '#/components/parameters/ControlUdid'
      operationId: swipeDevice
      summary: Swipe across the screen
      description: >-
        Swipes from (`x`, `y`) to (`endX`, `endY`) over `duration` milliseconds, in screen points.


        Needs the `MEMBER` role and the `devices` scope. Refused with `409` while another user holds
        the device (their live preview or recording) or runs an Appium session on it; admins are
        exempt, and your own Appium session on it stays controllable.


        On a hub, for a node's phone, the request is sent on to that node once (never retried),
        signed for you, and the node's answer is relayed unchanged. A cloud provider's phone answers
        `501`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ControlSwipeRequest'
            example:
              x: 196
              'y': 700
              endX: 196
              endY: 200
              duration: 300
      responses:
        '200':
          description: Swiped.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
              example:
                success: true
        '400':
          description: This server can't do this on the device's platform, or the udid is malformed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidUdid:
                  summary: The udid segment is not valid percent-encoding
                  value:
                    success: false
                    error: invalid_udid
                notSupported:
                  summary: No device manager for the platform, or it can't do this
                  value:
                    error: not_supported
                    message: Manager not found or swipe not supported
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ControlForbiddenMutation'
        '404':
          $ref: '#/components/responses/ControlDeviceNotFound'
        '409':
          $ref: '#/components/responses/ControlHeld'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          description: The swipe failed on the device.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: 'WDA request failed: socket hang up'
        '501':
          $ref: '#/components/responses/ControlCloudPhone'
        '502':
          $ref: '#/components/responses/ControlNodeUnreachable'
        '503':
          $ref: '#/components/responses/ControlOwnershipUnavailable'
        '504':
          $ref: '#/components/responses/ControlNodeTimeout'
  /api/control/{udid}/touchAndHold:
    post:
      tags:
        - Control
      parameters:
        - $ref: '#/components/parameters/ControlUdid'
      operationId: touchAndHoldDevice
      summary: Touch and hold a point
      description: >-
        Presses (`x`, `y`) for `duration` milliseconds (a long press). On Android it is a
        zero-length swipe through `adb`.


        Needs the `MEMBER` role and the `devices` scope. Refused with `409` while another user holds
        the device (their live preview or recording) or runs an Appium session on it; admins are
        exempt, and your own Appium session on it stays controllable.


        On a hub, for a node's phone, the request is sent on to that node once (never retried),
        signed for you, and the node's answer is relayed unchanged. A cloud provider's phone answers
        `501`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ControlTouchAndHoldRequest'
            example:
              x: 196
              'y': 420
              duration: 1500
      responses:
        '200':
          description: Held and released.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
              example:
                success: true
        '400':
          description: This server can't do this on the device's platform, or the udid is malformed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidUdid:
                  summary: The udid segment is not valid percent-encoding
                  value:
                    success: false
                    error: invalid_udid
                notSupported:
                  summary: No device manager for the platform, or it can't do this
                  value:
                    error: not_supported
                    message: Manager not found or touchAndHold not supported
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ControlForbiddenMutation'
        '404':
          $ref: '#/components/responses/ControlDeviceNotFound'
        '409':
          $ref: '#/components/responses/ControlHeld'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          description: The long press failed on the device.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: 'WDA request failed: socket hang up'
        '501':
          $ref: '#/components/responses/ControlCloudPhone'
        '502':
          $ref: '#/components/responses/ControlNodeUnreachable'
        '503':
          $ref: '#/components/responses/ControlOwnershipUnavailable'
        '504':
          $ref: '#/components/responses/ControlNodeTimeout'
  /api/control/{udid}/text:
    post:
      tags:
        - Control
      parameters:
        - $ref: '#/components/parameters/ControlUdid'
      operationId: typeTextOnDevice
      summary: Type text into the focused field
      description: >-
        Types `text` into whatever has focus on the device. Android sends it through `adb shell
        input text` (spaces become `%s`), so characters the shell or `input` treat specially may not
        arrive as typed; iOS types through WebDriverAgent.


        Needs the `MEMBER` role and the `devices` scope. Refused with `409` while another user holds
        the device (their live preview or recording) or runs an Appium session on it; admins are
        exempt, and your own Appium session on it stays controllable.


        On a hub, for a node's phone, the request is sent on to that node once (never retried),
        signed for you, and the node's answer is relayed unchanged. A cloud provider's phone answers
        `501`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ControlTextRequest'
            example:
              text: qa.user@example.com
      responses:
        '200':
          description: Typed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
              example:
                success: true
        '400':
          description: This server can't do this on the device's platform, or the udid is malformed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidUdid:
                  summary: The udid segment is not valid percent-encoding
                  value:
                    success: false
                    error: invalid_udid
                notSupported:
                  summary: No device manager for the platform, or it can't do this
                  value:
                    error: not_supported
                    message: Manager not found or typeText not supported
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ControlForbiddenMutation'
        '404':
          $ref: '#/components/responses/ControlDeviceNotFound'
        '409':
          $ref: '#/components/responses/ControlHeld'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          description: Typing failed on the device.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: 'Command failed: adb -s R5CT32ABCDE shell input text qa.user@example.com'
        '501':
          $ref: '#/components/responses/ControlCloudPhone'
        '502':
          $ref: '#/components/responses/ControlNodeUnreachable'
        '503':
          $ref: '#/components/responses/ControlOwnershipUnavailable'
        '504':
          $ref: '#/components/responses/ControlNodeTimeout'
  /api/control/{udid}/keyevent:
    post:
      tags:
        - Control
      parameters:
        - $ref: '#/components/parameters/ControlUdid'
      operationId: pressDeviceKey
      summary: Press a key or hardware button
      description: >-
        Presses one key.

        - **Android:** `keyCode` is an Android key code, passed to `adb shell input keyevent` as
        given: a number (`4` Back, `3` Home, `66` Enter, `67` Backspace) or a name such as
        `KEYCODE_BACK`.

        - **iOS:** `keyCode` is a name, case-insensitive. `home` (or `3`), `volumeUp`/`volume_up`
        and `volumeDown`/`volume_down` press hardware buttons; `enter`, `backspace`, `delete`, `tab`
        and `escape` type that key. Anything else is tried as a WebDriverAgent button name; one
        the iPhone doesn't have answers `400 unsupported_key`. A hardware button or keyboard key
        whose WebDriverAgent call fails (after the fallback: `/wda/homescreen` for `home`,
        `/wda/type` for a keyboard key) answers `500`, and so does any key while WebDriverAgent
        can't be reached.

        Needs the `MEMBER` role and the `devices` scope. Refused with `409` while another user holds
        the device (their live preview or recording) or runs an Appium session on it; admins are
        exempt, and your own Appium session on it stays controllable.

        On a hub, for a node's phone, the request is sent on to that node once (never retried),
        signed for you, and the node's answer is relayed unchanged. A cloud provider's phone answers
        `501`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ControlKeyEventRequest'
            example:
              keyCode: 4
      responses:
        '200':
          description: Pressed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
              example:
                success: true
        '400':
          description: >-
            On iOS, a key the iPhone has no equivalent for; this server can't do this on the
            device's platform; or the udid is malformed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidUdid:
                  summary: The udid segment is not valid percent-encoding
                  value:
                    success: false
                    error: invalid_udid
                unsupportedKey:
                  summary: A key the iPhone has no equivalent for (iOS)
                  value:
                    error: unsupported_key
                    message: The key "f13" isn't available on an iPhone.
                notSupported:
                  summary: No device manager for the platform, or it can't do this
                  value:
                    error: not_supported
                    message: Manager not found or pressKey not supported
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ControlForbiddenMutation'
        '404':
          $ref: '#/components/responses/ControlDeviceNotFound'
        '409':
          $ref: '#/components/responses/ControlHeld'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          description: >-
            The key press failed on the device (on iOS, a hardware button or keyboard key whose
            WebDriverAgent call and fallback both failed, or WebDriverAgent couldn't be reached).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                android:
                  summary: Android
                  value:
                    error: 'Command failed: adb -s R5CT32ABCDE shell input keyevent 4'
                ios:
                  summary: iOS
                  value:
                    error: 'WDA request failed: socket hang up'
        '501':
          $ref: '#/components/responses/ControlCloudPhone'
        '502':
          $ref: '#/components/responses/ControlNodeUnreachable'
        '503':
          $ref: '#/components/responses/ControlOwnershipUnavailable'
        '504':
          $ref: '#/components/responses/ControlNodeTimeout'
  /api/control/{udid}/lock:
    post:
      tags:
        - Control
      parameters:
        - $ref: '#/components/parameters/ControlUdid'
      operationId: lockDevice
      summary: Lock the screen
      description: >-
        Locks the device. Android presses the power key (key code 26), which locks a lit screen and
        wakes a dark one. iOS locks through WebDriverAgent, and a WebDriverAgent failure answers
        `500`.


        Needs the `MEMBER` role and the `devices` scope. Refused with `409` while another user holds
        the device (their live preview or recording) or runs an Appium session on it; admins are
        exempt, and your own Appium session on it stays controllable.


        On a hub, for a node's phone, the request is sent on to that node once (never retried),
        signed for you, and the node's answer is relayed unchanged. A cloud provider's phone answers
        `501`.
      responses:
        '200':
          description: Locked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
              example:
                success: true
        '400':
          description: This server can't do this on the device's platform, or the udid is malformed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidUdid:
                  summary: The udid segment is not valid percent-encoding
                  value:
                    success: false
                    error: invalid_udid
                notSupported:
                  summary: No device manager for the platform, or it can't do this
                  value:
                    error: not_supported
                    message: Manager not found or lock not supported
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ControlForbiddenMutation'
        '404':
          $ref: '#/components/responses/ControlDeviceNotFound'
        '409':
          $ref: '#/components/responses/ControlHeld'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          description: Locking failed on the device (on iOS, WebDriverAgent refused or didn't answer).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                android:
                  summary: Android
                  value:
                    error: ADB is not available
                ios:
                  summary: iOS
                  value:
                    error: 'WDA request failed: socket hang up'
        '501':
          $ref: '#/components/responses/ControlCloudPhone'
        '502':
          $ref: '#/components/responses/ControlNodeUnreachable'
        '503':
          $ref: '#/components/responses/ControlOwnershipUnavailable'
        '504':
          $ref: '#/components/responses/ControlNodeTimeout'
  /api/control/{udid}/unlock:
    post:
      tags:
        - Control
      parameters:
        - $ref: '#/components/parameters/ControlUdid'
      operationId: unlockDevice
      summary: Wake and unlock the screen
      description: >-
        Wakes the device and dismisses a lock screen without a passcode. Android sends WAKEUP (224)
        then MENU (82); iOS unlocks through WebDriverAgent, and a WebDriverAgent failure answers
        `500`. A passcode is never entered.


        Needs the `MEMBER` role and the `devices` scope. Refused with `409` while another user holds
        the device (their live preview or recording) or runs an Appium session on it; admins are
        exempt, and your own Appium session on it stays controllable.


        On a hub, for a node's phone, the request is sent on to that node once (never retried),
        signed for you, and the node's answer is relayed unchanged. A cloud provider's phone answers
        `501`.
      responses:
        '200':
          description: Woken and unlocked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
              example:
                success: true
        '400':
          description: This server can't do this on the device's platform, or the udid is malformed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidUdid:
                  summary: The udid segment is not valid percent-encoding
                  value:
                    success: false
                    error: invalid_udid
                notSupported:
                  summary: No device manager for the platform, or it can't do this
                  value:
                    error: not_supported
                    message: Manager not found or unlock not supported
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ControlForbiddenMutation'
        '404':
          $ref: '#/components/responses/ControlDeviceNotFound'
        '409':
          $ref: '#/components/responses/ControlHeld'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          description: Unlocking failed on the device (on iOS, WebDriverAgent refused or didn't answer).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                android:
                  summary: Android
                  value:
                    error: ADB is not available
                ios:
                  summary: iOS
                  value:
                    error: 'WDA request failed: socket hang up'
        '501':
          $ref: '#/components/responses/ControlCloudPhone'
        '502':
          $ref: '#/components/responses/ControlNodeUnreachable'
        '503':
          $ref: '#/components/responses/ControlOwnershipUnavailable'
        '504':
          $ref: '#/components/responses/ControlNodeTimeout'
  /api/control/{udid}/screenshot:
    get:
      tags:
        - Control
      parameters:
        - $ref: '#/components/parameters/ControlUdid'
      operationId: getDeviceScreenshot
      summary: Take a screenshot
      description: >-
        Captures the screen as base64. Android reuses the latest frame of a running MJPEG preview
        when there is one (a JPEG), else runs `screencap` (a PNG). iOS uses go-ios (opening the
        phone's tunnel on iOS 17+ if needed), then WebDriverAgent (PNG).


        Open to watchers: a busy device can be read by anyone who can see it. Needs the `MEMBER`
        role; any scope will do.


        On a hub, for a node's phone, the request is sent on to that node once (never retried),
        signed for you, and the node's answer is relayed unchanged. A cloud provider's phone answers
        `501`.
      responses:
        '200':
          description: The screenshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlScreenshot'
              example:
                screenshot: iVBORw0KGgoAAAANSUhEUgAABkAAAAzQCAYAAAB...
        '400':
          description: This server can't do this on the device's platform, or the udid is malformed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidUdid:
                  summary: The udid segment is not valid percent-encoding
                  value:
                    success: false
                    error: invalid_udid
                notSupported:
                  summary: No device manager for the platform, or it can't do this
                  value:
                    error: not_supported
                    message: Manager not found or screenshot not supported
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ControlForbiddenRead'
        '404':
          $ref: '#/components/responses/ControlDeviceNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '501':
          $ref: '#/components/responses/ControlCloudPhone'
        '502':
          description: >-
            The device didn't give a usable image, or, on a hub, the phone's node couldn't be
            reached (`node_unreachable`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                captureFailed:
                  summary: No usable image
                  value:
                    error: >-
                      Screenshot capture failed. Device may be busy or WDA is unresponsive. Try
                      again.
                nodeUnreachable:
                  summary: The node can't be reached
                  value:
                    success: false
                    error: node_unreachable
                    message: 'Xenon could not reach node http://10.0.4.21:4723 for this phone: ECONNREFUSED'
        '503':
          $ref: '#/components/responses/ControlOwnershipUnavailable'
        '504':
          $ref: '#/components/responses/ControlNodeTimeout'
  /api/control/{udid}/display:
    get:
      tags:
        - Control
      parameters:
        - $ref: '#/components/parameters/ControlUdid'
      operationId: getDeviceDisplayState
      summary: Tell whether the screen is lit
      description: >-
        Says whether the panel is on, so a black preview can be told apart from a sleeping device.
        Android reads `dumpsys power` (cached for 2 seconds per device); platforms with no reader,
        iOS included, answer `unknown`. Never fails on the device side: an unreadable device is
        `unknown`.


        Open to watchers. Needs the `MEMBER` role; any scope will do.


        On a hub, for a node's phone, the request is sent on to that node once (never retried),
        signed for you, and the node's answer is relayed unchanged. A cloud provider's phone answers
        `501`.
      responses:
        '200':
          description: The display state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlDisplayState'
              example:
                state: 'off'
        '400':
          description: The udid is malformed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidUdid:
                  summary: The udid segment is not valid percent-encoding
                  value:
                    success: false
                    error: invalid_udid
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ControlForbiddenRead'
        '404':
          $ref: '#/components/responses/ControlDeviceNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '501':
          $ref: '#/components/responses/ControlCloudPhone'
        '502':
          $ref: '#/components/responses/ControlNodeUnreachable'
        '503':
          $ref: '#/components/responses/ControlOwnershipUnavailable'
        '504':
          $ref: '#/components/responses/ControlNodeTimeout'
  /api/control/{udid}/clipboard:
    get:
      tags:
        - Control
      parameters:
        - $ref: '#/components/parameters/ControlUdid'
      operationId: getDeviceClipboard
      summary: Read the device's clipboard
      description: >-
        Returns the clipboard's plain text. Android reads it through the Appium Settings app, which
        it makes the input method for a moment and then restores; iOS reads it through
        WebDriverAgent (on a real iPhone WebDriverAgent is brought to the foreground first, as iOS
        requires).


        Unlike other reads this one is ownership-checked: while another user holds the device or
        runs a session on it you get `409`, since the clipboard is their work (often a password or
        code). Needs the `MEMBER` role; any scope will do.


        On a hub, for a node's phone, the request is sent on to that node once (never retried),
        signed for you, and the node's answer is relayed unchanged. A cloud provider's phone answers
        `501`.
      responses:
        '200':
          description: The clipboard text (empty when the clipboard is empty).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlClipboard'
              example:
                content: https://example.com/reset?code=4821
        '400':
          description: This server can't do this on the device's platform, or the udid is malformed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidUdid:
                  summary: The udid segment is not valid percent-encoding
                  value:
                    success: false
                    error: invalid_udid
                notSupported:
                  summary: No device manager for the platform, or it can't do this
                  value:
                    error: not_supported
