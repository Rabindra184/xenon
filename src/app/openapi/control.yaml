              examples:
                ios:
                  summary: iOS, running
                  value:
                    udid: 00008110-00084CE80E51401E
                    status: running
                    type: mjpeg
                    wdaPort: 8101
                    mjpegPort: 9101
                    startedAt: 1759586400123
                h264:
                  summary: Android, H.264
                  value:
                    udid: R5CT32ABCDE
                    status: running
                    type: h264
                    h264Path: /xenon/api/control/R5CT32ABCDE/stream/h264
                    mjpegPort: null
                stopped:
                  summary: No preview
                  value:
                    udid: R5CT32ABCDE
                    status: stopped
                    type: mjpeg
        '400':
          description: The udid is malformed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidUdid:
                  summary: The udid segment is not valid percent-encoding
                  value:
                    success: false
                    error: invalid_udid
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ControlForbiddenRead'
        '404':
          $ref: '#/components/responses/ControlDeviceNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '501':
          $ref: '#/components/responses/ControlCloudPhone'
        '502':
          $ref: '#/components/responses/ControlNodeUnreachable'
        '503':
          $ref: '#/components/responses/ControlOwnershipUnavailable'
        '504':
          $ref: '#/components/responses/ControlNodeTimeout'
  /api/control/{udid}/stream/leave:
    post:
      tags:
        - Control
      parameters:
        - $ref: '#/components/parameters/ControlUdid'
      operationId: leaveDevicePreview
      summary: Stop watching the preview
      description: >-
        Tells the server a page stopped watching (navigated away, closed, reloaded). Nothing stops
        at once: after a 3-second grace the preview is stopped and your hold released only if nobody
        is watching it and no recording reads it. A `stream/start` within the grace (a reload)
        cancels it. Use this rather than `stream/stop` when other tabs may be watching.


        You may leave a device you hold, one with a legacy hold, or any device as an admin; another
        user's hold answers `403`.


        Needs the `MEMBER` role and the `devices` scope.


        On a hub, for a node's phone, the request is sent on to that node once (never retried),
        signed for you, and the node's answer is relayed unchanged. A cloud provider's phone answers
        `501`.
      responses:
        '202':
          description: Noted; the preview will stop after the grace if nobody is watching.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlStreamLeaveResult'
              example:
                success: true
                pending: true
        '400':
          description: The udid is malformed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidUdid:
                  summary: The udid segment is not valid percent-encoding
                  value:
                    success: false
                    error: invalid_udid
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: >-
            Another user holds the device; or the credential lacks the `devices` scope, or a browser
            request failed the same-origin check.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                held:
                  summary: Another user's hold
                  value:
                    success: false
                    error: lock_owned_by_another_user
                    message: This device is being controlled by another user.
                scope:
                  summary: No devices scope
                  value:
                    error: insufficient scope
        '404':
          $ref: '#/components/responses/ControlDeviceNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '501':
          $ref: '#/components/responses/ControlCloudPhone'
        '502':
          $ref: '#/components/responses/ControlNodeUnreachable'
        '503':
          $ref: '#/components/responses/ControlOwnershipUnavailable'
        '504':
          $ref: '#/components/responses/ControlNodeTimeout'
  /api/control/{udid}/stream/stop:
    post:
      tags:
        - Control
      parameters:
        - $ref: '#/components/parameters/ControlUdid'
      operationId: stopDevicePreview
      summary: Stop the preview and release the device
      description: >-
        Stops the device's preview on every transport at once and releases its preview hold,
        including a hold left over from a restart. Every other tab watching the device loses its
        preview too; prefer `stream/leave`. On iOS the stream is kept while an Appium session on the
        phone may be using its WebDriverAgent.


        You may stop a device you hold, one with a legacy hold, or (as an admin) any device, which
        force-releases another user's hold. Refused with `409 device_recording` while the device is
        being recorded: stop the recording instead (`POST /api/recordings/{groupId}/stop`).


        Needs the `MEMBER` role and the `devices` scope.


        On a hub, for a node's phone, the request is sent on to that node once (never retried),
        signed for you, and the node's answer is relayed unchanged. A cloud provider's phone answers
        `501`. The hub also refuses with `409 device_recording` while it records the node's phone.
      responses:
        '200':
          description: Stopped.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
              example:
                success: true
        '400':
          description: The udid is malformed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidUdid:
                  summary: The udid segment is not valid percent-encoding
                  value:
                    success: false
                    error: invalid_udid
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: >-
            Another user holds the device and you aren't an admin; or the credential lacks the
            `devices` scope, or a browser request failed the same-origin check.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                held:
                  summary: Another user's hold
                  value:
                    success: false
                    error: lock_owned_by_another_user
                    message: >-
                      This device is being controlled by another user. Ask them to stop, or use an
                      admin key to force-release.
                scope:
                  summary: No devices scope
                  value:
                    error: insufficient scope
        '404':
          $ref: '#/components/responses/ControlDeviceNotFound'
        '409':
          description: The device is being recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                success: false
                error: device_recording
                message: This device is being recorded. Stop the recording first.
                groupId: 7d2e9b4a-5c1f-4e8b-a3d6-0f9c2b7e1a54
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          description: Stopping failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                success: false
                error: kill ESRCH
        '501':
          $ref: '#/components/responses/ControlCloudPhone'
        '502':
          $ref: '#/components/responses/ControlNodeUnreachable'
        '503':
          $ref: '#/components/responses/ControlOwnershipUnavailable'
        '504':
          $ref: '#/components/responses/ControlNodeTimeout'
components:
  parameters:
    ControlUdid:
      in: path
      name: udid
      required: true
      schema:
        type: string
      description: The device udid (URL-encoded).
      example: 00008110-00084CE80E51401E
  securitySchemes:
    ControlStreamTicket:
      type: apiKey
      in: query
      name: ticket
      description: >-
        A single-use, 60-second ticket from `POST /api/control/{udid}/stream/ticket`. Accepted only
        by `GET /api/control/{udid}/stream` (and the preview and logcat WebSockets) for the device
        it was minted for.
  responses:
    ControlDeviceNotFound:
      description: No such device, or it is outside your teams (the two answer the same).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: not_found
            message: Device not found
    ControlForbiddenMutation:
      description: >-
        The credential lacks the `devices` scope or the `MEMBER` role, or a request with the
        dashboard cookie failed the same-origin check.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            scope:
              summary: No devices scope
              value:
                error: insufficient scope
            role:
              summary: Role below MEMBER
              value:
                error: requires role >= MEMBER
            csrf:
              summary: Cross-site browser request
              value:
                error: 'CSRF: Origin/Referer mismatch'
    ControlForbiddenRead:
      description: The caller's role is below `MEMBER`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: requires role >= MEMBER
    ControlHeld:
      description: >-
        Another user holds the device (their preview or recording), or it runs another user's Appium
        session. Admins are never refused. On a hub, a node's refusal is relayed with the holder's
        name filled in.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ControlDenied'
          examples:
            held:
              summary: Another user's preview or recording
              value:
                success: false
                error: device_held_by_another_user
                message: >-
                  Device is being controlled by Priya Raman. Ask them to release it, or use an admin
                  key to force-release.
                holder:
                  userId: c7a1e5d2-3f4b-4a9e-8c21-5b6d7e8f9a01
                  name: Priya Raman
            session:
              summary: Another user's Appium session
              value:
                success: false
                error: device_in_use_by_session
                message: Device is in use by an Appium session owned by Priya Raman.
                holder:
                  userId: c7a1e5d2-3f4b-4a9e-8c21-5b6d7e8f9a01
                  name: Priya Raman
    ControlOwnershipUnavailable:
      description: >-
        The device or its session's owner couldn't be looked up, so access couldn't be checked.
        Never treated as allowed; try again.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            error: device_ownership_unavailable
            message: Could not verify device ownership. Try again.
    ControlCloudPhone:
      description: 'On a hub: the phone is a cloud provider''s, and device control isn''t available for it.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            error: not_available_for_cloud_phone
            message: This phone is a cloud provider's. Device control isn't available for it here.
    ControlNodeUnreachable:
      description: 'On a hub: the phone''s node couldn''t be reached.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            error: node_unreachable
            message: 'Xenon could not reach node http://10.0.4.21:4723 for this phone: ECONNREFUSED'
    ControlNodeTimeout:
      description: 'On a hub: the phone''s node didn''t start answering in time (60 s; 15 minutes for an install).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            error: node_timeout
            message: Node http://10.0.4.21:4723 didn't answer within 60 s.
  schemas:
    ControlPoint:
      type: object
      required:
        - x
        - 'y'
      properties:
        x:
          type: number
          description: Horizontal position in screen points.
          example: 196
        'y':
          type: number
          description: Vertical position in screen points.
          example: 420
    ControlSwipeRequest:
      type: object
      required:
        - x
        - 'y'
        - endX
        - endY
      properties:
        x:
          type: number
          description: Start, horizontal.
          example: 196
        'y':
          type: number
          description: Start, vertical.
          example: 700
        endX:
          type: number
          description: End, horizontal.
          example: 196
        endY:
          type: number
          description: End, vertical.
          example: 200
        duration:
          type: number
          default: 1000
          description: Milliseconds.
          example: 300
    ControlTouchAndHoldRequest:
      type: object
      required:
        - x
        - 'y'
      properties:
        x:
          type: number
          description: Horizontal position in screen points.
          example: 196
        'y':
          type: number
          description: Vertical position in screen points.
          example: 420
        duration:
          type: number
          default: 1000
          description: How long to hold, in milliseconds.
          example: 1500
    ControlTextRequest:
      type: object
      required:
        - text
      properties:
        text:
          type: string
          example: qa.user@example.com
    ControlKeyEventRequest:
      type: object
      required:
        - keyCode
      properties:
        keyCode:
          oneOf:
            - type: integer
            - type: string
          description: >-
            Android: a key code number or `KEYCODE_…` name. iOS: a key or button name (`home`,
            `volumeUp`, `enter`, `backspace`…).
          example: 4
    ControlScreenshot:
      type: object
      properties:
        screenshot:
          type: string
          format: byte
          description: The image, base64 (PNG, or JPEG from a running Android preview).
    ControlDisplayState:
      type: object
      properties:
        state:
          type: string
          enum:
            - 'on'
            - 'off'
            - doze
            - unknown
          description: '`doze` is an always-on display; `unknown` means it could not be read.'
    ControlClipboard:
      type: object
      required:
        - content
      properties:
        content:
          type: string
          example: https://example.com/reset?code=4821
    ControlInstallPathRequest:
      type: object
      required:
        - appPath
      properties:
        appPath:
          type: string
          description: A path on this server's file system.
          example: /opt/builds/shop-2.14.0-debug.apk
    ControlInstallLibraryAppRequest:
      type: object
      required:
        - appId
      properties:
        appId:
          type: string
          description: The app's id in the app library.
          example: b3c1f0e2-6a8d-4b6e-9a51-2f7d0c9e4a13
    ControlUploadInstallRequest:
      type: object
      required:
        - app
      properties:
        app:
          type: string
          format: binary
          description: >-
            The app: `.apk` for Android, `.ipa` or zipped `.app` for iOS. At most 4 GiB. The file
            name's extension is kept.
    ControlInstallResult:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Installed Shop
    ControlUninstallRequest:
      type: object
      required:
        - bundleId
      properties:
        bundleId:
          type: string
          description: Package name (Android) or bundle id (iOS).
          example: com.example.shop
    ControlLogs:
      type: object
      properties:
        logs:
          type: string
    ControlShellRequest:
      type: object
      required:
        - command
      properties:
        command:
          type: string
          description: One allowlisted command (see the description).
          example: dumpsys battery
    ControlShellResult:
      type: object
      description: Exactly one of `output` and `error`.
      properties:
        output:
          type: string
        error:
          type: string
          description: Why the command was refused or failed.
    ControlStatusError:
      type: object
      properties:
        status:
          type: string
          enum:
            - error
        message:
          type: string
          example: OCR worker failed to start
    ControlRect:
      type: object
      properties:
        x:
          type: number
          example: 142
        'y':
          type: number
          example: 210
        width:
          type: number
          example: 46
        height:
          type: number
          example: 26
    ControlInspectorNode:
      type: object
      description: One element of the UI tree.
      properties:
        name:
          type: string
          example: Sign in
        type:
          type: string
          example: XCUIElementTypeButton
        text:
          type: string
        label:
          type: string
        value:
          type: string
        enabled:
          type: boolean
        visible:
          type: boolean
        rect:
          $ref: '#/components/schemas/ControlRect'
        xpath:
          type: string
          example: //XCUIElementTypeButton[@name="Sign in"]
        suggestedLocators:
          type: array
          items:
            type: object
            properties:
              strategy:
                type: string
                example: accessibility id
              value:
                type: string
                example: Sign in
              unique:
                type: boolean
                example: true
              score:
                type: integer
                minimum: 0
                maximum: 100
                description: Robustness, 0 to 100.
                example: 95
        suggestedActions:
          type: array
          items:
            type: object
            properties:
              action:
                type: string
                example: click
              snippet:
                type: string
                example: await driver.$('~Sign in').click();
              description:
                type: string
                example: Tap the button
        children:
          type: array
          items:
            $ref: '#/components/schemas/ControlInspectorNode'
        attributes:
          type: object
          additionalProperties: true
    ControlInspectorSnapshot:
      type: object
      properties:
        udid:
          type: string
          example: 00008110-00084CE80E51401E
        platform:
          type: string
          example: ios
        timestamp:
          type: string
          format: date-time
          example: '2026-10-04T14:05:22.118Z'
        screenshot:
          type: string
          format: byte
          description: The screenshot, base64.
        hierarchy:
          $ref: '#/components/schemas/ControlInspectorNode'
        hierarchySource:
          type: string
          enum:
            - appium-session
            - device
          description: '`appium-session` when the tree is a running session''s page source.'
        sessionId:
          type: string
          nullable: true
          description: The session the tree came from; null when read from the device.
          example: null
        metadata:
          type: object
          properties:
            screenWidth:
              type: integer
              example: 393
            screenHeight:
              type: integer
              example: 852
    ControlOmniScanResult:
      type: object
      properties:
        status:
          type: string
          enum:
            - success
        value:
          type: object
          description: The analysis.
          properties:
            timestamp:
              type: string
              format: date-time
            ocr:
              type: object
              properties:
                text:
                  type: string
                words:
                  type: array
                  items:
                    type: object
                    properties:
                      text:
                        type: string
                      confidence:
                        type: number
                        description: 0 to 100.
                      bbox:
                        type: object
                        properties:
                          x0:
                            type: number
                          y0:
                            type: number
                          x1:
                            type: number
                          y1:
                            type: number
            ai_insights:
              type: object
              nullable: true
              additionalProperties: true
              description: The AI provider's analysis; null if it was skipped or failed.
    ControlTestLocatorRequest:
      type: object
      required:
        - strategy
        - selector
      properties:
        strategy:
          type: string
          enum:
            - '-custom:ai-text'
            - '-custom:ai-icon'
          example: '-custom:ai-text'
        selector:
          type: string
          description: The text to find, or a description of the icon.
          example: Sign in
    ControlTestLocatorResult:
      type: object
      properties:
        status:
          type: string
          enum:
            - success
        value:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                description: A virtual element id.
                example: omni_ocr_1759586722118_k3j9x
              text:
                type: string
                description: The matched word (`ai-text` only).
              rect:
                $ref: '#/components/schemas/ControlRect'
              confidence:
                type: number
                description: 0 to 1.
                example: 0.962
    ControlAppiumSession:
      type: object
      properties:
        status:
          type: string
          enum:
            - success
        sessionId:
          type: string
          nullable: true
          description: The Appium session driving the device; null when none is.
        basePath:
          type: string
          description: This server's WebDriver base path (`''` for the root).
          example: /wd/hub
    ControlStreamStartResult:
      type: object
      properties:
        success:
          type: boolean
          example: true
        type:
          type: string
          enum:
            - mjpeg
            - h264
        mjpegPort:
          type: integer
          description: 'MJPEG only: the local capture port.'
          example: 9101
        streamUrl:
          type: string
          description: 'MJPEG only: where to watch.'
          example: /xenon/api/control/00008110-00084CE80E51401E/stream
        h264Path:
          type: string
          description: 'H.264 only: the WebSocket path (open it with a ticket).'
          example: /xenon/api/control/R5CT32ABCDE/stream/h264
    ControlStreamTicket:
      type: object
      properties:
        ticket:
          type: string
          description: Single use, bound to this device and to you.
        expiresIn:
          type: integer
          description: Seconds.
          example: 60
    ControlStreamStatus:
      type: object
      properties:
        udid:
          type: string
          example: 00008110-00084CE80E51401E
        status:
          type: string
          example: running
          description: >-
            `stopped` when no preview runs; otherwise the stream's state (`starting`, `running`,
            `error`, …).
        type:
          type: string
          enum:
            - mjpeg
            - h264
          description: The transport a player should use.
        h264Path:
          type: string
          description: Android with H.264 only.
        mjpegPort:
          type: integer
          nullable: true
        wdaPort:
          type: integer
          description: iOS only.
        startedAt:
          type: integer
          description: iOS only. Epoch milliseconds.
        lastError:
          type: string
          description: iOS only.
    ControlStreamLeaveResult:
      type: object
      properties:
        success:
          type: boolean
          example: true
        pending:
          type: boolean
          example: true
    ControlDenied:
      type: object
      required:
        - error
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          enum:
            - device_held_by_another_user
            - device_in_use_by_session
        message:
          type: string
        holder:
          type: object
          description: Who holds the device, when known.
          properties:
            userId:
              type: string
            name:
              type: string
              description: The holder's name, when it could be looked up.
