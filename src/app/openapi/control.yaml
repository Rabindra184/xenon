                  summary: No device manager for the platform, or it can't do this
                  value:
                    error: not_supported
                    message: Manager not found or setClipboard not supported
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ControlForbiddenMutation'
        '404':
