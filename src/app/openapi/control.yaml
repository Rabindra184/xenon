paths:
  /api/control/{udid}/tap:
    post:
      summary: Tap on device screen
      description: Perform a tap gesture at the specified coordinates
      tags:
        - Control
      parameters:
        - in: path
          name: udid
          required: true
          schema:
            type: string
          description: Device UDID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - x
                - 'y'
              properties:
                x:
                  type: number
                  description: X coordinate
                'y':
                  type: number
                  description: Y coordinate
      responses:
        '200':
          description: Tap successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Device not found
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          description: Tap failed
  /api/control/{udid}/swipe:
    post:
      summary: Swipe on device screen
      description: Perform a swipe gesture from start to end coordinates
      tags:
        - Control
      parameters:
        - in: path
          name: udid
          required: true
          schema:
            type: string
          description: Device UDID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - x
                - 'y'
                - endX
                - endY
              properties:
                x:
                  type: number
                  description: Start X coordinate
                'y':
                  type: number
                  description: Start Y coordinate
                endX:
                  type: number
                  description: End X coordinate
                endY:
                  type: number
                  description: End Y coordinate
                duration:
                  type: number
                  default: 1000
                  description: Swipe duration in milliseconds
      responses:
        '200':
          description: Swipe successful
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Device not found
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/control/{udid}/touchAndHold:
    post:
      summary: Touch and hold on device screen
      description: Perform a long press gesture at the specified coordinates
      tags:
        - Control
      parameters:
        - in: path
          name: udid
          required: true
          schema:
            type: string
          description: Device UDID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - x
                - 'y'
              properties:
                x:
                  type: number
                  description: X coordinate
                'y':
                  type: number
                  description: Y coordinate
                duration:
                  type: number
                  default: 1000
                  description: Hold duration in milliseconds
      responses:
        '200':
          description: Touch and hold successful
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Device not found
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/control/{udid}/text:
    post:
      summary: Type text on device
      description: Enter text on the device at the current focus
      tags:
        - Control
      parameters:
        - in: path
          name: udid
          required: true
          schema:
            type: string
          description: Device UDID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - text
              properties:
                text:
                  type: string
                  description: Text to type
      responses:
        '200':
          description: Text input successful
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Device not found
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          description: Text input failed
  /api/control/{udid}/keyevent:
    post:
      summary: Send key event
      description: Send a key event (e.g., Enter, Back, Home)
      tags:
        - Control
      parameters:
        - in: path
          name: udid
          required: true
          schema:
            type: string
          description: Device UDID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - keyCode
              properties:
                keyCode:
                  type: string
                  description: Key code (e.g., "Enter", "Back", "Home", "Backspace")
      responses:
        '200':
          description: Key event sent successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Device not found
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/control/{udid}/screenshot:
    get:
      summary: Capture screenshot
      description: Capture a screenshot from the device
      tags:
        - Control
      parameters:
        - in: path
          name: udid
          required: true
          schema:
            type: string
          description: Device UDID
      responses:
        '200':
          description: Screenshot captured
          content:
            application/json:
              schema:
                type: object
                properties:
                  screenshot:
                    type: string
                    description: Base64 encoded screenshot
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Device not found
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/control/{udid}/clipboard:
    get:
      summary: Get clipboard content
      description: Get the current clipboard content from the device
      tags:
        - Control
      parameters:
        - in: path
          name: udid
          required: true
          schema:
            type: string
          description: Device UDID
      responses:
        '200':
          description: Clipboard content
          content:
            application/json:
              schema:
                type: object
                properties:
                  clipboard:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Device not found
        '429':
          $ref: '#/components/responses/RateLimited'
    post:
      summary: Set clipboard content
      description: Set the clipboard content on the device
      tags:
        - Control
      parameters:
        - in: path
          name: udid
          required: true
          schema:
            type: string
          description: Device UDID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - content
              properties:
                content:
                  type: string
                  description: Content to set to clipboard
      responses:
        '200':
          description: Clipboard set successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Device not found
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/control/{udid}/stream:
    get:
      summary: Stream device screen
      description: Get a live MJPEG stream of the device screen (no active session required)
      tags:
        - Control
      parameters:
        - in: path
          name: udid
          required: true
          schema:
            type: string
          description: Device UDID
      responses:
        '200':
          description: MJPEG stream
          content:
            multipart/x-mixed-replace:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Device not found
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/control/{udid}/stream/status:
    get:
      summary: Get stream status
      description: Check the current status of the device MJPEG stream
      tags:
        - Control
      parameters:
        - in: path
          name: udid
          required: true
          schema:
            type: string
          description: Device UDID
      responses:
        '200':
          description: Stream status information
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - running
                      - stopped
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Device not found
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/control/{udid}/stream/start:
    post:
      summary: Start device stream
      description: Initiate high-speed MJPEG streaming for a device
      tags:
        - Control
      parameters:
        - in: path
          name: udid
          required: true
          schema:
            type: string
          description: Device UDID
      responses:
        '200':
          description: Stream started successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Device not found
        '409':
          description: Device busy
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/control/{udid}/stream/stop:
    post:
      summary: Stop device stream
      description: Terminate the active MJPEG stream for a device
      tags:
        - Control
      parameters:
        - in: path
          name: udid
          required: true
          schema:
            type: string
          description: Device UDID
      responses:
        '200':
          description: Stream stopped successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Device not found
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/control/{udid}/lock:
    post:
      summary: Lock device
      description: Lock the device screen
      tags:
        - Control
      parameters:
        - in: path
          name: udid
          required: true
          schema:
            type: string
          description: Device UDID
      responses:
        '200':
          description: Device locked
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Device not found
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/control/{udid}/unlock:
    post:
      summary: Unlock device
      description: Unlock the device screen
      tags:
        - Control
      parameters:
        - in: path
          name: udid
          required: true
          schema:
            type: string
          description: Device UDID
      responses:
        '200':
          description: Device unlocked
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Device not found
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/control/{udid}/install:
    post:
      summary: Install app by path
      description: Install an application from a file path
      tags:
        - Control
      parameters:
        - in: path
          name: udid
          required: true
          schema:
            type: string
          description: Device UDID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - appPath
              properties:
                appPath:
                  type: string
                  description: Path to the app file
      responses:
        '200':
          description: App installed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Device not found
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/control/{udid}/install-repository-app:
    post:
      summary: Install app from repository
      description: Install an application from the Xenon app repository using its ID
      tags:
        - Control
      parameters:
        - in: path
          name: udid
          required: true
          schema:
            type: string
          description: Device UDID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - appId
              properties:
                appId:
                  type: string
                  description: ID of the app in the repository
      responses:
        '200':
          description: App installation initiated
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Device or app not found
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/control/{udid}/upload-install:
    post:
      summary: Upload and install app
      description: Upload an APK/IPA file and install it on the device
      tags:
        - Control
      parameters:
        - in: path
          name: udid
          required: true
          schema:
            type: string
          description: Device UDID
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - app
              properties:
                app:
                  type: string
                  format: binary
                  description: App file (APK for Android, IPA for iOS)
      responses:
        '200':
          description: App installed
        '400':
          description: No file uploaded
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Device not found
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/control/{udid}/uninstall:
    post:
      summary: Uninstall app
      description: Uninstall an application from the device
      tags:
        - Control
      parameters:
        - in: path
          name: udid
          required: true
          schema:
            type: string
          description: Device UDID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - bundleId
              properties:
                bundleId:
                  type: string
                  description: Bundle ID / Package name of the app
      responses:
        '200':
          description: App uninstalled
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Device not found
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/control/{udid}/apps:
    get:
      summary: List installed apps
      description: Get a list of installed applications on the device
      tags:
        - Control
      parameters:
        - in: path
          name: udid
          required: true
          schema:
            type: string
          description: Device UDID
      responses:
        '200':
          description: List of installed apps
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    bundleId:
                      type: string
                    name:
                      type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Device not found
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/control/{udid}/shell:
    post:
      summary: Execute shell command
      description: Execute a shell command on the device (Android only)
      tags:
        - Control
      parameters:
        - in: path
          name: udid
          required: true
          schema:
            type: string
          description: Device UDID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - command
              properties:
                command:
                  type: string
                  description: Shell command to execute
      responses:
        '200':
          description: Command output
          content:
            application/json:
              schema:
                type: object
                properties:
                  output:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Device not found
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/control/{udid}/omni-scan:
    get:
      summary: Perform Omni-Scan
      description: Perform an AI-powered visual scan of the current screen (no active session required)
      tags:
        - Control
      parameters:
        - in: path
          name: udid
          required: true
          schema:
            type: string
          description: Device UDID
      responses:
        '200':
          description: Scan results
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  value:
                    type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Device not found
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/control/{udid}/inspector/snapshot:
    get:
      summary: Get Inspector snapshot
      description: Retrieve a native-first UI inspector snapshot with locator suggestions
      tags:
        - Control
      parameters:
        - in: path
          name: udid
          required: true
          schema:
            type: string
          description: Device UDID
      responses:
        '200':
          description: Inspector snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InspectorSnapshot'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Device not found
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/control/{udid}/test-locator:
    post:
      summary: Test AI locator
      description: Test an AI-powered locator strategy (ai-text or ai-icon) against the current screen
      tags:
        - Control
      parameters:
        - in: path
          name: udid
          required: true
          schema:
            type: string
          description: Device UDID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - strategy
                - selector
              properties:
                strategy:
                  type: string
                  enum:
                    - '-custom:ai-text'
                    - '-custom:ai-icon'
                selector:
                  type: string
                  description: Visual description or text to find
      responses:
        '200':
          description: Locator match results
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  value:
                    type: array
                    items:
                      type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Device not found
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/control/{udid}/logs:
    get:
      summary: Pull recent device logs
      description: |
        Android: `adb logcat -d` style snapshot. iOS: recent syslog buffer.
        Returns plain text wrapped in a JSON `logs` field.
      tags:
        - Control
      parameters:
        - in: path
          name: udid
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Device logs
          content:
            application/json:
              schema:
                type: object
                properties:
                  logs:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Device not found
        '429':
          $ref: '#/components/responses/RateLimited'
