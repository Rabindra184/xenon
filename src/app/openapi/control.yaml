        answer is sent, whether the install worked or not. The answer comes when the install has
        finished.


        Needs the `MEMBER` role and the `devices` scope. Refused with `409` while another user holds
        the device (their live preview or recording) or runs an Appium session on it; admins are
        exempt, and your own Appium session on it stays controllable.


        On a hub, for a node's phone, the upload is streamed on to the node as it arrives, and the
        node has up to 15 minutes to start answering. A cloud provider's phone answers `501`.
