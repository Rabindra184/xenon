                    status: error
                    message: Screenshot capture returned empty data.
                ocr:
                  summary: OCR failed
                  value:
                    status: error
                    message: OCR worker failed to start
        '501':
          $ref: '#/components/responses/ControlCloudPhone'
        '503':
          $ref: '#/components/responses/ControlOwnershipUnavailable'
  /api/control/{udid}/test-locator:
    post:
      tags:
        - Control
      parameters:
        - $ref: '#/components/parameters/ControlUdid'
      operationId: testDeviceAiLocator
      summary: Try an AI locator on the current screen
      description: >-
        Runs one of Xenon's AI locator strategies against a fresh screenshot, as a test would with
        `findElement`, without an Appium session.

        - `-custom:ai-text`: OCR; every word containing `selector` (case-insensitive, confidence
        above 60%).

        - `-custom:ai-icon`: the configured AI provider looks for what `selector` describes; at most
        one match, a 40×40 box around the point it names.

        Each match gets a virtual element id (`omni_…`). No match answers `200` with an empty
        `value`. A failed screenshot, a failed OCR for `ai-text`, or for `ai-icon` no AI provider
        configured or a failed AI call answers `500`, so a failure never reads as "nothing found".
        Counts against the `heavy` rate-limit budget.

        Needs the `MEMBER` role and the `devices` scope. Refused with `409` while another user holds
        the device (their live preview or recording) or runs an Appium session on it; admins are
        exempt, and your own Appium session on it stays controllable.

        On a hub, for a node's phone, this runs here and asks the node only for what it needs. A
        cloud provider's phone answers `501`. The OCR and AI run on the hub, with the hub's AI
        settings, on a screenshot taken by the node.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ControlTestLocatorRequest'
            example:
              strategy: '-custom:ai-text'
              selector: Sign in
      responses:
        '200':
          description: The matches, possibly none.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlTestLocatorResult'
              example:
                status: success
                value:
                  - id: omni_ocr_1759586722118_k3j9x
                    text: Sign
                    rect:
                      x: 142
                      'y': 210
                      width: 46
                      height: 26
                    confidence: 0.962
        '400':
          description: An unsupported `strategy`, no device manager for the platform, or a malformed udid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidUdid:
                  summary: The udid segment is not valid percent-encoding
                  value:
                    success: false
                    error: invalid_udid
                unsupportedStrategy:
                  summary: Unsupported strategy
                  value:
                    status: error
                    message: 'Unsupported strategy: xpath'
                notSupported:
                  summary: No device manager for the platform, or it can't do this
                  value:
                    error: not_supported
                    message: Manager not found
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ControlForbiddenMutation'
        '404':
          $ref: '#/components/responses/ControlDeviceNotFound'
        '409':
          $ref: '#/components/responses/ControlHeld'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          description: >-
            The screenshot failed, the OCR failed (`ai-text`), or no AI provider is configured or
            the AI call failed (`ai-icon`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlStatusError'
              examples:
                ocr:
                  summary: OCR failed (ai-text)
                  value:
                    status: error
                    message: OCR worker failed to start
                noProvider:
                  summary: No AI provider configured (ai-icon)
                  value:
                    status: error
                    message: No AI provider is configured
        '501':
          $ref: '#/components/responses/ControlCloudPhone'
        '503':
          $ref: '#/components/responses/ControlOwnershipUnavailable'
  /api/control/{udid}/appium-session:
