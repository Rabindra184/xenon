                  value:
                    error: bad_request
                    message: No files were uploaded.
                noAppField:
                  summary: A file, but not in the `app` field
                  value:
                    error: bad_request
                    message: File "app" is required
                notSupported:
                  summary: No installer for this platform
                  value:
                    error: not_supported
                    message: Manager not found or installApp not supported
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ControlForbiddenMutation'
        '404':
          $ref: '#/components/responses/ControlDeviceNotFound'
        '409':
