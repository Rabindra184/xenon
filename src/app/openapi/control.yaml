  /api/control/{udid}/stream/start:
    post:
      tags:
        - Control
      parameters:
        - $ref: '#/components/parameters/ControlUdid'
      operationId: startDevicePreview
      summary: Start the live preview and hold the device
      description: >-
        Starts the device's live preview and holds the device for you (`session_id` becomes
        `manual_<yourUserId>_<udid>`), so automation is not given it while you watch. iOS starts
        WebDriverAgent's MJPEG stream (and the go-ios tunnel on iOS 17+). Android starts an MJPEG
        screen capture, or, when the server's `streaming.androidH264` setting is on and the device
        is not being recorded, an H.264 stream for the WebSocket in `h264Path`. Missing screen
        dimensions are filled in and saved.

        Who may start:

        - a free device: anyone who can see it;

        - a device you already hold, or running your own Appium session: you (the preview runs
        alongside it);

        - a device held by someone whose preview is no longer running (left over from a restart):
        anyone; the old hold is cleared;

        - otherwise `409`, naming the holder. Admins may always start.

        Needs the `MEMBER` role and the `devices` scope.

        On a hub, for a node's phone, the request is forwarded to the node, which holds the phone by
        its own rules; on success the hub also marks the phone busy and held by you at once. A cloud
        provider's phone answers `501`.
      responses:
        '200':
          description: The preview is running. `type` says which transport to use.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlStreamStartResult'
              examples:
                mjpeg:
                  summary: MJPEG (iOS, or Android without H.264)
                  value:
                    success: true
                    type: mjpeg
                    mjpegPort: 9101
                    streamUrl: /xenon/api/control/00008110-00084CE80E51401E/stream
                h264:
                  summary: H.264 (Android, setting on)
                  value:
                    success: true
                    type: h264
                    h264Path: /xenon/api/control/R5CT32ABCDE/stream/h264
        '400':
          description: The udid is malformed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidUdid:
                  summary: The udid segment is not valid percent-encoding
                  value:
                    success: false
                    error: invalid_udid
        '401':
          description: No credential, or one that names no user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                success: false
                error: unauthenticated
        '403':
          $ref: '#/components/responses/ControlForbiddenMutation'
        '404':
          $ref: '#/components/responses/ControlDeviceNotFound'
        '409':
          $ref: '#/components/responses/ControlHeld'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          description: The preview could not be started (WebDriverAgent, scrcpy or the capture failed).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                success: false
                error: WDA did not become ready on port 8101 within 60000ms
        '501':
          $ref: '#/components/responses/ControlCloudPhone'
        '502':
          $ref: '#/components/responses/ControlNodeUnreachable'
        '503':
          $ref: '#/components/responses/ControlOwnershipUnavailable'
        '504':
          $ref: '#/components/responses/ControlNodeTimeout'
  /api/control/{udid}/stream/ticket:
    post:
      tags:
        - Control
      parameters:
        - $ref: '#/components/parameters/ControlUdid'
      operationId: createDeviceStreamTicket
      summary: Get a ticket to open the live preview
      description: >-
        Mints a single-use ticket, valid for 60 seconds and bound to this device and to you, for
        clients that cannot send headers or the cookie (an `<img>` tag, a WebSocket). It opens one
        of:

        - `GET /api/control/{udid}/stream?ticket=…` (MJPEG);

        - the WebSocket `/xenon/api/control/{udid}/stream/h264?ticket=…` (H.264 preview);

        - the WebSocket `/xenon/api/control/{udid}/logcat?ticket=…` (live Android logs; it applies
        the same ownership rule as `GET logs`).

        Mint a new ticket for each connection. Your team access is checked here, when the ticket is
        minted. Minting holds nothing and starts nothing; missing screen dimensions are filled in
        and saved in the background.

        Needs the `MEMBER` role and the `devices` scope. Not refused for a held device: watching is
        a read.

        On a hub the ticket is the hub's, for every phone (a node's included); the hub relays the
        node's stream or socket. For a cloud provider's phone the WebSockets close with `1008`.
      responses:
        '200':
          description: The ticket.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlStreamTicket'
              example:
                ticket: >-
                  eyJhbGciOiJSUzI1NiIsImtpZCI6Inhlbi0xIn0.eyJhdWQiOiJ4ZW5vbi1zdHJlYW0iLCJ1ZGlkIjoiUjVDVDMyQUJDREUifQ.c2ln
                expiresIn: 60
        '400':
          description: The udid is malformed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidUdid:
                  summary: The udid segment is not valid percent-encoding
                  value:
                    success: false
                    error: invalid_udid
        '401':
          description: No credential, or one that names no user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: unauthenticated
        '403':
          $ref: '#/components/responses/ControlForbiddenMutation'
        '404':
          $ref: '#/components/responses/ControlDeviceNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ControlOwnershipUnavailable'
  /api/control/{udid}/stream:
    get:
      tags:
        - Control
      parameters:
        - $ref: '#/components/parameters/ControlUdid'
        - in: query
          name: ticket
          required: false
          schema:
            type: string
          description: >-
            A single-use ticket from `POST /api/control/{udid}/stream/ticket`, in place of other
            credentials.
          example: >-
            eyJhbGciOiJSUzI1NiIsImtpZCI6Inhlbi0xIn0.eyJhdWQiOiJ4ZW5vbi1zdHJlYW0iLCJ1ZGlkIjoiUjVDVDMyQUJDREUifQ.c2ln
      operationId: streamDeviceScreen
      summary: Watch the device's screen (MJPEG)
      description: >-
        Streams the screen as MJPEG (`multipart/x-mixed-replace`) for as long as the connection
        stays open. Starts the device's MJPEG capture if it isn't running (iOS checks that
        WebDriverAgent still answers and restarts it if not), but holds nothing: use `POST
        stream/start` to hold the device. Each open connection counts as a viewer; a preview with no
        viewers is eventually stopped.


        Authenticate as usual, or with `?ticket=` from `POST stream/ticket`, for an `<img src>` that
        can carry neither headers nor the cookie. A ticket works only here, only for its device, and
        only once.


        Open to watchers: a busy device can be watched by anyone who can see it. Needs the `MEMBER`
        role; any scope will do.


        On a hub, for a node's phone, the request is sent on to that node once (never retried),
        signed for you, and the node's answer is relayed unchanged. A cloud provider's phone answers
        `501`. The stream is relayed for as long as you watch.
      security:
        - AccessKeyAuth: []
          TokenAuth: []
        - BearerAuth: []
        - CookieAuth: []
        - ControlStreamTicket: []
      responses:
        '200':
          description: The MJPEG stream, one JPEG per part, boundary `BoundaryString`.
          content:
            multipart/x-mixed-replace:
              schema:
                type: string
                format: binary
        '400':
          description: The udid is malformed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidUdid:
                  summary: The udid segment is not valid percent-encoding
                  value:
                    success: false
                    error: invalid_udid
        '401':
          description: No credential, or a ticket that is invalid, expired, already used or for another device.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                ticket:
                  summary: A bad ticket
                  value:
                    error: invalid ticket
                none:
                  summary: No credential
                  value:
                    error: unauthenticated
        '403':
          $ref: '#/components/responses/ControlForbiddenRead'
        '404':
          description: >-
            No such device (or one outside your teams), no MJPEG source for it, or the preview
            proxy could not be set up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                device:
                  summary: Unknown or hidden device
                  value:
                    error: not_found
                    message: Device not found
                noSource:
                  summary: No MJPEG source for the device
                  value:
                    error: MJPEG port not found for device
                    hint: Start the preview with POST /stream/start, then open this stream again.
                noProxy:
                  summary: The preview proxy could not be set up
                  value:
                    error: not_found
                    message: The preview could not be started
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          description: The stream proxy failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Stream proxy error
                message: connect ECONNREFUSED 127.0.0.1:9101
        '501':
          $ref: '#/components/responses/ControlCloudPhone'
        '502':
          $ref: '#/components/responses/ControlNodeUnreachable'
        '503':
          description: >-
            The capture could not be started, its source didn't answer in time, or the device's
            ownership could not be checked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                ios:
                  summary: iOS stream failed to start
                  value:
                    error: Stream not available
                    message: WDA did not become ready on port 8101 within 60000ms
                android:
                  summary: Android capture failed to start
                  value:
                    error: Android stream failed
                    message: device offline
                ownership:
                  summary: Lookup failed
                  value:
                    success: false
                    error: device_ownership_unavailable
                    message: Could not verify device ownership. Try again.
            text/html:
              schema:
                type: string
              example: '[MjpegProxy] Source not available after timeout'
        '504':
          $ref: '#/components/responses/ControlNodeTimeout'
  /api/control/{udid}/stream/status:
    get:
      tags:
        - Control
      parameters:
        - $ref: '#/components/parameters/ControlUdid'
      operationId: getDevicePreviewStatus
      summary: Get the live preview's status
      description: >-
        Says whether the device's preview is running and which transport a player should use
        (`type`: `h264` on Android when the server's `streaming.androidH264` setting is on and the
        device isn't being recorded, else `mjpeg`). A device with no preview answers `200` with
        `status: stopped`. iOS adds WebDriverAgent's port, the start time and the last error.


        Open to watchers. Needs the `MEMBER` role; any scope will do.


        On a hub, for a node's phone, the request is sent on to that node once (never retried),
        signed for you, and the node's answer is relayed unchanged. A cloud provider's phone answers
        `501`.
      responses:
