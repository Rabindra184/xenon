          description: This server has no device manager for the platform, or the udid is malformed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidUdid:
                  summary: The udid segment is not valid percent-encoding
                  value:
                    success: false
                    error: invalid_udid
                notSupported:
                  summary: No device manager for the platform, or it can't do this
                  value:
                    error: not_supported
                    message: Manager not found
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ControlForbiddenRead'
        '404':
          $ref: '#/components/responses/ControlDeviceNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          description: The analysis failed (an empty screenshot, OCR failing).
          content:
