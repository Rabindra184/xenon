      operationId: scanDeviceScreen
      summary: Analyse the screen with OCR and AI
      description: >-
        Screenshots the device, runs OCR over it (every word with its confidence and box) and asks
        the configured AI provider for a qualitative read of the screen. No Appium session is
        needed. Slow: allow tens of seconds.


        If the analysis itself fails (an empty screenshot, OCR failing), the answer is `500` with
        `{ status: 'error', message }`. If only the AI step fails, the answer is `200` and
        `ai_insights` is `null`.


        Open to watchers. Needs the `MEMBER` role; any scope will do.


        On a hub, for a node's phone, this runs here and asks the node only for what it needs. A
        cloud provider's phone answers `501`. The OCR and AI run on the hub, with the hub's AI
        settings, on a screenshot taken by the node.
      responses:
        '200':
