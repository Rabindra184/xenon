              examples:
                analysed:
                  summary: Analysed
                  value:
                    status: success
                    value:
                      timestamp: '2026-10-04T14:05:22.118Z'
                      ocr:
                        text: |-
                          Sign in
                          Email
                          Password
                          Forgot password?
                        words:
                          - text: Sign
                            confidence: 96.2
                            bbox:
                              x0: 142
                              y0: 210
                              x1: 188
                              y1: 236
                      ai_insights:
                        summary: >-
                          A sign-in form with email and password fields and a disabled Sign in
                          button.
