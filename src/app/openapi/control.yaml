  /api/control/{udid}/logs:
    get:
      tags:
        - Control
      parameters:
        - $ref: '#/components/parameters/ControlUdid'
      operationId: getDeviceLogs
      summary: Read recent device logs
      description: >-
        Returns recent device log lines as one string.

        - **Android:** the last 500 lines of `logcat` (`-v threadtime`). If `adb` fails or isn't
        available, the answer is `500` with the reason in `error`.

        - **iOS (real device):** the lines the syslog stream has gathered since the previous call.
        The first call starts that stream and may return nothing; each call empties the buffer, so
        two clients polling the same phone split the lines between them. The stream stops after a
        while without calls.

        - **iOS simulator:** the last 10 seconds of `log show`.

        For a continuous Android log use the logcat WebSocket (see `POST
        /api/control/{udid}/stream/ticket`).

        Ownership-checked like the clipboard: logs carry tokens and personal data from the app under
        test, so while another user holds the device or runs a session on it you get `409`. Needs
        the `MEMBER` role; any scope will do.

        On a hub, for a node's phone, the request is sent on to that node once (never retried),
        signed for you, and the node's answer is relayed unchanged. A cloud provider's phone answers
        `501`.
      responses:
        '200':
          description: The log text.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlLogs'
              example:
                logs: >-
                  10-04 14:02:11.532  1203  1250 I ActivityManager: Start proc
                  8812:com.example.shop/u0a201 for activity

                  10-04 14:02:11.871  8812  8812 D ShopApp: onCreate
        '400':
          description: This server can't do this on the device's platform, or the udid is malformed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidUdid:
                  summary: The udid segment is not valid percent-encoding
                  value:
                    success: false
                    error: invalid_udid
                notSupported:
                  summary: No device manager for the platform, or it can't do this
                  value:
                    error: not_supported
                    message: Manager not found or getLogs not supported
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ControlForbiddenRead'
        '404':
          $ref: '#/components/responses/ControlDeviceNotFound'
        '409':
          $ref: '#/components/responses/ControlHeld'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          description: Reading logs failed on the device (on Android, `adb` failed or isn't available).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                android:
                  summary: Android, no adb
                  value:
                    error: ADB is not available
                ios:
                  summary: iOS
                  value:
                    error: spawn idevicesyslog ENOENT
        '501':
          $ref: '#/components/responses/ControlCloudPhone'
        '502':
          $ref: '#/components/responses/ControlNodeUnreachable'
        '503':
          $ref: '#/components/responses/ControlOwnershipUnavailable'
        '504':
          $ref: '#/components/responses/ControlNodeTimeout'
  /api/control/{udid}/shell:
    post:
      tags:
        - Control
      parameters:
        - $ref: '#/components/parameters/ControlUdid'
      operationId: runDeviceShellCommand
      summary: Run an allowed shell command
      description: >-
        Runs one diagnostic command from an allowlist and returns its output. Anything else is
        refused, and so is a command that fails, **with `200`** and an `error` field instead of
        `output` (the dashboard's terminal prints either).

        A command must be one of the commands below, word for word, on one line. Where it takes
        arguments, they are plain words: letters, digits and `._/:=@%+,-`. Anything a shell would
        interpret (`;`, `|`, `&`, `$`, backticks, quotes, `<`, `>`) is refused.

        - **Android** (`adb shell`): `ls`, `ps`, `top`, `getprop`, `pm list packages`, `ip addr`,
        `date` and `netstat`, with arguments; `dumpsys battery`, `dumpsys wifi`, `dumpsys power`,
        `whoami`, `cat /proc/meminfo`, `cat /proc/cpuinfo` and `uptime`, without.

        - **iOS simulator:** `listapps`, and `get_app_container` and `getenv` with arguments
        (through `simctl`); `ls`, `ps`, `whoami`, `date`, `uptime` and `id` without arguments
        (spawned in the simulator).

        - **Real iPhone** (go-ios, through the phone's tunnel): `apps` with arguments and `info`
        without. Xenon names the phone; a command may not pass `--udid`.

        Needs the `MEMBER` role and the `devices` scope. Refused with `409` while another user holds
        the device (their live preview or recording) or runs an Appium session on it; admins are
        exempt, and your own Appium session on it stays controllable.

        On a hub, for a node's phone, the request is sent on to that node once (never retried),
        signed for you, and the node's answer is relayed unchanged. A cloud provider's phone answers
        `501`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ControlShellRequest'
            example:
              command: dumpsys battery
      responses:
        '200':
          description: The output, or an `error` for a refused or failed command.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlShellResult'
              examples:
                output:
                  summary: The command ran
                  value:
                    output: |
                      Current Battery Service state:
                        AC powered: false
                        USB powered: true
                        level: 87
                refused:
                  summary: Not on the allowlist
                  value:
                    error: Command 'rm -rf /sdcard' is not allowed for security reasons.
        '400':
          description: '`command` is missing or empty, the platform has no shell here, or the udid is malformed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidUdid:
                  summary: The udid segment is not valid percent-encoding
                  value:
                    success: false
                    error: invalid_udid
                noCommand:
                  summary: No `command`
                  value:
                    error: bad_request
                    message: Command is required
                notSupported:
                  summary: No shell for the platform here
                  value:
                    error: not_supported
                    message: Manager not found or executeShell not supported
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ControlForbiddenMutation'
        '404':
          $ref: '#/components/responses/ControlDeviceNotFound'
        '409':
          $ref: '#/components/responses/ControlHeld'
        '429':
          $ref: '#/components/responses/RateLimited'
        '501':
          $ref: '#/components/responses/ControlCloudPhone'
        '502':
          $ref: '#/components/responses/ControlNodeUnreachable'
        '503':
