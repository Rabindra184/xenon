        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InterceptorFailed'
  /api/interceptor/sessions/{sessionId}/mocks:
    get:
      operationId: listInterceptorMocks
      summary: List a session's mock rules
      description: >-
        The mock rules of a session whose interceptor is running, in the order they were added (the
        newest matching rule wins). A finished session has none: `404`. Needs role `ADMIN`.
      tags:
        - Network Interceptor
      parameters:
        - $ref: '#/components/parameters/InterceptorSessionId'
      responses:
        '200':
          description: The mock rules.
          content:
            application/json:
              schema:
                type: object
                properties:
                  mocks:
                    type: array
                    items:
                      $ref: '#/components/schemas/InterceptorMock'
              example:
                mocks:
                  - id: mock-mg9x2k1a-1
                    addedAt: 1759501100412
                    match:
                      url: https://api.example.com/v2/cart/**
                      method: POST
                    respondWith:
                      status: 503
                      headers:
                        content-type: application/json
                      body:
                        error: maintenance
                      delayMs: 1500
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/InterceptorInactive'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InterceptorFailed'
    post:
      operationId: addInterceptorMock
      summary: Add a mock rule to a running session
      description: >-
        Adds a mock rule to a session whose interceptor is running. A rule matches a request by
        URL (exact, or a glob where `*` is any text without `/` and `**` any text) and optionally
        by method, then rewrites the request, answers with `respondWith` without reaching the
        server, or changes the real response (`rewriteResponse`). When several rules match, the
        newest wins. Without an `id` one is generated. The body is stored as given and isn't
        validated, so send a `match.url`. Needs role `ADMIN`. With the dashboard cookie, the
        request needs a same-host `Origin` or `Referer`.
      tags:
        - Network Interceptor
      parameters:
        - $ref: '#/components/parameters/InterceptorSessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InterceptorMockInput'
            example:
              match:
                url: https://api.example.com/v2/cart/**
                method: POST
              respondWith:
                status: 503
                headers:
                  content-type: application/json
                body:
                  error: maintenance
                delayMs: 1500
      responses:
        '201':
          description: The rule was added.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
              example:
                id: mock-mg9x2k1a-1
        '400':
          description: The rule couldn't be added.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Cannot read properties of undefined (reading 'url')
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/InterceptorInactive'
        '429':
          $ref: '#/components/responses/RateLimited'
    delete:
      operationId: clearInterceptorMocks
      summary: Remove all of a session's mock rules
      description: >-
        Removes every mock rule of a session whose interceptor is running. Needs role `ADMIN`.
        With the dashboard cookie, the request needs a same-host `Origin` or `Referer`.
      tags:
        - Network Interceptor
      parameters:
        - $ref: '#/components/parameters/InterceptorSessionId'
      responses:
        '200':
          description: The rules were removed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
              example:
                ok: true
        '400':
          description: The interceptor stopped while the request was handled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Interceptor not active for session 6f1c2a8e-3b4d-4e5f-9a7b-1c2d3e4f5a6b
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/InterceptorInactive'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/interceptor/sessions/{sessionId}/mocks/{mockId}:
    delete:
      operationId: removeInterceptorMock
      summary: Remove one mock rule
      description: >-
        Removes one mock rule of a session whose interceptor is running. An unknown `mockId`
        answers `200` with `removed: false`. Needs role `ADMIN`. With the dashboard cookie, the
        request needs a same-host `Origin` or `Referer`.
      tags:
        - Network Interceptor
      parameters:
        - $ref: '#/components/parameters/InterceptorSessionId'
        - in: path
          name: mockId
          required: true
          schema:
            type: string
          description: The rule's `id`.
          example: mock-mg9x2k1a-1
      responses:
        '200':
          description: Whether a rule was removed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  removed:
                    type: boolean
              example:
                removed: true
        '400':
          description: The interceptor stopped while the request was handled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Interceptor not active for session 6f1c2a8e-3b4d-4e5f-9a7b-1c2d3e4f5a6b
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/InterceptorInactive'
        '429':
          $ref: '#/components/responses/RateLimited'
components:
  parameters:
    SessionsSessionId:
      in: path
      name: sessionId
      required: true
      schema:
        type: string
      description: The Appium session id.
      example: 6f1c2a8e-3b4d-4e5f-9a7b-1c2d3e4f5a6b
    InterceptorSessionId:
      in: path
      name: sessionId
      required: true
      schema:
        type: string
      description: The Appium session id.
      example: 6f1c2a8e-3b4d-4e5f-9a7b-1c2d3e4f5a6b
    SelectorHealthWindowDays:
      in: query
      name: windowDays
      schema:
        type: integer
        minimum: 1
        maximum: 365
        default: 30
      description: The period, in days back from now; clamped to 1–365.
      example: 7
    SelectorHealthTz:
      in: query
      name: tz
      schema:
        type: integer
        minimum: -840
        maximum: 840
        default: 0
      description: >-
        The caller's offset from UTC in minutes, east positive (the browser's
        `-getTimezoneOffset()`), so days are the caller's. Anything else counts as 0.
      example: 330
  responses:
    SessionsSessionNotFound:
      description: The session is unknown, or one the caller may not see (the two answer the same).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: true
            message: Session with id 6f1c2a8e-3b4d-4e5f-9a7b-1c2d3e4f5a6b not found
    SelectorHealthNotFound:
      description: >-
        No session the caller may see has healed this selector, or it is unknown (the two answer
        the same).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: not_found
            message: Selector not found
    InterceptorInactive:
      description: The session's interceptor isn't running, and there is no saved capture to read.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: interceptor inactive
            sessionId: 6f1c2a8e-3b4d-4e5f-9a7b-1c2d3e4f5a6b
    InterceptorFailed:
      description: The capture couldn't be read.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: 'EACCES: permission denied'
  schemas:
    SessionsSessionRecord:
      description: >-
        A session's stored record, with who ran it and where. Capabilities are stored as JSON
        text, with credentials already removed.
      allOf:
        - $ref: '#/components/schemas/Session'
        - type: object
          properties:
            desired_capabilities:
              type: string
              description: The capabilities the client asked for, as JSON text.
            session_capabilities:
              type: string
              description: The capabilities the driver answered, as JSON text.
            node_id:
              type: string
              description: The server that ran it, as of that server's boot.
            has_live_video:
              type: boolean
            video_recording_enabled:
              type: boolean
            video_recording:
              type: string
              nullable: true
            startTime:
              type: string
              format: date-time
            endTime:
              type: string
              format: date-time
              nullable: true
            failure_reason:
              type: string
              nullable: true
            failure_category:
              type: string
              nullable: true
            is_profiling_available:
              type: boolean
            device_info:
              type: string
              nullable: true
            device_version:
              type: string
            ai_analysis:
              type: string
              nullable: true
            tags:
              type: string
              nullable: true
            trace_id:
              type: string
              nullable: true
            api_key_id:
              type: string
              nullable: true
              description: The API key that created it, if any.
            user_id:
              type: string
              nullable: true
              description: The person who ran it, if known.
            owner:
              type: object
              nullable: true
              description: Who ran it, or null when that isn't known.
              properties:
                name:
                  type: string
                email:
                  type: string
            ranOn:
              type: string
              nullable: true
              description: >-
                `here` for this server, a node's host (`192.168.1.21:4723`) for another server's
                device, or null when that isn't known any more.
    SessionsSummary:
      type: object
      properties:
        since:
          type: string
          format: date-time
          nullable: true
        current:
          allOf:
            - $ref: '#/components/schemas/SessionsPeriodCounts'
            - type: object
              properties:
                medianMs:
                  type: integer
                  nullable: true
                  description: Median duration of the period's ended sessions; null if none.
                p90Ms:
                  type: integer
                  nullable: true
                  description: 90th-percentile duration of the period's ended sessions.
        previous:
          allOf:
            - $ref: '#/components/schemas/SessionsPeriodCounts'
          nullable: true
          description: The period of the same length before; null without `since`.
        runningNow:
          type: object
          properties:
            sessions:
              type: integer
            devices:
              type: integer
    SessionsPeriodCounts:
      type: object
      properties:
        total:
          type: integer
        passed:
          type: integer
        failed:
          type: integer
        running:
          type: integer
    SessionsBuildRecord:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        _count:
