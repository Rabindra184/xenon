                type: string
              sessionId:
                type: string
              buildId:
                type: string
                nullable: true
              deviceUdid:
                type: string
                nullable: true
              deviceName:
                type: string
                nullable: true
              devicePlatform:
                type: string
                nullable: true
              commandName:
                type: string
                nullable: true
              healedSelector:
                type: string
                nullable: true
              confidence:
                type: number
                nullable: true
              tier:
                type: string
                nullable: true
              isSuccess:
                type: boolean
                nullable: true
              createdAt:
                type: string
                format: date-time
    SelectorHealthFeedItem:
      type: object
      properties:
        selector:
          type: string
        strategy:
          type: string
          nullable: true
        healCount:
          type: integer
        topTier:
          type: string
          nullable: true
        suggestedRewrite:
          type: string
          nullable: true
        state:
          allOf:
            - $ref: '#/components/schemas/SelectorHealthStateRow'
          nullable: true
        lastHealedAt:
          type: string
          format: date-time
        etalonAge:
          type: integer
          description: >-
            Milliseconds since the selector's stored fingerprint was last seen; absent when there
            is none for this strategy.
    SelectorHealthPerson:
      type: object
      description: Who did something. `name` is null for a deleted user, or with auth disabled.
      properties:
        id:
          type: string
        name:
          type: string
          nullable: true
    SelectorHealthStateView:
      type: object
      description: A selector's status as the dashboard shows it.
      properties:
        status:
          type: string
          enum:
            - active
            - pending
            - resolved
            - muted
        cleanBuilds:
          type: integer
        fixedAt:
          type: string
          format: date-time
          nullable: true
        fixedBy:
          allOf:
            - $ref: '#/components/schemas/SelectorHealthPerson'
          nullable: true
        resolvedAt:
          type: string
          format: date-time
          nullable: true
        mutedAt:
          type: string
          format: date-time
          nullable: true
        mutedBy:
          allOf:
            - $ref: '#/components/schemas/SelectorHealthPerson'
          nullable: true
        muteReason:
          type: string
          nullable: true
        brokeAgain:
          type: integer
          description: How often it healed again after being fixed.
    SelectorHealthListItem:
      type: object
      properties:
        strategy:
          type: string
          description: Empty for heals recorded with no strategy.
        selector:
          type: string
        heals:
          type: integer
          description: Heals in the period.
        sessions:
          type: integer
        lastHealedAt:
          type: string
          format: date-time
          nullable: true
        timeSpentMs:
          type: integer
        topMethod:
          type: string
          nullable: true
        suggestion:
          type: object
          nullable: true
          properties:
            selector:
              type: string
            strategy:
              type: string
              nullable: true
            share:
              type: number
              description: The share of the period's heals that found it, 0 to 1.
        state:
          allOf:
            - $ref: '#/components/schemas/SelectorHealthStateView'
          nullable: true
    SelectorHealthList:
      type: object
      properties:
        tab:
          type: string
          enum:
            - fix
            - verifying
            - fixed
            - muted
        days:
          type: integer
        page:
          type: integer
          description: The page answered; the last page when the one asked for is past the end.
        pageSize:
          type: integer
        total:
          type: integer
          description: Selectors in this tab after the search and filters.
        counts:
          type: object
          description: Selectors in each tab for the period, before the search and filters.
          properties:
            fix:
              type: integer
            verifying:
              type: integer
            fixed:
              type: integer
            muted:
              type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/SelectorHealthListItem'
        canAct:
          type: boolean
          description: Whether the caller may mark fixed, mute, unmute and cancel.
    SelectorHealthDetail:
      type: object
      properties:
        strategy:
          type: string
        selector:
          type: string
        days:
          type: integer
        heals:
          type: integer
        sessions:
          type: integer
        timeSpentMs:
          type: integer
        firstHealedAt:
          type: string
          format: date-time
          nullable: true
        lastHealedAt:
          type: string
          format: date-time
          nullable: true
        daily:
          type: array
          items:
            type: object
            properties:
              t:
                type: integer
                description: When the caller's local day began, epoch milliseconds.
              heals:
                type: integer
        suggestions:
          type: array
          items:
            type: object
            properties:
              selector:
                type: string
              strategy:
                type: string
                nullable: true
              count:
                type: integer
              share:
                type: number
              methods:
                type: array
                items:
                  type: string
              averageConfidence:
                type: number
                nullable: true
        platforms:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              count:
                type: integer
        builds:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                nullable: true
              name:
                type: string
              count:
                type: integer
        devices:
          type: array
          items:
            type: object
            properties:
              udid:
                type: string
              name:
                type: string
              count:
                type: integer
        recent:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              sessionId:
                type: string
              buildId:
                type: string
                nullable: true
              at:
                type: string
                format: date-time
              device:
                type: string
                nullable: true
              platform:
                type: string
                nullable: true
              method:
                type: string
                nullable: true
              confidence:
                type: number
                nullable: true
              healedSelector:
                type: string
                nullable: true
        state:
          allOf:
            - $ref: '#/components/schemas/SelectorHealthStateView'
          nullable: true
        activity:
          type: array
          items:
            type: object
            properties:
              action:
                type: string
                example: marked_fixed
              at:
                type: string
                format: date-time
              by:
                allOf:
                  - $ref: '#/components/schemas/SelectorHealthPerson'
                nullable: true
              reason:
                type: string
                nullable: true
        canAct:
          type: boolean
    InterceptorCapturedRequest:
      type: object
      properties:
        id:
          type: string
        sessionId:
          type: string
        ts:
          type: number
          description: Epoch milliseconds.
        method:
          type: string
        url:
          type: string
        host:
          type: string
        path:
          type: string
        reqHeaders:
          type: object
          additionalProperties:
            type: string
        reqBody:
          type: string
          nullable: true
        resStatus:
          type: integer
          description: -1 when the request never completed.
        resHeaders:
          type: object
          additionalProperties:
            type: string
        resBody:
          type: string
          nullable: true
        bodyPath:
          type: string
        durationMs:
          type: number
        mocked:
          type: boolean
        modified:
          type: boolean
        mockId:
          type: string
        commandHint:
          type: object
          description: The Appium command that ran just before it.
          properties:
            commandName:
              type: string
            commandTs:
              type: number
        failed:
          type: boolean
        failureReason:
          type: string
        failureKind:
          type: string
          enum:
            - HTTPS_CLIENT_ERROR
            - HTTPS_SERVER_ERROR
            - OPEN_HTTPS_SERVER_ERROR
            - ON_CONNECT_ERROR
            - PROXY_TO_SERVER_REQUEST_ERROR
    InterceptorMockInput:
      type: object
      required:
        - match
      properties:
        id:
          type: string
          description: Generated when absent.
        match:
          type: object
          required:
            - url
          properties:
            url:
              type: string
              description: The exact URL, or a glob (`*` within a path segment, `**` across them).
            method:
              type: string
              description: Matched case-insensitively; any method when absent.
        rewriteRequest:
          type: object
          properties:
            url:
              type: string
            headers:
              type: object
              additionalProperties:
                type: string
            body:
              oneOf:
                - type: string
                - type: object
                  additionalProperties: true
        respondWith:
          type: object
          required:
            - status
          properties:
            status:
              type: integer
            headers:
              type: object
              additionalProperties:
                type: string
            body:
              oneOf:
                - type: string
                - type: object
                  additionalProperties: true
            delayMs:
              type: integer
        rewriteResponse:
          type: object
          properties:
            status:
              type: integer
            headers:
              type: object
              additionalProperties:
                type: string
            bodyTransform:
              type: string
              enum:
                - jsonMerge
                - replace
            body:
              oneOf:
                - type: string
                - type: object
                  additionalProperties: true
    InterceptorMock:
      allOf:
        - $ref: '#/components/schemas/InterceptorMockInput'
        - type: object
          properties:
            addedAt:
              type: number
              description: Epoch milliseconds.
