        memory:
          type: string
          nullable: true
        total_cpu_used:
          type: string
          nullable: true
        total_memory_used:
          type: string
          nullable: true
        raw_cpu_log:
          type: string
          nullable: true
        raw_memory_log:
          type: string
          nullable: true
        timestamp:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SessionsMetrics:
      type: object
      properties:
        platform:
          type: string
