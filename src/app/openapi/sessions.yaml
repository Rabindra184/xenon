  /api/healing/hotspots:
    get:
      operationId: listHealingHotspots
      summary: List the most-healed selectors
      description: >-
        The selectors healed most often in the last `windowDays` days, grouped by strategy and
        selector, most heals first (then most recent), with the most common healed selector as a
        suggested rewrite and the selector's lifecycle state. It reads at most the newest 5000
        heals of the period (`totalScanned`), so on a busy lab the counts are of those. The
        Selector Health page itself uses `GET /api/healing/selectors`, which counts every heal.


        `status` filters by lifecycle state, after `limit` is applied: `active` (the default:
        never marked, or active again) hides selectors being verified, fixed or muted. Any other
        value is treated as `active`. Only heals in sessions the caller may see count; the `state`
        row is lab-wide. Any signed-in user (role `MEMBER` or above) may call it.
      tags:
        - Selector Health
      parameters:
        - $ref: '#/components/parameters/SelectorHealthWindowDays'
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: How many selectors; clamped to 1–100.
          example: 10
        - in: query
          name: status
          schema:
            type: string
            enum:
              - active
              - pending
              - resolved
              - muted
              - all
            default: active
          description: >-
            Lifecycle state: `pending` is being verified, `resolved` is verified fixed.
          example: active
        - in: query
          name: tier
          schema:
            type: string
          description: Only heals by this healing method, for example `LLM` or `Fuzzy XML`.
          example: LLM
        - in: query
          name: platform
          schema:
            type: string
          description: Only heals in sessions on this platform.
          example: android
      responses:
        '200':
          description: The hotspots.
          content:
            application/json:
              schema:
                type: object
                properties:
                  windowDays:
                    type: integer
                  totalScanned:
                    type: integer
                    description: Heals read, at most 5000.
                  filters:
                    type: object
                    properties:
                      tier:
                        type: string
                        nullable: true
                      platform:
                        type: string
                        nullable: true
                      status:
                        type: string
                  hotspots:
                    type: array
                    items:
                      $ref: '#/components/schemas/SelectorHealthHotspot'
              example:
                windowDays: 30
                totalScanned: 412
                filters:
                  tier: null
                  platform: android
                  status: active
                hotspots:
                  - originalStrategy: accessibility id
                    originalSelector: login-btn
                    healCount: 41
                    sessionCount: 29
                    topTier: Fuzzy XML
                    suggestedRewrite: //android.widget.Button[@text="Log in"]
                    suggestedStrategy: xpath
                    suggestedRewriteShare: 0.88
                    averageConfidence: 0.91
                    firstHealedAt: '2026-09-05T08:12:44.019Z'
                    lastHealedAt: '2026-10-03T14:20:31.512Z'
                    state: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
