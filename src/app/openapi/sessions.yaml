  /api/healing/digest/send:
    post:
      operationId: sendSelectorHealthDigest
      summary: Send the selector health digest now
      description: >-
        Sends the selector health digest to every active webhook subscribed to the
        `selector_health_digest` event: the most-healed active selectors of the last `windowDays`
        days (healed at least `minHealCount` times), with total heals and distinct selectors. It
        counts every team's heals, so it needs role `ADMIN` and the `admin` scope. Each setting
        may be given in the JSON body or as a query parameter; the body wins. With the dashboard
        cookie, the request needs a same-host `Origin` or `Referer`.
      tags:
        - Selector Health
      parameters:
        - in: query
          name: windowDays
          schema:
            type: integer
            minimum: 1
            maximum: 365
            default: 7
          example: 7
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 5
          example: 5
        - in: query
          name: minHealCount
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 2
          example: 2
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                windowDays:
                  type: integer
                  minimum: 1
                  maximum: 365
                  default: 7
                  description: The period, in days back from now; clamped to 1–365.
                limit:
                  type: integer
                  minimum: 1
                  maximum: 20
                  default: 5
                  description: How many selectors the digest lists; clamped to 1–20.
                minHealCount:
                  type: integer
                  minimum: 1
                  maximum: 1000
                  default: 2
                  description: The fewest heals a listed selector has; clamped to 1–1000.
            example:
              windowDays: 7
              limit: 5
              minHealCount: 2
      responses:
        '200':
          description: The digest was handed to the webhooks.
          content:
            application/json:
              schema:
                type: object
                properties:
                  sent:
                    type: integer
                    description: How many active webhooks subscribe to the digest.
                  windowDays:
                    type: integer
                  hotspotsIncluded:
                    type: integer
              example:
                sent: 2
                windowDays: 7
                hotspotsIncluded: 4
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
