                type: string
              type:
                type: string
                enum:
                  - local
                  - remote
                  - cloud
              deviceUdid:
                type: string
              deviceName:
                type: string
              platform:
                type: string
    SessionsRequestLogList:
      type: object
      properties:
        stats:
          type: object
          description: Over the whole buffer (up to 500 calls), not just those returned.
          properties:
            totalLogged:
              type: integer
            errorCount:
              type: integer
            avgDurationMs:
              type: integer
            byMethod:
              type: object
              additionalProperties:
                type: integer
            byStatusCode:
              type: object
              additionalProperties:
                type: integer
        logs:
          type: array
          items:
            type: object
            properties:
