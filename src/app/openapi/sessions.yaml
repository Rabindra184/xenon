paths:
  /api/session:
    get:
      operationId: listSessions
      summary: List sessions
      description: >-
        Lists Appium sessions, newest first (by `createdAt`, then by `id`), each with who ran it
        (`owner`) and where (`ranOn`). Only sessions the caller may see are listed: a member sees
        the sessions on their teams' devices and the shared pool, plus their own sessions whose
        device is no longer known; an admin sees all. The team rule is part of the query, so
        `limit` counts the caller's sessions.


        Page through the list with `before` and `beforeId`: pass the `createdAt` and `id` of the
        last session of the previous page. A query parameter that can't be read is refused with
        `400` rather than ignored.


        Any signed-in user (role `MEMBER` or above) may call it.
      tags:
        - Sessions
      parameters:
        - in: query
          name: buildId
          schema:
            type: string
          description: Only this build's sessions.
          example: 9d2f4c1e-7a3b-4e8f-b6c5-2d1e0f9a8b7c
        - in: query
          name: status
          schema:
            type: string
          description: >-
            Only sessions with exactly this stored status, for example `running`, `success`,
            `passed`, `failed`, `error`, `timeout` or `ended`.
          example: failed
        - in: query
          name: platform
          schema:
            type: string
          description: Only sessions on this platform, as stored (`android` or `ios`).
          example: android
        - in: query
          name: query
          schema:
            type: string
          description: >-
            Text contained in the session's id, name, device udid, device name, failure category
            or tags.
          example: Pixel 7
        - in: query
          name: ids
          schema:
            type: string
          description: >-
            Only these sessions: 1 to 200 session ids separated by commas. An empty list or more
            than 200 ids is refused (`400 invalid_ids`).
          example: 6f1c2a8e-3b4d-4e5f-9a7b-1c2d3e4f5a6b,0b7e4d21-55c6-4c0b-8f0e-6a1d9c3b2e10
        - in: query
          name: since
          schema:
            type: string
            format: date-time
          description: >-
            Only sessions created at or after this time (ISO 8601). A value that isn't a date is
            refused (`400 invalid_since`).
          example: '2026-10-01T00:00:00.000Z'
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            default: 500
          description: >-
            Sessions per answer. A limit above 2000 is answered with 2000. A value that isn't a
            whole number from 1 is refused (`400 invalid_limit`).
          example: 100
        - in: query
          name: before
          schema:
            type: string
            format: date-time
          description: >-
            Start of the next page: the `createdAt` of the last session of the previous page. A
            value that isn't a date is refused (`400 invalid_before`).
          example: '2026-10-03T14:22:05.120Z'
        - in: query
          name: beforeId
          schema:
            type: string
          description: >-
            The `id` of the last session of the previous page, used with `before` so sessions
            created in the same millisecond are neither skipped nor repeated. Without it, the page
            holds everything older than `before`.
          example: 6f1c2a8e-3b4d-4e5f-9a7b-1c2d3e4f5a6b
      responses:
        '200':
          description: Up to `limit` sessions, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SessionsSessionRecord'
              example:
                - id: 6f1c2a8e-3b4d-4e5f-9a7b-1c2d3e4f5a6b
                  build_id: 9d2f4c1e-7a3b-4e8f-b6c5-2d1e0f9a8b7c
                  name: Checkout with saved card
                  status: failed
                  node_id: 3c9a1f20-8d4e-4b7a-a1c2-5e6f7a8b9c0d
                  has_live_video: true
                  video_recording_enabled: true
                  video_recording: 6f1c2a8e-3b4d-4e5f-9a7b-1c2d3e4f5a6b.mp4
                  startTime: '2026-10-03T14:20:11.004Z'
                  endTime: '2026-10-03T14:22:05.120Z'
                  failure_reason: 'NoSuchElementError: An element could not be located'
                  failure_category: element_not_found
                  device_udid: emulator-5554
                  device_platform: android
                  device_version: '14'
                  device_name: Pixel 7
                  createdAt: '2026-10-03T14:20:11.004Z'
                  updatedAt: '2026-10-03T14:22:05.311Z'
                  api_key_id: null
                  user_id: 5b8e2c14-0f3a-4d6b-9e7c-1a2b3c4d5e6f
                  owner:
                    name: Priya Raman
                    email: priya@example.com
                  ranOn: here
        '400':
          description: A query parameter can't be read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                since:
                  value:
                    error: invalid_since
                    message: since must be an ISO 8601 date
                limit:
                  value:
                    error: invalid_limit
                    message: limit must be a whole number from 1
                before:
                  value:
                    error: invalid_before
                    message: before must be an ISO 8601 date
                ids:
                  value:
                    error: invalid_ids
                    message: ids must list 1 to 200 session ids, separated by commas
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/session-summary:
    get:
      operationId: summarizeSessions
      summary: Summarize sessions over a period
      description: >-
        The Sessions page's summary strip, over the sessions the caller may see (and of one build
        when `buildId` is given):

        - `current`: the period from `since` to now, with counts by outcome and the median and
        90th-percentile duration of the sessions in it that ended. Durations come from at most the
        10,000 newest ended sessions of the period.

        - `previous`: the period of the same length just before it, or null without `since`.

        - `runningNow`: sessions running now and the distinct devices they run on.


        Outcomes: `success`, `passed` and `ended` count as passed; `failed`, `error` and `timeout`
        as failed; `running` as running. Any other status counts only in `total`. Any signed-in
        user (role `MEMBER` or above) may call it.
      tags:
        - Sessions
      parameters:
        - in: query
          name: since
          schema:
            type: string
            format: date-time
          description: >-
            Start of the period. Without it the period is all time and `previous` is null. A value
            that isn't a date is refused (`400 invalid_since`).
          example: '2026-09-27T00:00:00.000Z'
        - in: query
          name: buildId
          schema:
            type: string
          description: Only this build's sessions.
          example: 9d2f4c1e-7a3b-4e8f-b6c5-2d1e0f9a8b7c
      responses:
        '200':
          description: The summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionsSummary'
              example:
                since: '2026-09-27T00:00:00.000Z'
                current:
                  total: 412
                  passed: 371
                  failed: 33
                  running: 4
                  medianMs: 94210
                  p90Ms: 241880
                previous:
                  total: 388
                  passed: 340
                  failed: 45
                  running: 0
                runningNow:
                  sessions: 4
                  devices: 4
        '400':
          description: '`since` is not a date.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: invalid_since
                message: since must be an ISO 8601 date
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/session/{sessionId}:
    get:
      operationId: getSession
      summary: Get one session
      description: >-
        Returns one session's stored record, with who ran it (`owner`) and where (`ranOn`), as the
        list gives it. A session the caller may not see answers exactly like an unknown id: `404`.
        Any signed-in user (role `MEMBER` or above) may call it.
      tags:
        - Sessions
      parameters:
        - $ref: '#/components/parameters/SessionsSessionId'
      responses:
        '200':
          description: The session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionsSessionRecord'
              example:
                id: 6f1c2a8e-3b4d-4e5f-9a7b-1c2d3e4f5a6b
                build_id: 9d2f4c1e-7a3b-4e8f-b6c5-2d1e0f9a8b7c
                name: Checkout with saved card
                status: success
                desired_capabilities: '{"platformName":"Android","appium:automationName":"UiAutomator2"}'
                session_capabilities: '{"platformName":"Android","appium:udid":"emulator-5554"}'
                node_id: 3c9a1f20-8d4e-4b7a-a1c2-5e6f7a8b9c0d
                has_live_video: true
                video_recording_enabled: true
                video_recording: 6f1c2a8e-3b4d-4e5f-9a7b-1c2d3e4f5a6b.mp4
                startTime: '2026-10-03T14:20:11.004Z'
                endTime: '2026-10-03T14:21:45.214Z'
                failure_reason: null
                is_profiling_available: false
                device_udid: emulator-5554
                device_platform: android
                device_version: '14'
                device_name: Pixel 7
                createdAt: '2026-10-03T14:20:11.004Z'
                updatedAt: '2026-10-03T14:21:45.400Z'
                user_id: 5b8e2c14-0f3a-4d6b-9e7c-1a2b3c4d5e6f
                owner:
                  name: Priya Raman
                  email: priya@example.com
                ranOn: here
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/SessionsSessionNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/session/{sessionId}/session_log:
    get:
      operationId: listSessionCommands
      summary: List a session's commands
      description: >-
        Every Appium command the session ran, newest first, as stored: the WebDriver request and
        response, its duration, whether it failed, and, for a `findElement` that needed
        self-healing, the original and healed selectors, the healing method and its confidence.
        The whole list in one answer. A session the caller may not see answers `404`, like an
        unknown id. Any signed-in user (role `MEMBER` or above) may call it.
      tags:
        - Sessions
      parameters:
        - $ref: '#/components/parameters/SessionsSessionId'
      responses:
        '200':
          description: The session's commands, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SessionsCommand'
              example:
                - id: a3c5e7f9-1b2d-4f6a-8c0e-2d4f6a8c0e1b
                  session_id: 6f1c2a8e-3b4d-4e5f-9a7b-1c2d3e4f5a6b
                  command_name: findElement
                  url: /session/6f1c2a8e-3b4d-4e5f-9a7b-1c2d3e4f5a6b/element
                  method: POST
                  title: Find element
                  subtitle: 'accessibility id: login-btn'
                  body: '{"using":"accessibility id","value":"login-btn"}'
                  response: '{"element-6066-11e4-a52e-4f735466cecf":"00000000-0000-0011-ffff-ffff0000001c"}'
                  screenshot: null
                  is_success: true
                  is_error: false
                  is_healed: true
                  original_strategy: accessibility id
                  original_selector: login-btn
                  healed_strategy: xpath
                  healed_selector: //android.widget.Button[@text="Log in"]
                  healing_confidence: 0.92
                  healing_tier: Fuzzy XML
                  duration: 1840
                  createdAt: '2026-10-03T14:20:31.512Z'
                  updatedAt: '2026-10-03T14:20:31.512Z'
                  span_id: null
                  trace_id: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/SessionsSessionNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/session/{sessionId}/logs/device:
    get:
      operationId: listSessionDeviceLogs
      summary: List a session's device log lines
      description: >-
        The device log lines (logcat or syslog) stored for the session, oldest first. A session
        the caller may not see answers `404`, like an unknown id. Any signed-in user (role
        `MEMBER` or above) may call it.
      tags:
        - Sessions
      parameters:
        - $ref: '#/components/parameters/SessionsSessionId'
      responses:
        '200':
          description: The device log lines, oldest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SessionsLogLine'
              example:
                - id: 1e2d3c4b-5a69-4788-97a6-b5c4d3e2f1a0
                  session_id: 6f1c2a8e-3b4d-4e5f-9a7b-1c2d3e4f5a6b
                  log_type: DEVICE
                  message: '10-03 14:20:12.345  1234  1250 I ActivityManager: Start proc com.example.shop'
                  timestamp: '2026-10-03T14:20:12.345Z'
                  createdAt: '2026-10-03T14:20:12.401Z'
                  updatedAt: '2026-10-03T14:20:12.401Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/SessionsSessionNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/session/{sessionId}/logs/debug:
    get:
      operationId: listSessionDebugLogs
      summary: List a session's debug log lines
      description: >-
        Xenon's and the driver's debug log lines stored for the session, oldest first. A session
        the caller may not see answers `404`, like an unknown id. Any signed-in user (role
        `MEMBER` or above) may call it.
      tags:
        - Sessions
      parameters:
        - $ref: '#/components/parameters/SessionsSessionId'
      responses:
        '200':
          description: The debug log lines, oldest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SessionsLogLine'
              example:
                - id: 7c6b5a49-3827-4615-8f4e-3d2c1b0a9f8e
                  session_id: 6f1c2a8e-3b4d-4e5f-9a7b-1c2d3e4f5a6b
                  log_type: DEBUG
                  message: '[HealingOrchestrator] findElement healed by Fuzzy XML (0.92)'
                  timestamp: '2026-10-03T14:20:31.510Z'
                  createdAt: '2026-10-03T14:20:31.512Z'
                  updatedAt: '2026-10-03T14:20:31.512Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/SessionsSessionNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/session/{sessionId}/profiling:
    get:
      operationId: listSessionProfiling
      summary: List a session's legacy profiling samples
      description: >-
        The older profiling samples (CPU and memory as text) stored for the session, oldest first.
        Only sessions recorded before version 2.10 have any; newer sessions answer an empty list
        and keep their figures in `GET /api/session/{sessionId}/metrics`. A session the caller may
        not see answers `404`, like an unknown id. Any signed-in user (role `MEMBER` or above) may
        call it.
      tags:
        - Sessions
      parameters:
        - $ref: '#/components/parameters/SessionsSessionId'
      responses:
        '200':
          description: The profiling samples, oldest first; often empty.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SessionsProfilingSample'
              example:
                - id: 1841
                  session_id: 6f1c2a8e-3b4d-4e5f-9a7b-1c2d3e4f5a6b
                  cpu: '12.5'
                  memory: '184320'
                  total_cpu_used: '38.0'
                  total_memory_used: '5120000'
                  raw_cpu_log: null
                  raw_memory_log: null
                  timestamp: '2026-10-03T14:20:15.000Z'
                  createdAt: '2026-10-03T14:20:15.020Z'
                  updatedAt: '2026-10-03T14:20:15.020Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/SessionsSessionNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/session/{sessionId}/metrics:
    get:
      operationId: getSessionMetrics
      summary: Get a session's CPU and memory samples
      description: >-
        The CPU and memory samples recorded for the session every 2 seconds, oldest first, for the
        session page's Performance panel.


        - `series` says what the platform can record: Android has device CPU and memory and the
        app's CPU and memory; an iPhone has device CPU only; any other platform nothing.

        - `recording` is set only while the session runs: `sampling` (being sampled), `stopped`
        (sampling gave up after repeated failures) or `off` (nothing samples it, for example with
        session metrics turned off). It is null once the session has ended.

        - `appId` is the app the newest app figures are for; each sample also names its own `app`,
        since the foreground app can change.


        Samples are written in batches every 10 seconds, so a running session's newest samples can
        be up to 10 seconds behind. A session on a node's device is collected from the node by the
        hub in the same way. A session the caller may not see answers `404`, like an unknown id.
        Any signed-in user (role `MEMBER` or above) may call it.
      tags:
        - Sessions
      parameters:
        - $ref: '#/components/parameters/SessionsSessionId'
      responses:
        '200':
          description: The samples, and what the platform records.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionsMetrics'
              example:
                platform: android
                intervalMs: 2000
                appId: com.example.shop
                series:
                  deviceCpu: true
                  deviceMem: true
                  appCpu: true
                  appMem: true
                recording: sampling
                samples:
                  - t: 1759501213000
                    deviceCpu: 23.4
                    deviceMemMb: 3120.5
                    deviceMemTotalMb: 7680
                    appCpu: 8.1
                    appMemMb: 212.7
                    app: com.example.shop
                  - t: 1759501215000
                    deviceCpu: 31.9
                    deviceMemMb: 3134.2
                    deviceMemTotalMb: 7680
                    appCpu: 14.6
                    appMemMb: 219.3
                    app: com.example.shop
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/SessionsSessionNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/session/{sessionId}/asset/{kind}/{file}:
    get:
      operationId: getSessionAsset
      summary: Download a session's screenshot, video or trace
      description: >-
        Serves one stored file of the session: a command screenshot (`screenshots`), the session
        video (`video`, an mp4 named after the session id) or a performance trace (`performance`).
        The content type follows the file's extension. `Range` requests are honoured, so a video
        can be seeked; an unsatisfiable range answers `416` with no body. Answers carry
        `Cache-Control: private, max-age=300`.


        Session files are served only through this route. A session the caller may not see answers
        `404`, like an unknown id. An unknown `kind`, a `file` that isn't a plain file name (no
        path, no leading dot), or a missing file answers `404` too. Any signed-in user (role
        `MEMBER` or above) may call it.
      tags:
        - Sessions
      parameters:
        - $ref: '#/components/parameters/SessionsSessionId'
        - in: path
          name: kind
          required: true
          schema:
            type: string
            enum:
              - screenshots
              - video
              - performance
          description: Which of the session's folders.
          example: video
        - in: path
          name: file
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9_-][A-Za-z0-9._-]*$'
          description: The file's name within that folder.
          example: 6f1c2a8e-3b4d-4e5f-9a7b-1c2d3e4f5a6b.mp4
        - in: header
          name: Range
          required: false
          schema:
            type: string
          description: A byte range, for seeking in a video.
          example: bytes=0-1048575
      responses:
        '200':
          description: The whole file.
          headers:
            Accept-Ranges:
              schema:
                type: string
                example: bytes
            Cache-Control:
              schema:
                type: string
                example: private, max-age=300
          content:
            video/mp4:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            application/zip:
              schema:
                type: string
                format: binary
            application/octet-stream:
              schema:
                type: string
                format: binary
        '206':
          description: The requested byte range.
          headers:
            Content-Range:
              schema:
                type: string
                example: bytes 0-1048575/48211967
          content:
            video/mp4:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: >-
            The session is unknown or hidden (the session's not-found answer), or the file isn't
            there.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                file:
                  value:
                    error: true
                    message: Session asset not found
                session:
                  value:
                    error: true
                    message: Session with id 6f1c2a8e-3b4d-4e5f-9a7b-1c2d3e4f5a6b not found
        '416':
          description: The requested range is outside the file. No body.
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/session/{sessionId}/live_video:
    get:
      operationId: streamSessionLiveVideo
      summary: Stream a running session's live video
      description: >-
        An MJPEG stream (`multipart/x-mixed-replace`) of a running session's screen, relayed from
        the driver's MJPEG server. One upstream connection is shared by every viewer of the
        session. It works only for a session this server is driving right now and whose driver
        offers an MJPEG port; otherwise it answers `500`. `503` (plain text) means the upstream
        didn't start sending in time.


        A session the caller may not see answers `404`, like an unknown id. Any signed-in user
        (role `MEMBER` or above) may call it.
      tags:
        - Sessions
      parameters:
        - $ref: '#/components/parameters/SessionsSessionId'
      responses:
        '200':
          description: The MJPEG stream; it lasts as long as the viewer stays connected.
          content:
            multipart/x-mixed-replace:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/SessionsSessionNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          description: The session isn't running here, or has no live video.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: true
                message: Live video not available for session with id 6f1c2a8e-3b4d-4e5f-9a7b-1c2d3e4f5a6b
        '503':
          description: The upstream video source wasn't available in time.
          content:
            text/plain:
              schema:
                type: string
              example: '[MjpegProxy] Source not available after timeout'
  /api/sessions/active:
    get:
      operationId: listActiveSessions
      summary: List the sessions this server is running
      description: >-
        The sessions this server holds in memory right now: its own local sessions, and on a hub
        the sessions it routes to nodes (`remote`) or cloud providers (`cloud`). `sessions` is
        filtered to the devices the caller may see; a session whose device has no row is left out
        for a member. `stats` counts every session on the server, whatever the caller may see.
        Any signed-in user (role `MEMBER` or above) may call it.
      tags:
        - Sessions
      responses:
        '200':
          description: The server's live sessions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionsActiveList'
              example:
                stats:
                  total: 3
                  byType:
                    local: 2
                    remote: 1
                    cloud: 0
                sessions:
                  - id: 6f1c2a8e-3b4d-4e5f-9a7b-1c2d3e4f5a6b
                    type: local
                    deviceUdid: emulator-5554
                    deviceName: Pixel 7
                    platform: android
                  - id: 0b7e4d21-55c6-4c0b-8f0e-6a1d9c3b2e10
                    type: remote
                    deviceUdid: 00008110-00084CE80E51401E
                    deviceName: iPhone 14 Pro
                    platform: ios
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
