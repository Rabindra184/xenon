  /api/healing/selectors:
    get:
      operationId: listSelectorHealth
      summary: List one tab of Selector Health
      description: >-
        One page of the Selector Health list, the four tab counts, and whether the caller may act
        (`canAct`: the `sessions` or `admin` scope).


        - `fix` (To fix): the period's heals grouped by strategy and selector, every heal counted,
        leaving out selectors being verified, fixed or muted. `platform`, `method` and `sort`
        apply here only.

        - `verifying`, `fixed` and `muted`: the selectors with that status, newest change first,
        with their heals in the period. `fixed` lists those verified within the period.


        Only selectors healed, at any time, in a session the caller may see are listed. `counts`
        follow the period, not the search or filters. `q` is compared as plain text (`%` and `_`
        have no special meaning) against the selector and, on `fix`, its suggested fix. A page
        past the end answers the last page. A value that can't be read falls back to its default.
        Any signed-in user (role `MEMBER` or above) may call it.
      tags:
        - Selector Health
      parameters:
        - in: query
          name: tab
          schema:
            type: string
            enum:
              - fix
              - verifying
              - fixed
              - muted
            default: fix
          example: fix
        - in: query
          name: days
          schema:
            type: integer
            minimum: 1
            maximum: 365
            default: 30
          description: The period, in days back from now; clamped to 1–365.
          example: 30
        - in: query
          name: q
          schema:
            type: string
            maxLength: 200
          description: Text in the selector or, on `fix`, in its suggested fix; case-insensitive.
          example: login
        - in: query
          name: platform
          schema:
            type: string
          description: On `fix`, only heals in sessions on this platform.
          example: android
        - in: query
          name: method
          schema:
            type: string
          description: On `fix`, only heals by this healing method.
          example: LLM
        - in: query
          name: sort
          schema:
            type: string
            enum:
              - heals
              - recent
              - time
            default: heals
          description: On `fix`, most heals, most recent heal, or most time spent first.
          example: heals
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            maximum: 100000
            default: 1
          example: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
          example: 50
      responses:
