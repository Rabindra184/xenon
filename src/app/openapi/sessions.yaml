  /api/healing/state/{strategy}/{value}:
    get:
      operationId: getSelectorStateRow
      summary: Get one selector's stored status
      description: >-
        The selector's stored status row, or `{ "state": null }` when it has none (the selector is
        active). The row is lab-wide and answers the same for every caller; there is no `404`.


        Encode both segments with `encodeURIComponent`. The server decodes each segment once more
        after routing, so a strategy or selector containing `%` must be encoded twice (`%` as
        `%2525`); a lone `%` after the first decoding leaves the request unanswered. A selector
        recorded with an empty strategy can't be looked up here. Any signed-in user (role `MEMBER`
        or above) may call it.
      tags:
        - Selector Health
      parameters:
        - in: path
          name: strategy
          required: true
          schema:
            type: string
          description: The original strategy, URL-encoded.
          example: accessibility%20id
        - in: path
          name: value
          required: true
          schema:
            type: string
          description: The original selector, URL-encoded.
          example: login-btn
      responses:
        '200':
          description: The row, or null.
          content:
            application/json:
              schema:
                type: object
                properties:
                  state:
                    allOf:
                      - $ref: '#/components/schemas/SelectorHealthStateRow'
                    nullable: true
              example:
                state:
                  id: 2a4c6e80-1b3d-4f5a-9c7e-0d2f4a6c8e1b
                  original_strategy: accessibility id
                  original_selector: login-btn
                  status: resolved
                  fixed_at: '2026-09-28T10:00:00.000Z'
                  fixed_by_api_key: ''
                  resolved_at: '2026-10-01T02:50:00.000Z'
                  muted_at: null
                  muted_by_api_key: null
                  regression_count: 0
                  clean_builds_count: 3
                  last_event_at: '2026-10-01T02:50:00.000Z'
                  createdAt: '2026-09-28T10:00:00.000Z'
                  updatedAt: '2026-10-01T02:50:00.000Z'
        '401':
