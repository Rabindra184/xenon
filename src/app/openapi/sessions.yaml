          nullable: true
        is_error:
          type: boolean
        is_healed:
          type: boolean
        original_strategy:
          type: string
          nullable: true
        original_selector:
          type: string
          nullable: true
        healed_strategy:
          type: string
          nullable: true
        healed_selector:
          type: string
          nullable: true
        healing_confidence:
          type: number
          nullable: true
        healing_tier:
          type: string
          nullable: true
          description: The healing method that found it.
        duration:
          type: integer
          nullable: true
          description: Milliseconds.
        span_id:
          type: string
          nullable: true
        trace_id:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SessionsLogLine:
