            type: integer
            minimum: 1
            maximum: 200
            default: 50
          description: How many selectors; clamped to 1–200.
          example: 25
        - in: query
          name: appId
          schema:
            type: string
          description: Accepted for compatibility and ignored.
          example: com.example.shop
