        days, most heals first, whatever their lifecycle state, each with its state and, when the
        selector's stored element fingerprint has the same strategy, `etalonAge` (milliseconds
        since that fingerprint was last seen). Built from the 1000 most-healed selectors of the
        newest 5000 heals, so a rarely healed selector may be missing; that is not an error. Only
        heals in sessions the caller may see count. Any signed-in user (role `MEMBER` or above)
        may call it.
