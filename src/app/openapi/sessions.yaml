  /api/sessions/{sessionId}/bug-report:
    post:
      operationId: createSessionBugReport
      summary: Download a bug report bundle for a session
      description: >-
        Builds a zip for a session and streams it as a download. The zip holds `manifest.json`
        (session, device, capabilities, last command, the time window and any warnings),
        `README.md` and `logs.txt`, plus `video.mp4`, `network.har` and `ai-summary.txt` when the
        session has them.


        - `mode=slice` covers only the last `windowSec` seconds of the session (5 to 600, default
        60), video and logs included.

        - `mode=full` covers the whole session; `windowSec` is ignored.


        When the download finishes, dashboards that can see the session's device get a
        `bug report generated` live event. A session the caller may not see answers `404`, like
        an unknown one. Any signed-in user (role `MEMBER` or above) may call it. With the dashboard
        cookie, the request needs a same-host `Origin` or `Referer`.
      tags:
        - Sessions
      parameters:
        - in: path
          name: sessionId
          required: true
          schema:
            type: string
          description: The Appium session id.
          example: 6f1c2a8e-3b4d-4e5f-9a7b-1c2d3e4f5a6b
        - in: query
          name: mode
          required: true
          schema:
            type: string
            enum:
              - slice
              - full
          description: The last few seconds, or the whole session.
          example: slice
        - in: query
          name: windowSec
          required: false
          schema:
            type: number
            minimum: 5
            maximum: 600
            default: 60
          description: With `mode=slice`, how many seconds before the session's end to cover.
          example: 120
      responses:
        '200':
          description: >-
            The zip, as an attachment named `bugreport-<sessionId>-<generatedAt>.zip`.
          headers:
            Content-Disposition:
              schema:
                type: string
                example: attachment; filename="bugreport-6f1c2a8e-3b4d-4e5f-9a7b-1c2d3e4f5a6b-2026-10-03T14-30-02-114Z.zip"
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '400':
          description: '`mode` is missing or unknown, or `windowSec` is out of range.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                mode:
                  value:
                    error: mode must be "slice" or "full"
                windowSec:
                  value:
                    error: windowSec must be between 5 and 600
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The session is unknown, or one the caller may not see.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Session 6f1c2a8e-3b4d-4e5f-9a7b-1c2d3e4f5a6b not found
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          description: The bundle couldn't be assembled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: 'ENOENT: no such file or directory'
  /api/build:
    get:
      operationId: listBuilds
      summary: List builds
      description: >-
        Lists builds, newest first, with their session counts by outcome. Builds are shared by
        name, so one build can hold several teams' sessions: a member sees a build only if at
        least one of its sessions is visible to them, and its counts cover those sessions only.
        An admin sees every build and every session. `success`, `passed` and `ended` count as
        passed; `failed`, `error` and `timeout` as failed. Any signed-in user (role `MEMBER` or
        above) may call it.
      tags:
        - Builds
      responses:
        '200':
          description: The builds, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SessionsBuildRecord'
              example:
                - id: 9d2f4c1e-7a3b-4e8f-b6c5-2d1e0f9a8b7c
                  name: nightly-2026-10-03
                  createdAt: '2026-10-03T02:00:04.881Z'
                  updatedAt: '2026-10-03T02:00:04.881Z'
                  _count:
                    sessions: 48
                  sessionCount: 48
                  passedCount: 44
                  failedCount: 3
                  runningCount: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/build/{buildId}/export:
    post:
      operationId: exportBuildSessions
      summary: Export a build's sessions as JSON or CSV
      description: >-
        Downloads up to 5000 of the build's sessions, newest first, as a JSON array of stored
        session records or as CSV with the columns `id`, `build_id`, `status`,
        `failure_category`, `failure_reason`, `device_platform`, `device_version`, `device_name`,
        `node_id`, `startTime`, `endTime` and `name` (dates in ISO 8601). Give `sessionIds` to
        export only those sessions of the build.


        A member gets only the sessions on devices of their teams or the shared pool; a session
        whose device no longer has a row is left out. An unknown build, or one with no visible
        sessions, gives an empty export rather than `404`. Any signed-in user (role `MEMBER` or
        above) may call it. With the dashboard cookie, the request needs a same-host `Origin` or
        `Referer`.
      tags:
        - Builds
      parameters:
        - in: path
          name: buildId
          required: true
          schema:
            type: string
          description: The build's id.
          example: 9d2f4c1e-7a3b-4e8f-b6c5-2d1e0f9a8b7c
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                format:
                  type: string
                  enum:
                    - json
                    - csv
                  default: json
                sessionIds:
                  type: array
                  maxItems: 5000
                  items:
                    type: string
                  description: Only these sessions of the build. An empty list means all of them.
            example:
              format: csv
              sessionIds:
                - 6f1c2a8e-3b4d-4e5f-9a7b-1c2d3e4f5a6b
                - 0b7e4d21-55c6-4c0b-8f0e-6a1d9c3b2e10
      responses:
        '200':
          description: >-
            The export, as an attachment named `build-<buildId>-sessions.json` or
            `build-<buildId>-sessions.csv`.
          headers:
            Content-Disposition:
              schema:
                type: string
                example: attachment; filename="build-9d2f4c1e-7a3b-4e8f-b6c5-2d1e0f9a8b7c-sessions.csv"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Session'
            text/csv:
              schema:
                type: string
              example: |
                id,build_id,status,failure_category,failure_reason,device_platform,device_version,device_name,node_id,startTime,endTime,name
                6f1c2a8e-3b4d-4e5f-9a7b-1c2d3e4f5a6b,9d2f4c1e-7a3b-4e8f-b6c5-2d1e0f9a8b7c,failed,element_not_found,"NoSuchElementError: An element could not be located",android,14,Pixel 7,3c9a1f20-8d4e-4b7a-a1c2-5e6f7a8b9c0d,2026-10-03T14:20:11.004Z,2026-10-03T14:22:05.120Z,Checkout with saved card
        '400':
          description: '`format` is neither `json` nor `csv`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: format must be 'json' or 'csv'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          description: More than 5000 `sessionIds`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: sessionIds too large (max 5000)
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/logs/requests:
    get:
      operationId: listInternalRequestLogs
      summary: List Xenon's recent outgoing HTTP calls
      description: >-
        The newest of the last 500 HTTP calls this server made itself (to nodes, drivers and other
        services), newest first, with statistics over all 500. Bodies have secrets redacted, long
        strings and arrays truncated. The log holds every internal call, including device control
        forwarded to nodes (with what was typed) and forwarded new sessions, so it needs role
        `ADMIN` and the `admin` scope. It lives in memory and is lost on restart.
      tags:
        - Admin
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            default: 50
          description: How many calls to return; the buffer holds at most 500.
          example: 100
        - in: query
          name: method
          schema:
            type: string
          description: Only calls with exactly this method (case-sensitive), for example `POST`.
          example: POST
        - in: query
          name: url
          schema:
            type: string
          description: Only calls whose URL contains this text.
          example: /wd/hub/session
        - in: query
          name: hasError
          schema:
            type: string
            enum:
              - 'true'
              - 'false'
          description: '`true` for only failed calls, `false` for only calls without an error.'
          example: 'true'
      responses:
        '200':
          description: The calls and the buffer's statistics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionsRequestLogList'
              example:
                stats:
                  totalLogged: 500
                  errorCount: 7
                  avgDurationMs: 84
                  byMethod:
                    GET: 311
                    POST: 182
                    DELETE: 7
                  byStatusCode:
                    '200': 486
                    '404': 7
                logs:
                  - timestamp: '2026-10-03T14:30:02.114Z'
                    direction: outgoing
                    method: POST
                    url: http://192.168.1.21:4723/wd/hub/session/0b7e4d21-55c6-4c0b-8f0e-6a1d9c3b2e10/element
                    requestBody: '{"using":"accessibility id","value":"login-btn"}'
                    responseBody: '{"value":{"error":"no such element"}}'
                    statusCode: 404
                    durationMs: 212
                    error: Request failed with status code 404
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
