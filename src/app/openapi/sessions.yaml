    SessionsActiveList:
      type: object
      properties:
        stats:
          type: object
          description: Every session on this server, whatever the caller may see.
          properties:
            total:
              type: integer
            byType:
              type: object
              properties:
                local:
                  type: integer
                remote:
                  type: integer
                cloud:
                  type: integer
        sessions:
          type: array
          items:
            type: object
            properties:
