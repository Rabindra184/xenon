  /api/healing/selector/state:
    post:
      operationId: changeSelectorState
      summary: Mark a selector fixed, mute it or undo either
      description: >-
        Changes a selector's lab-wide status and records who did it (and, for a mute, why):

        - `mark_fixed`: starts verification (status `pending`), resetting its clean-build count.
        Refused with `409` on a muted selector.

        - `mute`: status `muted`. Muting again refreshes the time and records the new reason.

        - `unmute`: back to `active`, or the status row is removed when the selector has no other
        history (`state: null`). On a selector that isn't muted it changes nothing and answers its
        current row.

        - `cancel_verification`: undoes `mark_fixed` while it is `pending`; refused with `409`
        otherwise. The row is removed when there is no other history.


        Dashboards are told of every change at once. Needs role `MEMBER` and the `sessions` scope
        (`admin` has it). The selector must have healed in a session the caller may see;
        otherwise `404`, as for an unknown one. With the dashboard cookie, the request needs a
        same-host `Origin` or `Referer`.
      tags:
        - Selector Health
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - original_strategy
                - original_selector
                - action
              properties:
                original_strategy:
                  type: string
                  description: The strategy; may be empty for heals recorded with no strategy.
                original_selector:
                  type: string
                  minLength: 1
                action:
                  type: string
                  enum:
                    - mark_fixed
                    - mute
                    - unmute
                    - cancel_verification
                reason:
                  type: string
                  nullable: true
                  maxLength: 500
                  description: Why it is muted. Kept for `mute` only, trimmed.
            example:
              original_strategy: accessibility id
              original_selector: login-btn
              action: mute
              reason: Login screen is being redesigned; selector changes next sprint
      responses:
        '200':
          description: >-
            The selector's stored status row after the change, or null when it was removed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  state:
                    allOf:
                      - $ref: '#/components/schemas/SelectorHealthStateRow'
                    nullable: true
              example:
                state:
                  id: 2a4c6e80-1b3d-4f5a-9c7e-0d2f4a6c8e1b
                  original_strategy: accessibility id
                  original_selector: login-btn
                  status: muted
                  fixed_at: null
                  fixed_by_api_key: null
                  resolved_at: null
                  muted_at: '2026-10-04T09:02:41.330Z'
                  muted_by_api_key: ''
                  regression_count: 0
                  clean_builds_count: 0
                  last_event_at: '2026-10-04T09:02:41.330Z'
                  createdAt: '2026-10-04T09:02:41.330Z'
                  updatedAt: '2026-10-04T09:02:41.330Z'
        '400':
          description: A field is missing, the action is unknown, or the reason is too long.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missing:
                  value:
                    error: original_strategy, original_selector, and action are required
                action:
                  value:
                    error: action must be one of mark_fixed, mute, unmute, cancel_verification
                reason:
                  value:
                    error: reason must be text of at most 500 characters
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/SelectorHealthNotFound'
        '409':
          description: The action doesn't fit the selector's current status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Cannot markFixed on a muted selector (accessibility id=login-btn)
                currentStatus: muted
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          description: The change couldn't be saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: internal
