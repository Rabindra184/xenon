                  verifying: 2
                  fixed: 3
                  muted: 1
                items:
                  - strategy: accessibility id
                    selector: login-btn
                    heals: 41
                    sessions: 29
                    lastHealedAt: '2026-10-03T14:20:31.512Z'
                    timeSpentMs: 75440
