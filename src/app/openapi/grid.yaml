paths:
  /api/devices:
    get:
      operationId: listGridDevices
      summary: List the devices in the lab
      description: |
        Every device this server knows: its own phones and, on a hub, the
        phones its nodes report. Each row carries `teamName`, the name of
        its team (null for the shared pool).

        Needs role `MEMBER` or above; no scope is checked. A member sees the
        shared pool and their teams' devices only. An admin, or any caller
        on a server with auth disabled, sees every device.

        With `sessionId`, the answer is the one visible device whose
        `session_id` is that value, as an object, or an empty `200` body
        when there is none. When the Appium dashboard plugin is installed,
        each row in the list also gets `dashboard_link` and
        `total_session_count`. Xenon reaches the plugin on this server's own
        address and port, and the link is `<XENON_PUBLIC_URL>/dashboard?…`,
        or `/dashboard?…` on the server the caller has open when
        `XENON_PUBLIC_URL` isn't set. Through 2.14 both were built from the
        `Host` header of the first request after startup, signed in or not.

        `GET /api/device` is the same endpoint.
      tags:
        - Devices
      parameters:
        - $ref: '#/components/parameters/GridSessionIdQuery'
      responses:
        '200':
          $ref: '#/components/responses/GridDeviceListOk'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/device:
    get:
      operationId: listGridDevicesAlias
      summary: List the devices in the lab (alias)
      description: |
        The same as `GET /api/devices`: every device the caller may see,
        with `teamName`, or with `sessionId` the one device running that
        session. Needs role `MEMBER` or above. A member sees the shared pool
        and their teams' devices only.
      tags:
        - Devices
      parameters:
        - $ref: '#/components/parameters/GridSessionIdQuery'
      responses:
        '200':
          $ref: '#/components/responses/GridDeviceListOk'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/device/{platform}:
    get:
      operationId: listGridDevicesByPlatform
      summary: List the devices of one platform
      description: |
        The devices of one platform, filtered like `GET /api/devices`: a
        member sees the shared pool and their teams' devices only. Each row
        carries `teamName`. Needs role `MEMBER` or above.

        `platform` is matched case-insensitively. Any other value than
        `ios` or `android` answers `200` with an empty list, not an error.
        `booted` keeps only devices whose `state` is `Booted` (simulators):
        any value turns it on, `booted=false` included.
      tags:
        - Devices
      parameters:
        - in: path
          name: platform
          required: true
          description: The platform, `ios` or `android` (any letter case).
          schema:
            type: string
            example: android
        - in: query
          name: deviceType
          required: false
          description: Keep only devices of this type.
          schema:
            type: string
            enum:
              - real
              - simulator
              - emulator
        - in: query
          name: booted
          required: false
          description: Present (with any value) to keep only devices whose `state` is `Booted`.
          schema:
            type: string
            example: 'true'
      responses:
        '200':
          description: The matching devices; empty for an unknown platform.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GridDevice'
              example:
                - udid: emulator-5554
                  name: Pixel 7 API 34
                  platform: android
                  host: http://192.168.1.100:4723
                  nodeId: 6b1e4c2a-8f3d-4a9e-b7c5-2d0f1e8a9b3c
                  busy: false
                  session_id: null
                  state: device
                  sdk: '14'
                  deviceType: emulator
                  realDevice: false
                  offline: false
                  userBlocked: false
                  teamId: null
                  teamName: null
                  tags:
                    - lab-row-3
                  reservedBy: null
                  reservedByUserId: null
                  reservedUntil: null
                  healthStatus: Healthy
                  batteryLevel: 100
                  screenWidth: '1080'
                  screenHeight: '2400'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/block:
    post:
      operationId: blockGridDevice
      summary: Block a device for maintenance
      description: |
        Sets `userBlocked` on a device, so no new session or lease is
        allocated to it. A session already running on it is not affected,
        and neither is `busy`. The device stays blocked when it disconnects
        and comes back, through restarts too.

        Send both `udid` and `host`, exactly as `GET /api/devices` shows
        them: the device is the row of that udid on that host. Without
        either, `400`; with no such row, `404`. Through 2.12 the body was a
        device filter, so an empty body blocked the first device in the
        list, and a udid alone either row of a udid two nodes report
        (emulators).

        Needs role `ADMIN` and the `devices` scope.
      tags:
        - Devices
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GridDeviceSelector'
            example:
              udid: emulator-5554
              host: http://192.168.1.100:4723
      responses:
        '200':
          description: The device is blocked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
              example:
                success: true
        '400':
          $ref: '#/components/responses/GridDeviceSelectorMissing'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/GridDeviceNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          description: The device could not be updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                success: false
                error: Failed to block device
  /api/unblock:
    post:
      operationId: unblockGridDevice
      summary: Unblock a device
      description: |
        Clears `userBlocked`, so the device can be allocated again. Send
        both `udid` and `host`, as for `POST /api/block`: without either,
        `400`; with no such row, `404`.

        Needs role `ADMIN` and the `devices` scope.
      tags:
        - Devices
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GridDeviceSelector'
            example:
              udid: 00008110-00084CE80E51401E
              host: http://192.168.1.101:4723
      responses:
        '200':
          description: The device is unblocked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
              example:
                success: true
        '400':
          $ref: '#/components/responses/GridDeviceSelectorMissing'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/GridDeviceNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          description: The device could not be updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                success: false
                error: Failed to unblock device
  /api/device/tags:
    post:
      operationId: setGridDeviceTags
      summary: Replace a device's tags
      description: |
        Replaces the device's tag list with `tags` (it doesn't append). Tags
        are free-form labels, such as `flaky` or `lab-row-3`, that a lease
        can filter on. The row is chosen by exact `udid` and `host`; a pair
        that names no device is `404` (through 2.13 it changed nothing and
        answered `200`). The device keeps its tags when it disconnects and
        comes back, through restarts too.

        Needs role `ADMIN` and the `devices` scope.
      tags:
        - Devices
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - udid
                - host
                - tags
              properties:
                udid:
                  type: string
                  example: emulator-5554
                host:
                  type: string
                  description: The device's host, exactly as `GET /api/devices` shows it.
                  example: http://192.168.1.100:4723
                tags:
                  type: array
                  items:
                    type: string
                  example:
                    - flaky
                    - lab-row-3
      responses:
        '200':
          description: The tags were written.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
              example:
                success: true
        '400':
          description: '`udid` or `host` is missing, or `tags` is not an array.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Missing udid, host, or tags array
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No device of that udid on that host.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Device not found
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/device/{udid}/team:
    put:
      operationId: assignGridDeviceTeam
      summary: Assign a device to a team
      description: |
        Gives the device to a team, or with `teamId: null` returns it to the
        shared pool, which every member sees. A missing `teamId` counts as
        null. Every device with this udid changes (on a hub, each node that
        reports it), and allocation and live dashboard events follow the new
        team at once.

        A device keeps its team when it disconnects and comes back, through
        restarts too, and this also moves one of this udid that isn't
        connected now: a team that one belongs to can't be deleted.

        Needs role `ADMIN` and the `admin` scope.
      tags:
        - Devices
      parameters:
        - in: path
          name: udid
          required: true
          description: The device's udid.
          schema:
            type: string
            example: 00008110-00084CE80E51401E
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                teamId:
                  type: string
                  nullable: true
                  description: The team's id, or null for the shared pool.
                  example: clx9k2v0a0000qz8r4h7m3n2p
      responses:
        '200':
          description: The device's team changed. `updated` is how many devices changed, connected or not.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  updated:
                    type: integer
              example:
                ok: true
                updated: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The team or the device doesn't exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                team:
                  value:
                    error: team not found
                device:
                  value:
                    error: device not found
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/reservation:
    get:
      operationId: listGridReservations
      summary: List the current reservations
      description: |
        The devices reserved right now (an expired reservation isn't
        listed), with the time left. A member sees only reservations on the
        shared pool and their teams' devices; an admin sees all.

        Needs role `MEMBER` or above. Reservations are deprecated in favour
        of leases (`POST /api/sdk/leases`): every answer carries
        `Deprecation`, `Sunset` and `Link` headers.
      tags:
        - Reservations
      responses:
        '200':
          description: The current reservations.
          headers:
            Deprecation:
              $ref: '#/components/headers/GridDeprecation'
            Sunset:
              $ref: '#/components/headers/GridSunset'
            Link:
              $ref: '#/components/headers/GridLink'
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  reservations:
                    type: array
                    items:
                      $ref: '#/components/schemas/GridReservation'
              example:
                success: true
                reservations:
                  - udid: emulator-5554
                    host: http://192.168.1.100:4723
                    name: Pixel 7 API 34
                    platform: android
                    reservedBy: priya
                    reservedUntil: 1791118800000
                    reservationReason: Manual checkout regression
                    remainingMs: 5400000
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/GridReservationFailed'
    post:
      operationId: createGridReservation
      summary: Reserve a device
      description: |
        Marks a device as reserved by `reservedBy` until now plus
        `duration`. `reservedBy` is the name shown on the device; the
        reservation also records the signed-in user who took it
        (`reservedByUserId`), who alone, or an admin, may release or extend
        it. A device already reserved by someone else, or running an Appium
        session, is refused with `409`. The same user under the same
        `reservedBy` may reserve it again, which restarts the clock. The
        reservation lasts until it ends even if the device disconnects or
        the server restarts meanwhile; one that ended while the device was
        away is not brought back.

        The device is the row of `udid` on `host`, so send both exactly as
        `GET /api/devices` shows them. No such row, or a device outside the
        caller's teams, answers `404`, as an unknown one.

        Needs role `MEMBER` or above and the `devices` scope. Deprecated in
        favour of leases: every answer carries `Deprecation`, `Sunset` and
        `Link` headers.
      tags:
        - Reservations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - udid
                - host
                - reservedBy
                - duration
              properties:
                udid:
                  type: string
                  example: emulator-5554
                host:
                  type: string
                  example: http://192.168.1.100:4723
                reservedBy:
                  type: string
                  description: Who the reservation is for, as free text.
                  example: priya
                duration:
                  $ref: '#/components/schemas/GridReservationDuration'
                reason:
                  type: string
                  example: Manual checkout regression
            example:
              udid: emulator-5554
              host: http://192.168.1.100:4723
              reservedBy: priya
              duration: 2h
              reason: Manual checkout regression
      responses:
        '200':
          description: The device is reserved.
          headers:
            Deprecation:
              $ref: '#/components/headers/GridDeprecation'
            Sunset:
              $ref: '#/components/headers/GridSunset'
            Link:
              $ref: '#/components/headers/GridLink'
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  reservation:
                    type: object
                    properties:
                      udid:
                        type: string
                      host:
                        type: string
                      reservedBy:
                        type: string
                      reservedUntil:
                        type: integer
                        description: Epoch milliseconds.
                      reservationReason:
                        type: string
                      expiresAt:
                        type: string
                        format: date-time
              example:
                success: true
                message: Device emulator-5554 reserved for priya
                reservation:
                  udid: emulator-5554
                  host: http://192.168.1.100:4723
                  reservedBy: priya
                  reservedUntil: 1791118800000
                  reservationReason: Manual checkout regression
                  expiresAt: '2026-10-04T15:00:00.000Z'
        '400':
          description: A field is missing, or `duration` is invalid or outside 1 minute to 24 hours.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missing:
                  value:
                    success: false
                    error: 'Missing required fields: udid, host, reservedBy, duration'
                duration:
                  value:
                    success: false
                    error: duration must be between 60000ms (1 minute) and 86400000ms (24 hours)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/GridDeviceNotFound'
        '409':
          description: Reserved by someone else, or running an Appium session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                reserved:
                  value:
                    success: false
                    error: Device is already reserved by marco until 2026-10-04T15:00:00.000Z
                busy:
                  value:
                    success: false
                    error: Device is currently busy with an Appium session. Cannot reserve.
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/GridReservationFailed'
  /api/reservation/{udid}/{host}:
    delete:
      operationId: releaseGridReservation
      summary: Release a reservation
      description: |
        Ends the device's reservation at once. Only the user who took it,
        or an admin, may: anyone else gets `403 not_reservation_holder`. A
        reservation taken before 2.13 records no user, and anyone who may
        reserve may still release it. A device outside the caller's teams
        answers `404`.

        `host` is URL-encoded (`http%3A%2F%2F192.168.1.100%3A4723`). The
        device is the row of `udid` on that `host`; no such row answers
        `404`.

        Needs role `MEMBER` or above and the `devices` scope. Deprecated in
        favour of leases.
      tags:
        - Reservations
      parameters:
        - $ref: '#/components/parameters/GridReservationUdid'
        - $ref: '#/components/parameters/GridReservationHost'
      responses:
        '200':
          description: The reservation is released.
          headers:
            Deprecation:
              $ref: '#/components/headers/GridDeprecation'
            Sunset:
              $ref: '#/components/headers/GridSunset'
            Link:
              $ref: '#/components/headers/GridLink'
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
              example:
                success: true
                message: Reservation released for device emulator-5554
        '400':
          $ref: '#/components/responses/GridNotReserved'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: >-
            The caller isn't the user who took the reservation, nor an admin; or lacks the
            role or scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notHolder:
                  summary: Someone else's reservation
                  value:
                    success: false
                    error: not_reservation_holder
                    message: >-
                      Only the person who reserved this device, or an admin, can change the
                      reservation.
                scope:
                  summary: Role or scope missing
                  value:
                    error: insufficient scope
        '404':
          $ref: '#/components/responses/GridDeviceNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/GridReservationFailed'
  /api/reservation/{udid}/{host}/extend:
    post:
      operationId: extendGridReservation
      summary: Extend a reservation
      description: |
        Adds `duration` (at least 1 minute) to the current reservation's
        end, keeping who holds it, its `reservedBy` and its reason. As with
        a new reservation, it may end at most 24 hours from now. Only the
        user who took it, or an admin, may extend it, as for releasing. A
        device outside the caller's teams answers `404`.

        `host` is URL-encoded, as for releasing. Needs role `MEMBER` or
        above and the `devices` scope. Deprecated in favour of leases.
      tags:
        - Reservations
      parameters:
        - $ref: '#/components/parameters/GridReservationUdid'
        - $ref: '#/components/parameters/GridReservationHost'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - duration
              properties:
                duration:
                  $ref: '#/components/schemas/GridReservationDuration'
            example:
              duration: 1h
      responses:
        '200':
          description: The reservation is extended.
          headers:
            Deprecation:
              $ref: '#/components/headers/GridDeprecation'
            Sunset:
              $ref: '#/components/headers/GridSunset'
            Link:
              $ref: '#/components/headers/GridLink'
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  newExpiresAt:
                    type: string
                    format: date-time
              example:
                success: true
                message: Reservation extended for device emulator-5554
                newExpiresAt: '2026-10-04T16:00:00.000Z'
        '400':
          description: >-
            The device isn't reserved, or `duration` is invalid, under a minute, or would end the
            reservation more than 24 hours from now.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notReserved:
                  value:
                    success: false
                    error: Device is not reserved
                duration:
                  value:
                    success: false
                    error: 'Invalid duration. Use: 1h, 2h, 4h, 8h or a number in milliseconds'
                tooShort:
                  value:
                    success: false
                    error: duration must be at least 60000ms (1 minute)
                tooLong:
                  value:
                    success: false
                    error: A reservation can end at most 24 hours from now
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: >-
            The caller isn't the user who took the reservation, nor an admin; or lacks the
            role or scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notHolder:
                  summary: Someone else's reservation
                  value:
                    success: false
                    error: not_reservation_holder
                    message: >-
                      Only the person who reserved this device, or an admin, can change the
                      reservation.
                scope:
                  summary: Role or scope missing
                  value:
                    error: insufficient scope
        '404':
          $ref: '#/components/responses/GridDeviceNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/GridReservationFailed'
  /api/sdk/leases:
    post:
      operationId: createGridLease
      summary: Lease a device, or several as one lease
      description: |
        Claims a free device that matches `filters` for `durationMs`, for a
        programmatic client such as an SDK or MCP tool. The device is marked
        busy, ports for the Appium driver are reserved on the server it is
        attached to, and the answer carries `appiumCapabilities`: pass them
        to `POST /session` unchanged. They include `xe:options.leaseId` and
        `xe:options.leaseToken`, which prove the session holds the lease.

        **Several phones as one lease.** Send `members` instead of
        `filters`: 1 to 8 members, each with the `filters` a lease takes.
        One phone fills one member, and the lease gets every member's phone
        or none. It has one token, one heartbeat and one end. Each member's
        `appiumCapabilities` also carry `xe:options.leaseMember`, its index.
        `filters` is a lease of one member; send one or the other, never
        both.

        **Waiting.** `waitMs` 0 (the default) tries once: `201` or `409`, as
        a lease always did. Up to 3600000 (60 minutes) joins the queue when
        the phones can't all be had now: the answer is `202` with the
        request's `position` and its `leaseToken`, so you can heartbeat to
        keep the place, `GET /api/sdk/leases/{id}` to wait for the grant,
        and `DELETE` to give up. Lease requests are served
        first come, first served: the oldest waiter holds the free phones it
        can use until it has them all, and a later request is granted only
        from phones it can't use.

        `leaseToken` is shown only in this answer and is never stored in
        clear. Keep it: reading, heartbeat, extend and release need it in
        the `x-xenon-lease-token` header.

        The lease ends after three missed heartbeats (every
        `heartbeatSeconds`) or at `expiresAt`, whichever comes first; a
        sweep runs every 30 s. Ending it frees the device unless a session
        still holds it.

        Matching: among the shared pool and the caller's teams (an admin is
        unscoped), the devices that match every filter. `filters.platform`
        is lowercase. `udid`, `deviceType`, `tags` (all must be present),
        `platformVersion` (or `sdk`, the same thing), `minSDK`, `maxSDK`
        and `deviceName` (the device's name, ignoring case) narrow it.
        `404` means no set of devices visible to you, busy or not, could
        fill every member, one each (for one phone: none matches). Of those
        that match, the lease takes one that is free, online, not already
        leased or held for a waiting lease, not blocked, not reserved, and
        not failing its health check, as a new session would; `409` means
        the members can't all be filled from those now. Through 2.12 `sdk`
        and `deviceName` were ignored, blocked, reserved and unhealthy
        devices could be leased, and `404` or `409` depended on the
        platform alone.

        Needs role `MEMBER` or above and the `devices` scope.
      tags:
        - Leases
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GridLeaseCreateRequest'
            examples:
              one:
                summary: One phone
                value:
                  filters:
                    platform: android
                    tags:
                      - lab-row-3
                  durationMs: 1800000
                  heartbeatSeconds: 30
                  reason: nightly checkout suite
                  buildId: build-2026-10-04-nightly
              group:
                summary: Two phones, waiting up to 10 minutes for them
                value:
                  members:
                    - filters:
                        platform: android
                        tags:
                          - sim
                    - filters:
                        platform: ios
                  waitMs: 600000
                  durationMs: 1800000
                  heartbeatSeconds: 30
                  reason: call between two phones
      responses:
        '201':
          description: |
            The lease, granted. Keep `leaseToken`; it is not shown again.
            `members` lists every phone; member 0 also fills `device`,
            `allocatedPorts` and `appiumCapabilities`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GridLease'
              example:
                leaseId: clxa1b2c30000s8k2f9d1e7aa
                leaseToken: 7f3c9a1e5b2d48f0a6c4e8b1d3f5a7c9e2b4d6f8a0c1e3b5d7f9a2c4e6b8d0f1
                device:
                  udid: emulator-5554
                  host: http://192.168.1.100:4723
                  platform: android
                  sdk: '14'
                  name: Pixel 7 API 34
                  screen:
                    width: '1080'
                    height: '2400'
                  realDevice: false
                expiresAt: 1791113400000
                heartbeatSeconds: 30
                allocatedPorts:
                  systemPort: 52311
                  chromedriverPort: 52312
                  mjpegServerPort: 52313
                appiumCapabilities:
                  platformName: Android
                  appium:automationName: UiAutomator2
                  appium:udid: emulator-5554
                  appium:newCommandTimeout: 120
                  appium:deviceName: Pixel 7 API 34
                  appium:platformVersion: '14'
                  appium:systemPort: 52311
                  appium:chromedriverPort: 52312
                  appium:mjpegServerPort: 52313
                  xe:options:
                    leaseId: clxa1b2c30000s8k2f9d1e7aa
                    buildId: build-2026-10-04-nightly
                    leaseMember: 0
                    leaseToken: 7f3c9a1e5b2d48f0a6c4e8b1d3f5a7c9e2b4d6f8a0c1e3b5d7f9a2c4e6b8d0f1
                members:
                  - index: 0
                    device:
                      udid: emulator-5554
                      host: http://192.168.1.100:4723
                      platform: android
                      sdk: '14'
                      name: Pixel 7 API 34
                      screen:
                        width: '1080'
                        height: '2400'
                      realDevice: false
                    allocatedPorts:
                      systemPort: 52311
                      chromedriverPort: 52312
                      mjpegServerPort: 52313
                    appiumCapabilities:
                      platformName: Android
                      appium:automationName: UiAutomator2
                      appium:udid: emulator-5554
                      appium:newCommandTimeout: 120
                      appium:deviceName: Pixel 7 API 34
                      appium:platformVersion: '14'
                      appium:systemPort: 52311
                      appium:chromedriverPort: 52312
                      appium:mjpegServerPort: 52313
                      xe:options:
                        leaseId: clxa1b2c30000s8k2f9d1e7aa
                        buildId: build-2026-10-04-nightly
                        leaseMember: 0
                        leaseToken: 7f3c9a1e5b2d48f0a6c4e8b1d3f5a7c9e2b4d6f8a0c1e3b5d7f9a2c4e6b8d0f1
        '202':
          description: |
            Only with `waitMs` above 0: the phones can't all be had now, and
            the request waits in the queue until `waitUntil`. Keep
            `leaseToken`: heartbeat every `heartbeatSeconds` to keep the
            place (three missed heartbeats end the wait), `GET` the lease
            with `waitMs` to be answered as soon as it is granted, and
            `DELETE` to give up, which lets go of the phones held for it.
            `position` is 1 for the oldest waiter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GridLeaseWaiting'
              example:
                leaseId: clxa1b2c30000s8k2f9d1e7ab
                leaseToken: 2b4d6f8a0c1e3b5d7f9a2c4e6b8d0f17f3c9a1e5b2d48f0a6c4e8b1d3f5a7c9e
                status: waiting
                position: 2
                waitUntil: 1791112200000
                heartbeatSeconds: 30
        '400':
          description: |
            The request can't be read: `filters.platform` is missing, both
            `filters` and `members` are sent, `members` doesn't list 1 to 8
            members, a member has no `filters.platform`, or `waitMs` isn't an
            integer from 0 to 3600000.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: bad_request
                details: filters.platform required
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: >-
            No set of devices the caller can see, busy or not, could fill every member, one
            each. Nothing is written, and the request doesn't wait.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: no_matching_device
                message: No device matches the filters
        '409':
          description: >-
            With `waitMs` 0: devices match, but the members can't all be filled from the free
            ones now (the rest are busy, leased, held for a waiting lease, blocked, reserved or
            unhealthy). Nothing is held. Retry after `retryAfterMs`, or send `waitMs` to wait in
            the queue.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: all_matching_busy
                retryAfterMs: 2000
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          description: The lease could not be recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: internal
                message: Unique constraint failed on the fields
        '503':
          description: |
            With `waitMs` 0: the devices were found but a member's ports could
            not be reserved: its server didn't answer, or this server has no
            credentials for it (`XENON_HUB_ACCESS_KEY` and `XENON_HUB_TOKEN`,
            needed whenever auth is enabled). Every member's device and ports
            are given back, and that device is passed over for 60 s. With
            `waitMs` the request goes on waiting instead.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: device_unhealthy
                details: 'port allocation failed: connect ECONNREFUSED 192.168.1.100:4723'
  /api/sdk/leases/{id}/heartbeat:
    post:
      operationId: heartbeatGridLease
      summary: Keep a lease alive
      description: |
        Records a heartbeat, so the lease isn't ended for missed heartbeats.
        It does not move `expiresAt`; use extend for that. A lease waiting
        in the queue heartbeats too, to keep its place: three missed
        heartbeats end the wait. Its answer also has `status: waiting` and
        its `position`, and `expiresAt` is 0 until it is granted. Needs the
        lease token in `x-xenon-lease-token`, role `MEMBER` or above and the
        `devices` scope.

        An unknown id answers like a wrong token (`403 token_mismatch`), so
        lease ids can't be probed. A lease that has ended or passed
        `expiresAt`, or a wait that has run out, answers `410` to its
        token's holder, with `reason` when a group ended because it lost a
        member.
      tags:
        - Leases
      parameters:
        - $ref: '#/components/parameters/GridLeaseId'
        - $ref: '#/components/parameters/GridLeaseToken'
      responses:
        '200':
          description: The heartbeat was recorded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  heartbeatedAt:
                    type: integer
                    description: Epoch milliseconds.
                  expiresAt:
                    type: integer
                    description: Epoch milliseconds; 0 while the lease waits.
                  status:
                    type: string
                    enum:
                      - waiting
                    description: Only while the lease waits in the queue.
                  position:
                    type: integer
                    description: Only while the lease waits; 1 for the oldest waiter.
              examples:
                active:
                  summary: A granted lease
                  value:
                    heartbeatedAt: 1791111630000
                    expiresAt: 1791113400000
                waiting:
                  summary: A lease waiting in the queue
                  value:
                    heartbeatedAt: 1791111630000
                    expiresAt: 0
                    status: waiting
                    position: 2
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/GridLeaseForbidden'
        '410':
          $ref: '#/components/responses/GridLeaseGone'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/GridLeaseInternal'
  /api/sdk/leases/{id}/extend:
    post:
      operationId: extendGridLease
      summary: Extend a lease
      description: |
        Makes the lease last at least `durationMs` from now, and counts as a
        heartbeat. It never shortens the lease: a `durationMs` smaller than
        the time left keeps the current end, which is answered. A lease never
        runs past 24 hours after it was created: a later end is cut to that.
        Through 2.18 the end was set to `durationMs` from now, so a smaller
        `durationMs` shortened the lease.

        When the end moves, the server each device is attached to is asked
        to hold that member's driver ports until then (`/api/ports/extend`).
        That call doesn't hold up the answer; a server from 2.18 or earlier
        keeps the ports only for the lease's first duration plus 5 minutes.

        Needs the lease token in `x-xenon-lease-token`, role `MEMBER` or
        above and the `devices` scope. An unknown id answers `403
        token_mismatch`; a lease still waiting in the queue answers `409
        lease_waiting`; an ended or expired lease answers `410`.
      tags:
        - Leases
      parameters:
        - $ref: '#/components/parameters/GridLeaseId'
        - $ref: '#/components/parameters/GridLeaseToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - durationMs
              properties:
                durationMs:
                  type: integer
                  description: How long from now the lease should last at least, in milliseconds.
                  example: 1800000
      responses:
        '200':
          description: The lease's new end.
          content:
            application/json:
              schema:
                type: object
                properties:
                  expiresAt:
                    type: integer
                    description: Epoch milliseconds.
              example:
                expiresAt: 1791115200000
        '400':
          description: '`durationMs` is missing or not a number.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: bad_request
                details: durationMs required
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/GridLeaseForbidden'
        '409':
          description: >-
            The lease is still waiting in the queue: it has no end to extend until it is
            granted. Heartbeat to keep its place.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: lease_waiting
                message: >-
                  lease clxa1b2c30000s8k2f9d1e7ab is waiting in the queue: extend it once it is
                  granted
        '410':
          description: >-
            The lease has ended (released, expired or swept). `reason` says why, when a group
            ended because it lost a member.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                ended:
                  summary: A lease that has ended
                  value:
                    error: gone
                group:
                  summary: A group that lost a member
                  value:
                    error: gone
                    reason: member 1 (emulator-5556) disconnected
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/GridLeaseInternal'
  /api/sdk/leases/{id}:
    get:
      operationId: getGridLease
      summary: Read a lease, or wait for its grant
      description: |
        The lease as its creation answers it: `202` with its `position`
        while it waits in the queue, `200` with the granted body (every
        member's device, ports and `appiumCapabilities`) once it is
        granted. It counts as a heartbeat.

        With `waitMs` (up to 25000) a waiting lease is answered as soon as
        it is granted, or at the limit with its state then. Ask again to go
        on waiting: no request outlasts what a proxy allows.

        Needs the lease token in `x-xenon-lease-token`, role `MEMBER` or
        above and the `devices` scope. An unknown id answers like a wrong
        token (`403 token_mismatch`). A lease that has ended, or a wait that
        has run out, answers `410`, with `reason` when a group ended
        because it lost a member.
      tags:
        - Leases
      parameters:
        - $ref: '#/components/parameters/GridLeaseId'
        - $ref: '#/components/parameters/GridLeaseToken'
        - in: query
          name: waitMs
          required: false
          description: >-
            How long to wait for a waiting lease to be granted, in milliseconds: 0 (the
            default) answers at once.
          schema:
            type: integer
            minimum: 0
            maximum: 25000
            example: 25000
      responses:
        '200':
          description: >-
            The lease, granted. The same body as its creation's `201`, with the same token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GridLease'
        '202':
          description: The lease is still waiting in the queue.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GridLeaseWaiting'
              example:
                leaseId: clxa1b2c30000s8k2f9d1e7ab
                leaseToken: 2b4d6f8a0c1e3b5d7f9a2c4e6b8d0f17f3c9a1e5b2d48f0a6c4e8b1d3f5a7c9e
                status: waiting
                position: 1
                waitUntil: 1791112200000
                heartbeatSeconds: 30
        '400':
          description: '`waitMs` isn''t an integer from 0 to 25000.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: bad_request
                details: waitMs must be an integer from 0 to 25000
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/GridLeaseForbidden'
        '410':
          $ref: '#/components/responses/GridLeaseGone'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/GridLeaseInternal'
    delete:
      operationId: releaseGridLease
      summary: Release a lease, or give up a wait
      description: |
        Ends the lease and gives back its ports. The device is freed unless
        an Appium session still holds it; that session keeps it until it
        ends. A lease past `expiresAt` that the sweep hasn't ended yet can
        still be released. A group's members are all released.

        A lease still waiting in the queue gives up: it leaves the queue and
        lets go of the devices held for it.

        A node's phone has its ports on the node, which is asked to free them
        (`/api/ports/release`) without holding up the answer. A node from 2.19
        or earlier keeps them until their own end: the lease's last end plus 5
        minutes.

        Needs the lease token in `x-xenon-lease-token`, role `MEMBER` or
        above and the `devices` scope. An unknown id answers `403
        token_mismatch`; a lease that has already ended, or a wait already
        given up, answers `404`.
      tags:
        - Leases
      parameters:
        - $ref: '#/components/parameters/GridLeaseId'
        - $ref: '#/components/parameters/GridLeaseToken'
      responses:
        '204':
          description: The lease is released, or its wait given up. No body.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/GridLeaseForbidden'
        '404':
          description: The lease has already ended.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: not_found
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/GridLeaseInternal'
  /api/sdk/version:
    get:
      operationId: getGridSdkVersion
      summary: Get the version and features for SDKs
      description: |
        The plugin's version and the SDK features this server supports, so
        a client can check compatibility before leasing. Needs role
        `MEMBER` or above.
      tags:
        - Leases
      responses:
        '200':
          description: The version and features.
          content:
            application/json:
              schema:
                type: object
                properties:
                  pluginVersion:
                    type: string
                  supports:
                    type: array
                    items:
                      type: string
                      enum:
                        - leases
                        - ports
                        - heartbeat
                        - lease-groups
                        - lease-queue
              example:
                pluginVersion: 2.12.0
                supports:
                  - leases
                  - ports
                  - heartbeat
                  - lease-groups
                  - lease-queue
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/ports/allocate:
    post:
      operationId: allocateGridPorts
      summary: Reserve driver ports on this server
      description: |
        Picks a free local port on this server for each purpose and records
        it as leased to `udid` for `durationMs` plus 5 minutes. A hub calls
        it on the server a device is attached to (itself included) when it
        creates a lease, with its node credentials. The device isn't
        checked to exist.

        Needs role `ADMIN` and the `devices` scope.
      tags:
        - Leases
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - udid
                - host
                - purposes
              properties:
                udid:
                  type: string
                  example: emulator-5554
                host:
                  type: string
                  example: http://192.168.1.100:4723
                purposes:
                  type: array
                  minItems: 1
                  items:
                    $ref: '#/components/schemas/GridPortPurpose'
                durationMs:
                  type: integer
                  description: How long to hold the ports. Default 1800000 (30 minutes); a value of 0 or less uses the default.
                  default: 1800000
                leaseId:
                  type: string
                  description: The lease the ports are for, if known.
            example:
              udid: emulator-5554
              host: http://192.168.1.100:4723
              purposes:
                - systemPort
                - chromedriverPort
                - mjpegServerPort
              durationMs: 1800000
      responses:
        '200':
          description: The port reserved for each purpose.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ports:
                    type: object
                    additionalProperties:
                      type: integer
              example:
                ports:
                  systemPort: 52311
                  chromedriverPort: 52312
                  mjpegServerPort: 52313
        '400':
          description: '`udid`, `host` or `purposes` is missing, or a purpose is unknown.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: bad_request
                details: udid, host, purposes (non-empty, valid) required
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          description: A port could not be reserved; none of this request's ports are kept.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: allocate_failed
                details: Unique constraint failed on the fields (`port`)
  /api/ports/extend:
    post:
      operationId: extendGridPorts
      summary: Hold a lease's driver ports for longer
      description: |
        Holds the given ports, while they are still leased to `udid`, until
        `expiresAt` plus 5 minutes, at most 24 hours from now. A port already
        held longer keeps its end. A hub calls it on the server a device is
        attached to (itself included) when a lease on that device is
        extended, with its node credentials. Ports this server doesn't hold
        for `udid` are left alone; `extended` counts the ones moved.

        Needs role `ADMIN` and the `devices` scope.
      tags:
        - Leases
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - udid
                - ports
                - expiresAt
              properties:
                udid:
                  type: string
                  example: emulator-5554
                ports:
                  type: array
                  minItems: 1
                  items:
                    type: integer
                expiresAt:
                  type: integer
                  description: The lease's new end, epoch milliseconds.
            example:
              udid: emulator-5554
              ports:
                - 52311
                - 52312
                - 52313
              expiresAt: 1791115200000
      responses:
        '200':
          description: How many of the ports now end later.
          content:
            application/json:
              schema:
                type: object
                properties:
                  extended:
                    type: integer
              example:
                extended: 3
        '400':
          description: '`udid`, `ports` or `expiresAt` is missing, or a port is not an integer.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: bad_request
                details: udid, ports (non-empty, integers), expiresAt required
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          description: The ports could not be updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: extend_failed
                details: database is locked
  /api/ports/release:
    post:
      operationId: releaseGridPorts
      summary: Free a lease's driver ports
      description: |
        Frees the given ports while they are still leased to `udid`. Ports
        another phone has been given since are left alone, and `released`
        counts the ones freed. A hub calls it on the server a device is
        attached to when a lease on that device ends (released, or ended by
        the sweep), with its node credentials. Ports this server reserved
        for its own phones' leases are freed by the lease itself, so a hub
        calls it only for another server's phone.

        Needs role `ADMIN` and the `devices` scope.
      tags:
        - Leases
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - udid
                - ports
              properties:
                udid:
                  type: string
                  example: emulator-5554
                ports:
                  type: array
                  minItems: 1
                  items:
                    type: integer
            example:
              udid: emulator-5554
              ports:
                - 52311
                - 52312
                - 52313
      responses:
        '200':
          description: How many of the ports were freed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  released:
                    type: integer
              example:
                released: 3
        '400':
          description: '`udid` or `ports` is missing, or a port is not an integer.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: bad_request
                details: udid and ports (non-empty, integers) required
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          description: The ports could not be freed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: release_failed
                details: database is locked
  /api/queue:
    get:
      operationId: listGridQueue
      summary: List the session requests waiting for a device
      description: |
        The session requests waiting for a free device, as the
        capabilities each client sent (`alwaysMatch` merged over the first
        `firstMatch`), with `capability_id` and `createdAt`.

        An admin sees all of them. A member sees a request that names
        (`appium:udid`) a device they can see, or that they made, or that
        came from one of their teams; the rest are only counted, in
        `otherCount` of `GET /api/queue/summary`. A request queued by a
        server that didn't record who made it is only counted for a
        member.

        Credentials are removed before a request is queued; any
        secret-named key a row still holds reads `***REDACTED***`, for
        every caller. Needs role `MEMBER` or above.
      tags:
        - Queue
      responses:
        '200':
          description: The waiting requests the caller may see, oldest first as stored.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GridQueuedRequest'
              example:
                - platformName: Android
                  appium:automationName: UiAutomator2
                  appium:udid: emulator-5554
                  xe:options:
                    buildId: build-2026-10-04-nightly
                  capability_id: 3f2b8c1e-9a4d-4e7b-b2c6-1d8e5f7a9c0b
                  createdAt: 1791111600000
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/queue/length:
    get:
      operationId: getGridQueueLength
      summary: Count the session requests waiting
      description: |
        How many session requests are waiting in the whole queue, as a bare
        number. Every caller gets the same number, including requests they
        can't see in `GET /api/queue`; it equals `total` in the summary.
        Needs role `MEMBER` or above.
      tags:
        - Queue
      responses:
        '200':
          description: The number of waiting requests.
          content:
            application/json:
              schema:
                type: integer
              example: 3
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/queue/summary:
    get:
      operationId: getGridQueueSummary
      summary: Summarise the session queue
      description: |
        Counts only. `total` and `byPlatform` cover the whole queue, as
        `GET /api/queue/length` does; `otherCount` is how many of them the
        caller doesn't get in detail from `GET /api/queue` (0 for an admin).
        `avgDurationMs` is the average of the platform's last 20 finished
        sessions, or 300000 (5 minutes) without history. Platforms are
        lowercase; a request naming none is `any`. Needs role `MEMBER` or
        above.
      tags:
        - Queue
      responses:
        '200':
          description: The queue's counts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  otherCount:
                    type: integer
                  byPlatform:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        count:
                          type: integer
                        avgDurationMs:
                          type: integer
              example:
                total: 3
                otherCount: 1
                byPlatform:
                  android:
                    count: 2
                    avgDurationMs: 412000
                  ios:
                    count: 1
                    avgDurationMs: 300000
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/queue/status/{capability_id}:
    get:
      operationId: getGridQueuedRequestStatus
      summary: Get a waiting request's position and wait
      description: |
        Where one waiting session request stands among the requests for
        its platform, and a rough wait: its position divided by the number
        of devices of that platform, times the average session duration
        (0 when it is first and a device is free).

        `404` when the request has already been given a device, was
        dropped, or is one the caller can't see in `GET /api/queue`: the
        same answer as for an unknown id. Needs role `MEMBER` or above.
      tags:
        - Queue
      parameters:
        - in: path
          name: capability_id
          required: true
          description: The request's `capability_id`, as `GET /api/queue` lists it.
          schema:
            type: string
            example: 3f2b8c1e-9a4d-4e7b-b2c6-1d8e5f7a9c0b
      responses:
        '200':
          description: The request's place in the queue.
          content:
            application/json:
              schema:
                type: object
                properties:
                  position:
                    type: integer
                    description: 1 is next.
                  totalInQueue:
                    type: integer
                    description: Waiting requests for this platform (or any platform).
                  etaInMs:
                    type: integer
                  platform:
                    type: string
                  matchedDevicesCount:
                    type: integer
                  availableDevicesCount:
                    type: integer
              example:
                position: 2
                totalInQueue: 2
                etaInMs: 206000
                platform: android
                matchedDevicesCount: 4
                availableDevicesCount: 0
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No such waiting request, or one the caller can't see.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Pending session not found
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/register:
    post:
      operationId: reportGridNodeDevices
      summary: Report a node's devices to its hub
      description: |
        How a node keeps its hub's device list current. Nodes call it
        themselves, with the access key and token they were provisioned
        with (`XENON_HUB_ACCESS_KEY`, `XENON_HUB_TOKEN`); it isn't meant for
        other clients. Needs role `ADMIN` and the `devices` scope.

        `type` selects the operation:

        | `type` | Body | Effect |
        |---|---|---|
        | `add` | the node's devices | Adds or refreshes each one |
        | `remove` | devices, each with `udid` and `nodeId` or `host` | Forgets those devices |
        | `unregister` | `[]` | Forgets every device of the node named by `nodeId` or `host` in the query |

        A report (`add`) updates only what the node observes: discovery
        fields such as name, version and ports, and health. Whether the
        device is busy on the node goes to `nodeBusy`, and a preview hold
        there to `nodeHold`. The hub's own settings (team, tags,
        reservation, block, its claim for a session) are never taken from
        a report, and a report of "free" never frees a device the hub has
        claimed.

        A removal takes only the node's own rows: by `nodeId` when given,
        otherwise by exactly `host`. It never takes one of the hub's own
        devices, and an entry with no udid, or with neither `nodeId` nor
        `host`, takes nothing. Any other `type`, or none, changes nothing
        and still answers `200`.
      tags:
        - Hub-Node
      security:
        - AccessKeyAuth: []
          TokenAuth: []
      parameters:
        - in: query
          name: type
          required: true
          description: The operation.
          schema:
            type: string
            enum:
              - add
              - remove
              - unregister
        - in: query
          name: host
          required: false
          description: For `unregister`, the node's host, used when `nodeId` isn't sent.
          schema:
            type: string
            example: http://192.168.1.100:4723
        - in: query
          name: nodeId
          required: false
          description: For `unregister`, the node's id; every device the node reported goes, whatever its host.
          schema:
            type: string
            example: 6b1e4c2a-8f3d-4a9e-b7c5-2d0f1e8a9b3c
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/GridNodeDeviceReport'
            examples:
              add:
                summary: type=add
                value:
                  - udid: emulator-5554
                    host: http://192.168.1.100:4723
                    nodeId: 6b1e4c2a-8f3d-4a9e-b7c5-2d0f1e8a9b3c
                    name: Pixel 7 API 34
                    platform: android
                    sdk: '14'
                    state: device
                    deviceType: emulator
                    realDevice: false
                    busy: false
                    offline: false
                    healthStatus: Healthy
              remove:
                summary: type=remove
                value:
                  - udid: emulator-5554
                    host: http://192.168.1.100:4723
                    nodeId: 6b1e4c2a-8f3d-4a9e-b7c5-2d0f1e8a9b3c
              unregister:
                summary: type=unregister
                value: []
      responses:
        '200':
          description: The report was applied (or ignored, for an unknown `type`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
              example:
                success: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/node:
    get:
      operationId: listGridNodeHosts
      summary: List the hosts that have devices
      description: |
        The distinct `host` of every device the caller can see: this
        server and, on a hub, each node. A host whose devices all belong to
        teams the caller isn't in isn't listed. Needs role `MEMBER` or
        above.
      tags:
        - Hub-Node
      responses:
        '200':
          description: The hosts.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
              example:
                - http://192.168.1.10:4723
                - http://192.168.1.100:4723
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/node/status:
    get:
      operationId: getGridLocalNodeStatus
      summary: List the devices attached to this server
      description: |
        Runs device discovery on this server now (Android and iOS, real
        devices and emulators or simulators) and lists what it finds, with
        each device's `state` as discovery reports it. Devices of other
        servers aren't included. Needs role `ADMIN` and the `admin` scope.
      tags:
        - Hub-Node
      responses:
        '200':
          $ref: '#/components/responses/GridNodeStatusOk'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/node/{host}/status:
    get:
      operationId: getGridNodeStatus
      summary: List the devices attached to one server
      description: |
        When `host` is this server's bind address (`bindHostOrIp`), the
        same as `GET /api/node/status`. Otherwise the hub looks for a
        device whose host contains `host` and asks that server's
        `/xenon/api/node/status`, returning its answer. That request
        carries no credentials, so it works only against a node with auth
        disabled; a node that refuses it, or can't be reached, answers
        `502`.

        Needs role `ADMIN` and the `admin` scope.
      tags:
        - Hub-Node
      parameters:
        - in: path
          name: host
          required: true
          description: This server's bind address, or part of a node's host (such as its IP).
          schema:
            type: string
            example: 192.168.1.100
      responses:
        '200':
          $ref: '#/components/responses/GridNodeStatusOk'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No device is listed under that host, so there is nowhere to ask. Plain text.
          content:
            text/html:
              schema:
                type: string
              example: Host 192.168.1.200 does not have any devices listed in database. I don't know how to forward request to that host
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          description: The node refused the request or couldn't be reached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: node_unreachable
                message: "Could not get http://192.168.1.200:4723's status: connect ECONNREFUSED 192.168.1.200:4723"
  /api/node/sessions/{sessionId}:
    get:
      operationId: getGridNodeSessionStatus
      summary: Say whether a session exists on this node
      description: |
        Node only: a hub asks it about each session it routes to the node,
        about every 30 s, instead of sending a WebDriver command, which
        would keep an abandoned session alive. It runs no command. Only a
        server started with `hub` set has this route.

        It is answered before the login, with what a command to that
        session would need. With per-command auth off
        (`XENON_REQUIRE_COMMAND_AUTH`) or auth disabled, no credential.
        With it on, the hub's session token for that session in
        `x-xenon-hub-token`; any other caller gets WebDriver's
        unknown-session answer, `404`, and a hub key set that can't be
        fetched is `503`. It isn't rate-limited.

        Every answer from a node carries `x-xenon-node-sessions: 1`, so a
        hub can tell a node that has the route from an older one.
      tags:
        - Hub-Node
      security:
        - HubToken: []
        - {}
      parameters:
        - $ref: '#/components/parameters/GridNodeSessionId'
      responses:
        '200':
          description: Whether this node's Appium has the session.
          headers:
            x-xenon-node-sessions:
              description: Always `1` on a node.
              schema:
                type: string
                example: '1'
          content:
            application/json:
              schema:
                type: object
                properties:
                  value:
                    type: object
                    properties:
                      sessionId:
                        type: string
                      exists:
                        type: boolean
              example:
                value:
                  sessionId: 9d4c2f1a-7b3e-4e8a-a6d5-0c1b2e3f4a5b
                  exists: true
        '401':
          $ref: '#/components/responses/GridNotANodeUnauthorized'
        '404':
          $ref: '#/components/responses/GridNodeUnknownSession'
        '503':
          $ref: '#/components/responses/GridNodeTokenUnavailable'
  /api/node/sessions/{sessionId}/metrics:
    get:
      operationId: getGridNodeSessionMetrics
      summary: Collect a session's CPU and memory from this node
      description: |
        Node only: a hub collects the CPU and memory samples a node has
        taken for a session on one of its phones, every 10 s and once more
        when the session ends. The node keeps them in memory: the newest
        900 per session, an ended session's for 10 minutes. Only a server
        started with `hub` set has this route.

        `after` asks for the samples newer than that time, and the node
        drops the older ones, so a later call never returns them again.
        `state` is `sampling`, `stopped` (the sampler gave up), `ended`, or
        `off` (the node has nothing for this session).

        It is answered before the login, with the same rule as
        `GET /api/node/sessions/{sessionId}`: no credential with
        per-command auth off or auth disabled, otherwise the hub's session
        token for that session. Every answer from a node carries
        `x-xenon-node-metrics: 1`. It isn't rate-limited.
      tags:
        - Hub-Node
      security:
        - HubToken: []
        - {}
      parameters:
        - $ref: '#/components/parameters/GridNodeSessionId'
        - in: query
          name: after
          required: false
          description: Epoch milliseconds; only newer samples are returned, and older ones are dropped. Anything that isn't a plain number is ignored.
          schema:
            type: number
            example: 1791111600000
      responses:
        '200':
          description: The session's samples.
          headers:
            x-xenon-node-metrics:
              description: Always `1` on a node.
              schema:
                type: string
                example: '1'
          content:
            application/json:
              schema:
                type: object
                properties:
                  value:
                    $ref: '#/components/schemas/GridNodeMetrics'
              example:
                value:
                  platform: android
                  state: sampling
                  samples:
                    - at: 1791111602000
                      deviceCpuPct: 23.5
                      deviceMemMb: 4120
                      deviceMemTotalMb: 7680
                      appCpuPct: 11.2
                      appMemMb: 286
                      appId: com.example.shop
                    - at: 1791111604000
                      deviceCpuPct: 19.1
                      deviceMemMb: 4128
                      deviceMemTotalMb: 7680
                      appCpuPct: 8.7
                      appMemMb: 289
                      appId: com.example.shop
        '401':
          $ref: '#/components/responses/GridNotANodeUnauthorized'
        '404':
          $ref: '#/components/responses/GridNodeUnknownSession'
        '503':
          $ref: '#/components/responses/GridNodeTokenUnavailable'
  /api/node/sessions/{sessionId}/device-logs:
    get:
      operationId: getGridNodeSessionDeviceLogs
      summary: Collect a session's device log lines from this node
      description: |
        Node only: a hub collects the device log lines a node has recorded
        for a session on one of its phones, as soon as the session is
        created, every 10 s after that, and once more when the session
        ends. The hub writes them as the session's Device logs. Only a
        server started with `hub` set has this route.

        The node records each session its hub created, with the same limit
        as a session on the hub's own phone (10,000 lines, then up to 2,000
        more errors), and keeps the lines in memory until the hub collects
        them, an ended session's for 10 minutes. If no hub asks within 2
        minutes of the start, the node stops recording that session.

        Each line has a number, `seq`, counting up from 1. `after` asks for
        the lines after that number, and the node drops the others, so a
        later call never returns them again. An answer holds at most 2,000
        lines; `more` says the node has others, to ask for at once. `state`
        is `recording`, `ended`, or `off` (the node doesn't record this
        session). `timestamp` is the line's moment by the node's clock.

        It is answered before the login, with the same rule as
        `GET /api/node/sessions/{sessionId}`: no credential with
        per-command auth off or auth disabled, otherwise the hub's session
        token for that session. Every answer from a node carries
        `x-xenon-node-device-logs: 1`. It isn't rate-limited.
      tags:
        - Hub-Node
      security:
        - HubToken: []
        - {}
      parameters:
        - $ref: '#/components/parameters/GridNodeSessionId'
        - in: query
          name: after
          required: false
          description: A line number; only later lines are returned, and the others are dropped. Anything that isn't a plain number is ignored.
          schema:
            type: integer
            example: 2000
      responses:
        '200':
          description: The session's lines.
          headers:
            x-xenon-node-device-logs:
              description: Always `1` on a node.
              schema:
                type: string
                example: '1'
          content:
            application/json:
              schema:
                type: object
                properties:
                  value:
                    $ref: '#/components/schemas/GridNodeDeviceLogs'
              example:
                value:
                  state: recording
                  more: false
                  lines:
                    - seq: 2001
                      message: '10-05 14:20:02.114  4127  4127 I ActivityManager: Start proc 4127:com.example.shop/u0a215'
                      timestamp: 1791111602114
                    - seq: 2002
                      message: '10-05 14:20:02.391  4127  4127 E AndroidRuntime: FATAL EXCEPTION: main'
                      timestamp: 1791111602391
        '401':
          $ref: '#/components/responses/GridNotANodeUnauthorized'
        '404':
          $ref: '#/components/responses/GridNodeUnknownSession'
        '503':
          $ref: '#/components/responses/GridNodeTokenUnavailable'
  /api/status:
    get:
      operationId: getGridServerStatus
      summary: Check that the server answers
      description: |
        A signed-in liveness check. `version` comes from the npm
        environment, so a server not started through an npm script reports
        `unknown (not running from npm package)`; `GET /api/ping` reports
        the plugin's version. Needs role `MEMBER` or above.
      tags:
        - Health & Ops
      responses:
        '200':
          description: The server is up.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                  version:
                    type: string
              example:
                status: ok
                version: unknown (not running from npm package)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/webdriver:
    get:
      operationId: getGridWebDriverBasePath
      summary: Get this server's WebDriver base path
      description: |
        Where this server's Appium WebDriver API lives, relative to its
        origin: `''` for Appium's default, or a path such as `/wd/hub`. A
        hub asks each node before it sends the node a session or a command
        (and caches the answer for a minute), since hub and node needn't
        share a base path. Public: no credential and no rate limit.
      tags:
        - Health & Ops
      security: []
      responses:
        '200':
          description: The base path.
          content:
            application/json:
              schema:
                type: object
                properties:
                  basePath:
                    type: string
                    description: Empty, or a path starting with `/` and without a trailing `/`.
              example:
                basePath: /wd/hub
components:
  parameters:
    GridSessionIdQuery:
      in: query
      name: sessionId
      required: false
      description: Return only the device running this Appium session (an object), or an empty body when none does.
      schema:
        type: string
        example: 9d4c2f1a-7b3e-4e8a-a6d5-0c1b2e3f4a5b
    GridReservationUdid:
      in: path
      name: udid
      required: true
      description: The device's udid.
      schema:
        type: string
        example: emulator-5554
    GridReservationHost:
      in: path
      name: host
      required: true
      description: The device's host, URL-encoded.
      schema:
        type: string
        example: http%3A%2F%2F192.168.1.100%3A4723
    GridLeaseId:
      in: path
      name: id
      required: true
      description: The lease's `leaseId`.
      schema:
        type: string
        example: clxa1b2c30000s8k2f9d1e7aa
    GridLeaseToken:
      in: header
      name: x-xenon-lease-token
      required: true
      description: The `leaseToken` from the lease's creation.
      schema:
        type: string
        example: 7f3c9a1e5b2d48f0a6c4e8b1d3f5a7c9e2b4d6f8a0c1e3b5d7f9a2c4e6b8d0f1
    GridNodeSessionId:
      in: path
      name: sessionId
      required: true
      description: The Appium session's id on the node.
      schema:
        type: string
        example: 9d4c2f1a-7b3e-4e8a-a6d5-0c1b2e3f4a5b
  headers:
    GridDeprecation:
      description: Always `true`; reservations are deprecated in favour of leases.
      schema:
        type: string
        example: 'true'
    GridSunset:
      description: When reservations will be removed.
      schema:
        type: string
        example: '2027-01-01T00:00:00Z'
    GridLink:
      description: Where the lease API that replaces reservations is described (`rel="alternate"`).
      schema:
        type: string
  responses:
    GridDeviceListOk:
      description: |
        The visible devices; with `sessionId`, the one device running that
        session, or an empty body when none does.
      content:
        application/json:
          schema:
            oneOf:
              - type: array
                items:
                  $ref: '#/components/schemas/GridDevice'
              - $ref: '#/components/schemas/GridDevice'
          example:
            - udid: 00008110-00084CE80E51401E
              name: iPhone 14 Pro
              platform: ios
              host: http://192.168.1.10:4723
              busy: true
              session_id: 9d4c2f1a-7b3e-4e8a-a6d5-0c1b2e3f4a5b
              state: device
              sdk: '17.4'
              deviceType: real
              realDevice: true
              offline: false
              userBlocked: false
              teamId: clx9k2v0a0000qz8r4h7m3n2p
              teamName: Checkout
              healthStatus: Healthy
              batteryLevel: 87
            - udid: emulator-5554
              name: Pixel 7 API 34
              platform: android
              host: http://192.168.1.100:4723
              nodeId: 6b1e4c2a-8f3d-4a9e-b7c5-2d0f1e8a9b3c
              busy: false
              session_id: null
              state: device
              sdk: '14'
              deviceType: emulator
              realDevice: false
              offline: false
              userBlocked: false
              teamId: null
              teamName: null
              tags:
                - lab-row-3
              reservedBy: null
              reservedUntil: null
              healthStatus: Healthy
              batteryLevel: 100
              screenWidth: '1080'
              screenHeight: '2400'
    GridDeviceNotFound:
      description: No such device, or one outside your teams (the two answer the same).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            error: Device not found
    GridDeviceSelectorMissing:
      description: '`udid` or `host` is missing, or not a string.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            error: bad_request
            message: udid and host are required
    GridNotReserved:
      description: The device isn't reserved.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            error: Device is not reserved
    GridReservationFailed:
      description: The reservation store failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            error: Failed to reserve device
    GridLeaseForbidden:
      description: |
        No lease token (`missing_lease_token`), a token that doesn't match or
        an unknown lease id (`token_mismatch`), the role or scope is missing,
        or the same-origin check failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            missing:
              value:
                error: missing_lease_token
            mismatch:
              value:
                error: token_mismatch
            scope:
              value:
                error: insufficient scope
    GridLeaseGone:
      description: |
        The lease has ended (released, expired or swept), or its wait in the
        queue has run out. `reason` says why, when a group ended because it
        lost a member.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            ended:
              summary: A lease that has ended
              value:
                error: gone
                message: lease clxa1b2c30000s8k2f9d1e7aa is expired
            group:
              summary: A group that lost a member
              value:
                error: gone
                message: lease clxa1b2c30000s8k2f9d1e7aa is ended
                reason: member 1 (emulator-5556) disconnected
    GridLeaseInternal:
      description: An unexpected error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: internal
            message: Can't reach database server
    GridNodeStatusOk:
      description: The attached devices.
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
              properties:
                udid:
                  type: string
                host:
                  type: string
                state:
                  type: string
                platform:
                  type: string
                  enum:
                    - ios
                    - android
          example:
            - udid: emulator-5554
              host: http://192.168.1.100:4723
              state: device
              platform: android
            - udid: 00008110-00084CE80E51401E
              host: http://192.168.1.100:4723
              state: device
              platform: ios
    GridNotANodeUnauthorized:
      description: |
        Never sent by a node. A server that isn't a node has no such route,
        so its login answers first: `401` without credentials (and `404`
        with them).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: unauthenticated
    GridNodeUnknownSession:
      description: |
        Per-command auth is on and the request has no valid hub session
        token for this session. WebDriver's unknown-session answer, the same
        whether or not the session exists.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GridWebDriverError'
          example:
            value:
              error: invalid session id
              message: A session is either terminated or not started
              stacktrace: ''
    GridNodeTokenUnavailable:
      description: The hub's token could not be checked (its key set couldn't be fetched). Try again.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GridWebDriverError'
          example:
            value:
              error: unknown error
              message: Xenon could not verify access to this session. Try again.
              stacktrace: ''
  schemas:
    GridDevice:
      description: A device as the device lists return it, with its team's name.
      allOf:
        - $ref: '#/components/schemas/Device'
        - type: object
          properties:
            teamName:
              type: string
              nullable: true
              description: The team's name; null for the shared pool.
            tags:
              type: array
              items:
                type: string
            nodeBusy:
              type: boolean
              nullable: true
              description: On a hub, whether the node last reported the device busy.
            nodeHold:
              type: string
              nullable: true
              description: On a hub, the preview hold the node last reported (`manual_<userId>_<udid>`).
            leaseState:
              type: string
              nullable: true
              enum:
                - held
                - leased
                - null
              description: >-
                What an SDK lease does with the device: `held` while a waiting lease keeps it
                until the lease is granted, `leased` once it is; null when no live lease has it,
                or when the leases could not be read.
            dashboard_link:
              type: string
              description: >-
                Only with the Appium dashboard plugin installed: the plugin's page for this device,
                under `XENON_PUBLIC_URL`, or a path on this server when it isn't set.
            total_session_count:
              type: integer
              description: Only with the Appium dashboard plugin installed.
    GridDeviceSelector:
      type: object
      description: Picks a device by both its `udid` and its `host`, exactly as `GET /api/devices` shows them.
      required:
        - udid
        - host
      properties:
        udid:
          type: string
        host:
          type: string
    GridReservationDuration:
      description: '`1h`, `2h`, `4h` or `8h`, or a number of milliseconds. A reservation lasts from 1 minute to 24 hours, and an extension may not end it more than 24 hours from now.'
      oneOf:
        - type: string
          enum:
            - 1h
            - 2h
            - 4h
            - 8h
        - type: integer
          example: 5400000
    GridReservation:
      type: object
      properties:
        udid:
          type: string
        host:
          type: string
        name:
          type: string
        platform:
          type: string
          enum:
            - ios
            - android
        reservedBy:
          type: string
        reservedUntil:
          type: integer
          description: Epoch milliseconds.
        reservationReason:
          type: string
          nullable: true
        remainingMs:
          type: integer
    GridLeaseCreateRequest:
      type: object
      description: '`filters` (one phone) or `members` (several), never both.'
      properties:
        filters:
          $ref: '#/components/schemas/GridLeaseFilters'
        members:
          type: array
          description: The phones of the lease, one per member, in order. 1 to 8.
          minItems: 1
          maxItems: 8
          items:
            type: object
            required:
              - filters
            properties:
              filters:
                $ref: '#/components/schemas/GridLeaseFilters'
        waitMs:
          type: integer
          description: >-
            How long the request may wait in the queue. 0 tries once; up to 3600000 (60
            minutes).
          minimum: 0
          maximum: 3600000
          default: 0
        durationMs:
          type: integer
          description: How long the lease lasts. Kept between 60000 (1 minute) and 86400000 (24 hours).
          default: 1800000
        heartbeatSeconds:
          type: integer
          description: How often you will send a heartbeat. Kept between 10 and 300.
          default: 30
        reason:
          type: string
        buildId:
          type: string
          description: Carried into `appiumCapabilities` as `xe:options.buildId`.
    GridLeaseFilters:
      type: object
      required:
        - platform
      properties:
        platform:
          type: string
          enum:
            - android
            - ios
        udid:
          type: string
          description: Lease this device only.
        deviceType:
          type: string
          enum:
            - real
            - simulator
            - emulator
        tags:
          type: array
          description: The device must carry every one of these tags.
          items:
            type: string
        platformVersion:
          type: string
          description: The OS version must equal this (compared as a version).
        minSDK:
          type: string
          example: '13'
        maxSDK:
          type: string
          example: '15'
        sdk:
          type: string
          description: The OS version, as `platformVersion`; `platformVersion` wins if both are sent.
        deviceName:
          type: string
          description: The device's name, ignoring case.
    GridLeaseDevice:
      type: object
      properties:
        udid:
          type: string
        host:
          type: string
        platform:
          type: string
        sdk:
          type: string
        name:
          type: string
        screen:
          type: object
          properties:
            width:
              type: string
              nullable: true
            height:
              type: string
              nullable: true
        realDevice:
          type: boolean
    GridLeaseWaiting:
      type: object
      properties:
        leaseId:
          type: string
        leaseToken:
          type: string
          description: The lease's secret. Shown only here.
        status:
          type: string
          enum:
            - waiting
        position:
          type: integer
          description: The request's place in the queue, 1 for the oldest waiter.
        waitUntil:
          type: integer
          description: When the request gives up, epoch milliseconds.
        heartbeatSeconds:
          type: integer
    GridLease:
      type: object
      properties:
        leaseId:
          type: string
        leaseToken:
          type: string
          description: The lease's secret. Shown only here.
        device:
          allOf:
            - $ref: '#/components/schemas/GridLeaseDevice'
          description: Member 0's device.
        expiresAt:
          type: integer
          description: Epoch milliseconds.
        heartbeatSeconds:
          type: integer
        allocatedPorts:
          type: object
          description: 'Member 0''s ports: `systemPort`, `chromedriverPort` and `mjpegServerPort` for Android; `wdaLocalPort` and `mjpegServerPort` for iOS.'
          additionalProperties:
            type: integer
        appiumCapabilities:
          type: object
          description: >-
            Member 0's capabilities for `POST /session`, including `xe:options.leaseId`,
            `xe:options.leaseToken` and `xe:options.leaseMember`.
          additionalProperties: true
        members:
          type: array
          description: Every member of the lease, by index.
          items:
            type: object
            properties:
              index:
                type: integer
              device:
                $ref: '#/components/schemas/GridLeaseDevice'
              allocatedPorts:
                type: object
                additionalProperties:
                  type: integer
              appiumCapabilities:
                type: object
                description: >-
                  This member's capabilities for `POST /session`, with `xe:options.leaseId`,
                  `xe:options.leaseToken` and `xe:options.leaseMember` (its index).
                additionalProperties: true
    GridPortPurpose:
      type: string
      enum:
        - systemPort
        - wdaLocalPort
        - chromedriverPort
        - mjpegServerPort
    GridQueuedRequest:
      type: object
      description: The capabilities a waiting session request sent, merged, plus its queue fields.
      properties:
        capability_id:
          type: string
        createdAt:
          type: integer
          description: Epoch milliseconds.
      additionalProperties: true
    GridNodeDeviceReport:
      type: object
      description: |
        One device in a node's report. For `add`, the node's full view of the
        device (the fields of `Device`); for `remove`, `udid` with `nodeId`
        or `host`.
      required:
        - udid
      properties:
        udid:
          type: string
        host:
          type: string
        nodeId:
          type: string
        busy:
          type: boolean
          description: Busy on the node; stored as `nodeBusy`.
        session_id:
          type: string
          nullable: true
          description: The node's session or hold; a preview hold is stored as `nodeHold`.
      additionalProperties: true
    GridNodeMetrics:
      type: object
      properties:
        platform:
          type: string
          description: Lowercase; empty when `state` is `off`.
        state:
          type: string
          enum:
            - sampling
            - stopped
            - ended
            - 'off'
        samples:
          type: array
          items:
            type: object
            properties:
              at:
                type: integer
                description: Epoch milliseconds.
              deviceCpuPct:
                type: number
                nullable: true
              deviceMemMb:
                type: number
                nullable: true
              deviceMemTotalMb:
                type: number
                nullable: true
              appCpuPct:
                type: number
                nullable: true
              appMemMb:
                type: number
                nullable: true
              appId:
                type: string
                nullable: true
                description: The app the app figures are for (Android), else null.
    GridNodeDeviceLogs:
      type: object
      properties:
        state:
          type: string
          enum:
            - recording
            - ended
            - 'off'
        more:
          type: boolean
          description: The node holds more lines than this answer; ask again with the last `seq`.
        lines:
          type: array
          items:
            type: object
            properties:
              seq:
                type: integer
                description: The line's number in the session, from 1.
              message:
                type: string
                description: The line as the device printed it.
              timestamp:
                type: integer
                description: Epoch milliseconds, by the node's clock.
    GridWebDriverError:
      type: object
      description: A WebDriver-style error, as Appium answers one.
      properties:
        value:
          type: object
          properties:
            error:
              type: string
            message:
              type: string
            stacktrace:
              type: string
