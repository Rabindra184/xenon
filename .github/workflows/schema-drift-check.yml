name: Schema Drift Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  drift-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Prisma migrate diff (migrations ↔ schema)
        env:
          DATABASE_URL: 'file:./ci-check.db'
        run: |
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --exit-code || {
              echo "::error::Schema drift detected. Run 'npm run db:generate -- --name <change>' to add a migration."
              exit 1
            }
          echo "Schema and migrations are in sync."

      - name: Generated client freshness
        run: node scripts/check-client-freshness.js

      # The launcher's palette is generated from the dashboard's tokens.css, so
      # a change to one must not silently leave the other behind. The script has
      # no dependencies, so it runs without installing mac-app/.
      - name: Design token drift (dashboard ↔ mac-app)
        run: |
          node mac-app/scripts/sync-tokens.mjs --check || {
            echo "::error::Design token drift. Run 'npm run sync:tokens' in mac-app/ and commit tokens.css."
            exit 1
          }
