server:
  # Keep Alive Timeout (-ka)
  keepAliveTimeout: 800
  # Base Path (-pa)
  basePath: /wd/hub
  # Enable Xenon Plugin
  usePlugins:
    - xenon
  # Plugin Configuration
  plugin:
    xenon:
      # Platform to run tests against
      platform: both
      # Max concurrent sessions
      maxSessions: 8
      # Enable Dashboard plugin integration
      enableDashboard: true
      # Include already booted simulators
      bootedSimulators: true
      
      # Additional Recommended Settings for Production
      # deviceAvailabilityTimeoutMs: 180000
      # newCommandTimeoutSec: 120

      # Database Configuration (for Horizontal Scaling)
      # databaseProvider: postgresql
      # databaseUrl: "postgresql://user:password@localhost:5432/xenon"

      # AI Root-Cause Analysis (Requires GEMINI_API_KEY environment variable)
      # aiProvider: gemini
      # aiModel: gemini-1.5-flash
